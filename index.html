 "lese", "lesen", "liest"], "a": 3, "e": "e → ie ở ngôi sie."}, {"q": "Wir _____ heute nicht kommen, wir sind krank.", "o": ["kann", "könnt", "können", "kannst"], "a": 2, "e": "wir können."}, {"q": "„_____ ich hier sitzen?“ – „Ja, natürlich.“", "o": ["Muss", "Darf", "Will", "Soll"], "a": 1, "e": "Xin phép → dürfen."}, {"q": "Morgen _____ ich meine Eltern _____.", "o": ["rufe … an", "anrufe … –", "rufe … auf", "ruft … an"], "a": 0, "e": "anrufen tách: rufe … an."}, {"q": "Kinder, _____ bitte leise!", "o": ["sei", "seien", "sind", "seid"], "a": 3, "e": "Imperativ ngôi ihr của sein: Seid!"}, {"q": "Der Arzt sagt, du _____ nicht so viel arbeiten.", "o": ["willst", "möchtest", "sollst", "kannst"], "a": 2, "e": "Lời khuyên của người khác → sollen."}, {"q": "Heute Abend _____.", "o": ["ich sehe fern", "sehe ich fern", "ich fernsehe", "sehe fern ich"], "a": 1, "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ sau, tiền tố cuối."}, {"q": "_____ du mir bitte helfen?", "o": ["Kannst", "Darfst", "Musst", "Sollst"], "a": 0, "e": "Nhờ vả → Kannst du …?"}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Liebe Oma, wie {1} es dir? Mir geht es gut. Ich wohne jetzt in Berlin. Meine Wohnung ist klein, aber {2} ist sehr schön. Jeden Morgen {3} ich mit dem Bus zur Uni. Am Nachmittag {4} ich in einem Café arbeiten. Am Wochenende {5} ich oft meine Freunde. Wann {6} du mich besuchen? Viele Grüße, Mai", "qs": [{"o": ["geht", "gehst", "gehen", "gehe"], "a": 0, "e": "Wie geht es dir?"}, {"o": ["er", "es", "ihr", "sie"], "a": 3, "e": "die Wohnung → sie."}, {"o": ["fährt", "fährst", "fahre", "fahren"], "a": 2, "e": "Ngôi ich không đổi nguyên âm."}, {"o": ["musst", "muss", "müssen", "müsst"], "a": 1, "e": "ich muss."}, {"o": ["treffe", "trifft", "triffst", "treffen"], "a": 0, "e": "ich treffe."}, {"o": ["kommt", "komme", "kommen", "kommst"], "a": 3, "e": "du kommst."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Lena ist 30 Jahre alt und wohnt mit ihrem Mann Jonas in Hamburg. Sie ist Lehrerin, er ist Ingenieur. Lena steht jeden Tag um halb sechs auf, denn die Schule fängt schon um acht Uhr an und sie fährt eine Stunde mit dem Zug. Jonas arbeitet zu Hause. Er kann lange schlafen und kocht am Abend für beide. Am Wochenende wollen sie oft ans Meer fahren, aber Lena muss am Samstag oft Tests korrigieren.", "qs": [{"q": "Was ist Lena von Beruf?", "o": ["Ingenieurin", "Lehrerin", "Köchin", "Studentin"], "a": 1, "e": "„Sie ist Lehrerin“."}, {"q": "Wie fährt Lena zur Arbeit?", "o": ["Mit dem Zug", "Mit dem Auto", "Mit dem Fahrrad", "Zu Fuß"], "a": 0, "e": "„… fährt eine Stunde mit dem Zug“."}, {"q": "Wer kocht am Abend?", "o": ["Lena", "Lenas Mutter", "Niemand", "Jonas"], "a": 3, "e": "„Er … kocht am Abend für beide“."}, {"q": "Warum fahren sie am Wochenende oft nicht ans Meer?", "o": ["Jonas muss arbeiten.", "Sie haben kein Auto.", "Lena muss Tests korrigieren.", "Das Wetter ist schlecht."], "a": 2, "e": "„… aber Lena muss am Samstag oft Tests korrigieren“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Mein Freund {A|kommt} aus Spanien und {B|sprecht} {C|sehr} gut {D|Deutsch}.", "a": 1, "fix": "spricht", "e": "Ngôi er: e → i."}, {"q": "Wir {A|möchtet} heute Abend {B|ins Kino} {C|gehen}, {D|oder}?", "a": 0, "fix": "möchten", "e": "wir möchten."}, {"q": "{A|Die} Lampe ist {B|neu}, {C|er} {D|kostet} 30 Euro.", "a": 2, "fix": "sie", "e": "die Lampe → sie."}, {"q": "{A|Am Montag} {B|ich muss} {C|früh} {D|aufstehen}.", "a": 1, "fix": "muss ich", "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ theo sau."}, {"q": "Anna, {A|lest} bitte {B|den Text} {C|laut} {D|vor}!", "a": 0, "fix": "lies", "e": "Nói với một người (du): vorlesen → Lies … vor!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Ich kann nicht schwimmen.", "o": ["Ich darf nicht schwimmen.", "Ich will nicht schwimmen.", "Ich muss nicht schwimmen.", "Schwimmen ist für mich nicht möglich."], "a": 3, "e": "können = khả năng."}, {"q": "Komm bitte mit!", "o": ["Du kommst nicht mit.", "Ich komme mit.", "Kommst du bitte mit?", "Kommt bitte mit!"], "a": 2, "e": "Imperativ ngôi du = lời đề nghị với du; „Kommt“ là nói với ihr."}, {"q": "Arbeiten ist am Sonntag nicht nötig.", "o": ["Am Sonntag darf ich nicht arbeiten.", "Am Sonntag muss ich nicht arbeiten.", "Am Sonntag kann ich nicht arbeiten.", "Am Sonntag will ich arbeiten."], "a": 1, "e": "nicht nötig = nicht müssen."}, {"q": "Meine Mutter sagt: „Räum dein Zimmer auf!“", "o": ["Ich soll mein Zimmer aufräumen.", "Ich will mein Zimmer aufräumen.", "Ich darf mein Zimmer aufräumen.", "Ich kann mein Zimmer aufräumen."], "a": 0, "e": "Yêu cầu của người khác → sollen."}, {"q": "Fotografieren ist hier erlaubt.", "o": ["Man muss hier fotografieren.", "Man darf hier nicht fotografieren.", "Man will hier fotografieren.", "Man darf hier fotografieren."], "a": 3, "e": "erlaubt = được phép = dürfen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Was ___ (essen) du gern?", "a": ["isst", "ißt"], "e": "e → i: du isst."}, {"q": "Ihr ___ (sein) sehr nett.", "a": ["seid"], "e": "ihr seid."}, {"q": "Er ___ (warten) schon zehn Minuten.", "a": ["wartet"], "e": "Gốc -t → thêm e."}, {"q": "Du ___ (schlafen) zu lange.", "a": ["schläfst"], "e": "a → ä."}, {"q": "Mein Sohn ___ (können) schon Rad fahren.", "a": ["kann"], "e": "er kann."}, {"q": "___ (helfen) mir bitte, Paul!", "a": ["hilf"], "e": "Imperativ du: Hilf!"}, {"q": "Meine Eltern ___ (möchten) nach Berlin fahren.", "a": ["möchten"], "e": "Số nhiều → möchten."}, {"q": "Der Kurs ___ (anfangen) um 9 Uhr an.", "a": ["fängt"], "e": "fängt … an."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Ich rufe dich morgen an. (wollen)", "start": "Ich will", "a": ["Ich will dich morgen anrufen"], "e": "Modalverb vị trí 2, anrufen cuối câu."}, {"q": "Kannst du bitte die Tür zumachen?", "start": "Mach", "a": ["Mach bitte die Tür zu", "Mach die Tür bitte zu", "Mach die Tür zu"], "e": "Imperativ du, zu cuối câu."}, {"q": "Er fährt heute nach Köln.", "start": "Heute", "a": ["Heute fährt er nach Köln"], "e": "Heute vị trí 1 → động từ vị trí 2."}, {"q": "Essen ist hier verboten.", "start": "Man", "a": ["Man darf hier nicht essen"], "e": "verboten = nicht dürfen."}, {"q": "Wir sehen am Abend fern. (möchten)", "start": "Wir möchten", "a": ["Wir möchten am Abend fernsehen"], "e": "fernsehen viết liền cuối câu."}, {"q": "Warten Sie bitte hier!", "start": "Können Sie", "a": ["Können Sie bitte hier warten", "Können Sie hier bitte warten"], "e": "Lời đề nghị lịch sự với können."}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "du / heute Abend / mitkommen / ?", "a": ["Kommst du heute Abend mit"], "e": "Câu hỏi có/không: động từ đầu câu, mit cuối câu."}, {"q": "ich / am Wochenende / mein Zimmer / aufräumen / müssen", "a": ["Ich muss am Wochenende mein Zimmer aufräumen", "Am Wochenende muss ich mein Zimmer aufräumen"], "e": "muss vị trí 2, aufräumen cuối câu."}, {"q": "Lisa / jeden Morgen / im Park / laufen", "a": ["Lisa läuft jeden Morgen im Park", "Jeden Morgen läuft Lisa im Park"], "e": "au → äu: läuft."}, {"q": "ihr / Deutsch / sprechen / können / ?", "a": ["Könnt ihr Deutsch sprechen"], "e": "Könnt đầu câu, sprechen cuối câu."}]}]}]},
3:{"title": "ĐỀ ÔN TẬP SỐ 3", "sub": "Verben 1 · Kapitel 1–8", "code": "103", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ eine E-Mail an meinen Chef.", "o": ["lese", "höre", "spreche", "schreibe"], "a": 3, "e": "schreiben = viết."}, {"q": "Im Sommer _____ wir ans Meer.", "o": ["kochen", "schlafen", "fahren", "trinken"], "a": 2, "e": "fahren = đi (bằng xe)."}, {"q": "Der Laden _____ um 9 Uhr auf.", "o": ["steht", "macht", "ruft", "kauft"], "a": 1, "e": "aufmachen = mở cửa."}, {"q": "Ich bin müde. Ich _____ jetzt ins Bett.", "o": ["gehe", "esse", "lese", "arbeite"], "a": 0, "e": "ins Bett gehen = đi ngủ."}, {"q": "„_____ du Geschwister?“ – „Ja, eine Schwester.“", "o": ["Bist", "Heißt", "Kommst", "Hast"], "a": 3, "e": "Geschwister haben = có anh chị em."}, {"q": "Meine Nummer ist 0151 2345678. Du kannst mich morgen _____.", "o": ["aufstehen", "fernsehen", "anrufen", "einkaufen"], "a": 2, "e": "anrufen = gọi điện."}, {"q": "Wir _____ Freunde zum Abendessen ein.", "o": ["kaufen", "laden", "rufen", "machen"], "a": 1, "e": "einladen = mời."}, {"q": "Nach dem Essen _____ ich das Geschirr.", "o": ["spüle", "koche", "esse", "trinke"], "a": 0, "e": "spülen = rửa bát."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Woher _____ ihr?", "o": ["kommt", "kommen", "kommst", "komme"], "a": 0, "e": "ihr kommt."}, {"q": "„Wo ist die Brille?“ – „_____ liegt auf dem Sofa.“", "o": ["Er", "Es", "Ihr", "Sie"], "a": 3, "e": "die Brille → sie."}, {"q": "Tom und Lisa, _____ ihr heute Abend Zeit?", "o": ["haben", "hast", "habt", "hat"], "a": 2, "e": "ihr habt."}, {"q": "Mein Opa _____ gern im Garten.", "o": ["arbeitt", "arbeitet", "arbeiten", "arbeitest"], "a": 1, "e": "Gốc -t → arbeitet."}, {"q": "Er _____ immer den Zug um 8 Uhr.", "o": ["nimmt", "nehmt", "nimmst", "nehmen"], "a": 0, "e": "nehmen → er nimmt."}, {"q": "Ich _____ heute leider nicht kommen.", "o": ["kannst", "können", "könnt", "kann"], "a": 3, "e": "ich kann."}, {"q": "Im Krankenhaus _____ man das Handy ausmachen.", "o": ["darf", "will", "muss", "möchte"], "a": 2, "e": "Bắt buộc → müssen."}, {"q": "Wann _____?", "o": ["der Film fängt an", "fängt der Film an", "fängt an der Film", "anfängt der Film"], "a": 1, "e": "Từ hỏi – động từ – chủ ngữ – … – tiền tố."}, {"q": "Peter, _____ nicht so viel Schokolade!", "o": ["iss", "isst", "esse", "esst"], "a": 0, "e": "Imperativ du của essen: Iss!"}, {"q": "Ich habe morgen eine Prüfung. Ich _____ heute lange lernen.", "o": ["darf", "möchtet", "könnt", "muss"], "a": 3, "e": "Cần thiết → müssen."}, {"q": "_____ Sie bitte langsam!", "o": ["Sprich", "Sprecht", "Sprechen", "Sprichst"], "a": 2, "e": "Imperativ Sie: nguyên mẫu + Sie."}, {"q": "Meine Nachbarn _____ aus Polen.", "o": ["kommt", "kommen", "kommst", "komme"], "a": 1, "e": "Số nhiều → kommen."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Mein Name {1} Hoa. Ich komme aus Da Nang und lebe seit einem Jahr in Leipzig. Ich studiere Informatik. Mein Studium ist interessant, aber {2} ist auch schwer. Jeden Tag {3} ich viel lernen. Am Abend {4} ich oft mit meiner Mitbewohnerin. {5} kommt aus Spanien und kocht sehr gut. Am Sonntag schlafen wir lange und {6} dann zusammen im Park spazieren.", "qs": [{"o": ["bin", "ist", "sind", "bist"], "a": 1, "e": "Mein Name ist …"}, {"o": ["es", "er", "sie", "ihr"], "a": 0, "e": "das Studium → es."}, {"o": ["müssen", "musst", "müsst", "muss"], "a": 3, "e": "ich muss."}, {"o": ["kocht", "kochst", "koche", "kochen"], "a": 2, "e": "ich koche."}, {"o": ["Er", "Sie", "Es", "Ihr"], "a": 1, "e": "die Mitbewohnerin → sie."}, {"o": ["gehen", "geht", "gehe", "gehst"], "a": 0, "e": "wir gehen."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Herr Schulz ist 68 Jahre alt und arbeitet nicht mehr. Er wohnt allein in einem kleinen Haus in Freiburg. Jeden Morgen läuft er eine halbe Stunde im Wald. Dann frühstückt er und liest die Zeitung. Am Dienstag und am Donnerstag hilft er Kindern bei den Hausaufgaben. Er spricht gut Englisch und Französisch und möchte jetzt Italienisch lernen, denn er will im Mai mit seiner Tochter nach Rom fahren.", "qs": [{"q": "Was macht Herr Schulz jeden Morgen zuerst?", "o": ["Er frühstückt.", "Er liest die Zeitung.", "Er läuft im Wald.", "Er hilft Kindern."], "a": 2, "e": "„Jeden Morgen läuft er … Dann frühstückt er …“"}, {"q": "Wann hilft er Kindern?", "o": ["Jeden Morgen", "Am Dienstag und Donnerstag", "Am Wochenende", "Im Mai"], "a": 1, "e": "„Am Dienstag und am Donnerstag hilft er Kindern …“"}, {"q": "Welche Sprache spricht er noch NICHT?", "o": ["Italienisch", "Englisch", "Französisch", "Deutsch"], "a": 0, "e": "Ông ấy mới muốn học tiếng Ý."}, {"q": "Warum möchte er Italienisch lernen?", "o": ["Seine Tochter wohnt in Italien.", "Er arbeitet in Italien.", "Die Kinder lernen Italienisch.", "Er fährt im Mai nach Rom."], "a": 3, "e": "„… denn er will im Mai … nach Rom fahren“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Meine Eltern {A|wohnt} {B|seit} zehn Jahren {C|in} {D|Berlin}.", "a": 0, "fix": "wohnen", "e": "Số nhiều → wohnen."}, {"q": "{A|Kannst} du {B|kochen} {C|heute} {D|Abend}?", "a": 1, "fix": "kochen phải đứng cuối câu", "e": "Nguyên mẫu ở cuối câu: Kannst du heute Abend kochen?"}, {"q": "Das Auto {A|ist} alt, {B|aber} {C|sie} {D|fährt} noch gut.", "a": 2, "fix": "es", "e": "das Auto → es."}, {"q": "Er {A|fahrt} {B|jeden Tag} {C|mit dem Rad} {D|zur Arbeit}.", "a": 0, "fix": "fährt", "e": "a → ä ở ngôi er."}, {"q": "Frau Lange, {A|komm} {B|bitte} {C|herein}, {D|der Arzt} wartet.", "a": 0, "fix": "kommen Sie", "e": "Với Frau Lange dùng Imperativ lịch sự: Kommen Sie bitte herein!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Lukas spielt sehr gut Gitarre.", "o": ["Lukas kann sehr gut Gitarre spielen.", "Lukas will Gitarre spielen.", "Lukas muss Gitarre spielen.", "Lukas darf Gitarre spielen."], "a": 0, "e": "Kỹ năng → können."}, {"q": "Der Arzt sagt: „Trinken Sie mehr Wasser!“", "o": ["Ich darf kein Wasser trinken.", "Ich will mehr Wasser trinken.", "Ich kann kein Wasser trinken.", "Ich soll mehr Wasser trinken."], "a": 3, "e": "Lời khuyên của người khác → sollen."}, {"q": "Telefonieren ist im Kino verboten.", "o": ["Im Kino muss man telefonieren.", "Im Kino kann man gut telefonieren.", "Im Kino darf man nicht telefonieren.", "Im Kino möchte man telefonieren."], "a": 2, "e": "verboten = nicht dürfen."}, {"q": "Einen Kaffee, bitte!", "o": ["Ich muss einen Kaffee kochen.", "Ich möchte bitte einen Kaffee.", "Ich darf keinen Kaffee trinken.", "Ich soll einen Kaffee kaufen."], "a": 1, "e": "Gọi đồ lịch sự → möchten."}, {"q": "Ihr müsst heute nicht kommen.", "o": ["Ihr könnt kommen, aber es ist nicht nötig.", "Ihr dürft heute nicht kommen.", "Ihr wollt heute nicht kommen.", "Ihr könnt heute nicht kommen."], "a": 0, "e": "nicht müssen = không cần."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "___ (lesen) du gern Zeitung?", "a": ["liest"], "e": "du liest."}, {"q": "Wir ___ (haben) einen Hund.", "a": ["haben"], "e": "wir haben."}, {"q": "Der Film ___ (gefallen) mir sehr.", "a": ["gefällt"], "e": "a → ä: gefällt."}, {"q": "___ (sein) bitte pünktlich, Max!", "a": ["sei"], "e": "Imperativ du của sein: Sei!"}, {"q": "Ihr ___ (müssen) mehr lernen.", "a": ["müsst", "müßt"], "e": "ihr müsst."}, {"q": "Mia ___ (tragen) eine rote Jacke.", "a": ["trägt"], "e": "a → ä."}, {"q": "Ich ___ (einkaufen) heute im Supermarkt ein.", "a": ["kaufe"], "e": "kaufe … ein."}, {"q": "Du ___ (reden) zu viel.", "a": ["redest"], "e": "Gốc -d → du redest."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Wir laden unsere Nachbarn ein. (möchten)", "start": "Wir möchten", "a": ["Wir möchten unsere Nachbarn einladen"], "e": "einladen viết liền cuối câu."}, {"q": "Kannst du bitte langsam fahren?", "start": "Fahr", "a": ["Fahr bitte langsam", "Fahr langsam bitte", "Fahr langsam"], "e": "Imperativ du, bỏ umlaut: Fahr!"}, {"q": "Ich lerne am Abend Deutsch.", "start": "Am Abend", "a": ["Am Abend lerne ich Deutsch"], "e": "Trạng ngữ vị trí 1 → động từ vị trí 2."}, {"q": "Parken ist hier erlaubt.", "start": "Man", "a": ["Man darf hier parken"], "e": "erlaubt = dürfen."}, {"q": "Er steht um fünf Uhr auf. (müssen)", "start": "Er muss", "a": ["Er muss um fünf Uhr aufstehen"], "e": "aufstehen cuối câu."}, {"q": "Lies den Text! (đổi sang ngôi Sie)", "start": "Lesen", "a": ["Lesen Sie den Text"], "e": "Imperativ Sie: nguyên mẫu + Sie."}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "wir / morgen / nach Hamburg / fahren / wollen", "a": ["Wir wollen morgen nach Hamburg fahren", "Morgen wollen wir nach Hamburg fahren"], "e": "wollen vị trí 2, fahren cuối câu."}, {"q": "der Unterricht / um neun Uhr / anfangen", "a": ["Der Unterricht fängt um neun Uhr an", "Um neun Uhr fängt der Unterricht an"], "e": "fängt … an."}, {"q": "du / Fleisch / essen / ?", "a": ["Isst du Fleisch"], "e": "Động từ đầu câu; du isst."}, {"q": "ich / heute / nicht / kommen / können", "a": ["Ich kann heute nicht kommen", "Heute kann ich nicht kommen"], "e": "kann vị trí 2, kommen cuối câu."}]}]}]},
4:{"title": "ĐỀ ÔN TẬP SỐ 4", "sub": "Verben 1 · Kapitel 1–8", "code": "104", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ jeden Tag mit dem Fahrrad zur Uni.", "o": ["fahre", "gehe", "fliege", "schwimme"], "a": 0, "e": "Mit dem Fahrrad fahren."}, {"q": "Es ist kalt. Mach bitte das Fenster _____!", "o": ["auf", "an", "ein", "zu"], "a": 3, "e": "zumachen = đóng."}, {"q": "Am Abend _____ wir oft zusammen Karten.", "o": ["schreiben", "lesen", "spielen", "kochen"], "a": 2, "e": "Karten spielen = chơi bài."}, {"q": "Im Restaurant _____ ich eine Pizza.", "o": ["verkaufe", "bestelle", "wasche", "schreibe"], "a": 1, "e": "bestellen = gọi món."}, {"q": "Ich _____ meine Freundin am Bahnhof ab.", "o": ["hole", "mache", "gehe", "rufe"], "a": 0, "e": "abholen = đón."}, {"q": "„Was _____ du von Beruf?“ – „Ich bin Krankenschwester.“", "o": ["gehst", "heißt", "kommst", "machst"], "a": 3, "e": "Was machst du von Beruf?"}, {"q": "Wir _____ im Juli nach Spanien.", "o": ["schwimmen", "schlafen", "fliegen", "essen"], "a": 2, "e": "fliegen = bay."}, {"q": "Die Kinder _____ im Garten.", "o": ["kochen", "spielen", "arbeiten", "studieren"], "a": 1, "e": "spielen = chơi."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Das ist Herr Kim. _____ kommt aus Korea.", "o": ["Sie", "Er", "Es", "Ihr"], "a": 1, "e": "Một người nam → er."}, {"q": "„Wie findest du den Rock?“ – „_____ ist sehr schön.“", "o": ["Er", "Sie", "Es", "Ihr"], "a": 0, "e": "der Rock → er."}, {"q": "Wir _____ heute keine Zeit.", "o": ["habt", "hat", "hast", "haben"], "a": 3, "e": "wir haben."}, {"q": "Du _____ immer so schnell!", "o": ["fahrst", "fährt", "fährst", "fahrt"], "a": 2, "e": "a → ä ở ngôi du."}, {"q": "Was _____ ihr am Wochenende?", "o": ["machen", "macht", "machst", "mache"], "a": 1, "e": "ihr macht."}, {"q": "Hier _____ man nicht schwimmen. Das ist gefährlich.", "o": ["darf", "muss", "will", "möchte"], "a": 0, "e": "Bị cấm → nicht dürfen."}, {"q": "Mia _____ Ärztin werden. Das ist ihr Traum.", "o": ["muss", "soll", "darf", "will"], "a": 3, "e": "Ước mơ, ý muốn → wollen."}, {"q": "Wir _____ am Hauptbahnhof _____.", "o": ["aussteigen … –", "steigt … aus", "steigen … aus", "steigen … auf"], "a": 2, "e": "aussteigen = xuống xe → steigen … aus."}, {"q": "_____ Sie mir bitte Ihren Namen!", "o": ["Sag", "Sagen", "Sagt", "Sagst"], "a": 1, "e": "Imperativ Sie."}, {"q": "Mein Bruder _____ sehr gut tanzen.", "o": ["kann", "kannst", "könnt", "können"], "a": 0, "e": "er kann."}, {"q": "Jeden Tag _____.", "o": ["ich lerne Deutsch", "lerne Deutsch ich", "ich Deutsch lerne", "lerne ich Deutsch"], "a": 3, "e": "Trạng ngữ đầu câu → động từ vị trí 2."}, {"q": "Mama, _____ ich heute bei Lisa übernachten?", "o": ["muss", "soll", "darf", "will"], "a": 2, "e": "Xin phép → dürfen."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Hallo Jan! Wir machen am Samstag eine Party. {1} du auch kommen? Die Party {2} um 19 Uhr an. Bring bitte etwas zu trinken {3}! Meine Schwester Nina kommt auch, {4} ist gerade aus London zurück. Wir {5} Musik und tanzen. Du {6} mich gern anrufen, meine Nummer ist 0170 1234567. Viele Grüße, Lea", "qs": [{"o": ["Möchte", "Möchtet", "Möchtest", "Möchten"], "a": 2, "e": "du möchtest."}, {"o": ["fangt", "fängt", "fängst", "fangen"], "a": 1, "e": "anfangen → fängt … an."}, {"o": ["mit", "an", "auf", "ein"], "a": 0, "e": "mitbringen = mang theo."}, {"o": ["er", "es", "ihr", "sie"], "a": 3, "e": "Nina → sie."}, {"o": ["hört", "hörst", "hören", "höre"], "a": 2, "e": "wir hören."}, {"o": ["kann", "kannst", "könnt", "können"], "a": 1, "e": "du kannst."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Familie Nguyen wohnt seit drei Jahren in Stuttgart. Herr Nguyen arbeitet bei einer Autofirma, Frau Nguyen hat ein kleines Restaurant. Sie haben zwei Kinder: Minh ist zwölf und spielt in einem Fußballverein, die kleine Lan ist fünf und geht in den Kindergarten. Am Montag ist das Restaurant geschlossen. Dann kocht Frau Nguyen nicht, und die Familie isst bei Freunden oder fährt in die Stadt. Die Kinder sprechen schon sehr gut Deutsch, aber die Eltern müssen noch viel lernen.", "qs": [{"q": "Wo arbeitet Frau Nguyen?", "o": ["Bei einer Autofirma", "Im Kindergarten", "In einem Fußballverein", "In ihrem Restaurant"], "a": 3, "e": "„Frau Nguyen hat ein kleines Restaurant“."}, {"q": "Wie alt ist Lan?", "o": ["Zwölf", "Drei", "Fünf", "Zwei"], "a": 2, "e": "„die kleine Lan ist fünf“."}, {"q": "Was ist am Montag?", "o": ["Minh spielt Fußball.", "Das Restaurant ist geschlossen.", "Herr Nguyen arbeitet nicht.", "Die Familie kocht zu Hause."], "a": 1, "e": "„Am Montag ist das Restaurant geschlossen“."}, {"q": "Wer spricht schon sehr gut Deutsch?", "o": ["Die Kinder", "Die Eltern", "Herr Nguyen", "Frau Nguyen"], "a": 0, "e": "„Die Kinder sprechen schon sehr gut Deutsch“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Ihr {A|hast} {B|heute} {C|keine} Zeit, {D|oder}?", "a": 0, "fix": "habt", "e": "ihr habt."}, {"q": "Er {A|will} {B|morgen} {C|kaufen} ein neues {D|Handy}.", "a": 2, "fix": "kaufen phải đứng cuối câu", "e": "Er will morgen ein neues Handy kaufen."}, {"q": "Mein Vater {A|liest} gern Zeitung, {B|aber} {C|meine Mutter} {D|lest} lieber Bücher.", "a": 3, "fix": "liest", "e": "Ngôi sie: e → ie."}, {"q": "Das Handy {A|ist} neu, {B|aber} {C|er} {D|funktioniert} nicht.", "a": 2, "fix": "es", "e": "das Handy → es."}, {"q": "Anna und Tom, {A|komm} {B|bitte} {C|schnell} {D|her}!", "a": 0, "fix": "kommt", "e": "Nói với hai người → ngôi ihr: Kommt!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Kommen Sie bitte morgen um 9 Uhr!", "o": ["Sie kommen morgen nicht.", "Können Sie bitte morgen um 9 Uhr kommen?", "Sie dürfen morgen nicht kommen.", "Kommen Sie morgen um 9 Uhr nicht?"], "a": 1, "e": "Imperativ lịch sự ≈ lời đề nghị với können."}, {"q": "Mein Plan: nächstes Jahr in Deutschland studieren.", "o": ["Ich will nächstes Jahr in Deutschland studieren.", "Ich muss nächstes Jahr in Deutschland studieren.", "Ich darf nächstes Jahr nicht in Deutschland studieren.", "Ich soll nächstes Jahr in Deutschland studieren."], "a": 0, "e": "Kế hoạch của bản thân → wollen."}, {"q": "Im Park ist Fußballspielen erlaubt.", "o": ["Im Park muss man Fußball spielen.", "Im Park darf man nicht Fußball spielen.", "Im Park will man Fußball spielen.", "Im Park darf man Fußball spielen."], "a": 3, "e": "erlaubt = dürfen."}, {"q": "Unsere Lehrerin sagt: „Lernt die Wörter!“", "o": ["Wir dürfen die Wörter nicht lernen.", "Wir wollen die Wörter lernen.", "Wir sollen die Wörter lernen.", "Wir können die Wörter lernen."], "a": 2, "e": "Yêu cầu của người khác → sollen."}, {"q": "Mein Bruder hat keinen Führerschein.", "o": ["Mein Bruder kann sehr gut Auto fahren.", "Mein Bruder darf nicht Auto fahren.", "Mein Bruder muss Auto fahren.", "Mein Bruder will Auto fahren."], "a": 1, "e": "Không có bằng lái → không được phép lái: nicht dürfen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Wann ___ (fahren) der Zug ab?", "a": ["fährt"], "e": "fährt … ab."}, {"q": "Du ___ (sein) mein bester Freund.", "a": ["bist"], "e": "du bist."}, {"q": "Er ___ (essen) kein Fleisch.", "a": ["isst", "ißt"], "e": "er isst."}, {"q": "___ (nehmen) Sie bitte Platz!", "a": ["nehmen"], "e": "Imperativ Sie không đổi nguyên âm."}, {"q": "Wir ___ (dürfen) heute länger bleiben.", "a": ["dürfen"], "e": "wir dürfen."}, {"q": "Mein Kollege ___ (arbeiten) auch am Samstag.", "a": ["arbeitet"], "e": "Gốc -t → arbeitet."}, {"q": "___ (geben) ihr mir bitte den Schlüssel?", "a": ["gebt"], "e": "ihr gebt (không đổi nguyên âm)."}, {"q": "Ich ___ (anfangen) morgen einen Deutschkurs an.", "a": ["fange"], "e": "ich fange … an."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Ich hole dich um acht Uhr ab. (können)", "start": "Ich kann", "a": ["Ich kann dich um acht Uhr abholen"], "e": "abholen cuối câu."}, {"q": "Kannst du mir bitte helfen?", "start": "Hilf", "a": ["Hilf mir bitte", "Hilf mir"], "e": "Imperativ du: Hilf!"}, {"q": "Wir essen um 12 Uhr zu Mittag.", "start": "Um 12 Uhr", "a": ["Um 12 Uhr essen wir zu Mittag"], "e": "Trạng ngữ vị trí 1 → động từ vị trí 2."}, {"q": "Rauchen ist im Zug verboten.", "start": "Im Zug", "a": ["Im Zug darf man nicht rauchen"], "e": "verboten = nicht dürfen."}, {"q": "Sie sieht jeden Abend fern. (wollen)", "start": "Sie will", "a": ["Sie will jeden Abend fernsehen"], "e": "fernsehen viết liền cuối câu."}, {"q": "Seid bitte ruhig! (đổi sang ngôi du)", "start": "Sei", "a": ["Sei bitte ruhig", "Sei ruhig bitte", "Sei ruhig"], "e": "sein, ngôi du: Sei!"}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "Paul / jeden Tag / seine Mutter / anrufen", "a": ["Paul ruft jeden Tag seine Mutter an", "Jeden Tag ruft Paul seine Mutter an", "Paul ruft seine Mutter jeden Tag an"], "e": "ruft … an."}, {"q": "ihr / am Wochenende / Zeit / haben / ?", "a": ["Habt ihr am Wochenende Zeit"], "e": "Câu hỏi có/không: động từ đầu câu."}, {"q": "man / hier / nicht / parken / dürfen", "a": ["Man darf hier nicht parken", "Hier darf man nicht parken"], "e": "darf vị trí 2, parken cuối câu."}, {"q": "du / gut / kochen / können / ?", "a": ["Kannst du gut kochen"], "e": "Kannst đầu câu, kochen cuối câu."}]}]}]},
5:{"title": "ĐỀ ÔN TẬP SỐ 5", "sub": "Verben 1 · Kapitel 1–8", "code": "105", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ jeden Abend einen Podcast auf Deutsch.", "o": ["sehe", "höre", "schreibe", "rufe"], "a": 1, "e": "hören = nghe."}, {"q": "Es ist zu laut. Mach bitte die Musik _____!", "o": ["aus", "an", "auf", "ein"], "a": 0, "e": "ausmachen = tắt."}, {"q": "Nach dem Essen _____ wir die Rechnung.", "o": ["bestellen", "kochen", "trinken", "bezahlen"], "a": 3, "e": "bezahlen = trả tiền."}, {"q": "Am Samstag _____ ich mein Zimmer auf.", "o": ["mache", "stehe", "räume", "rufe"], "a": 2, "e": "aufräumen = dọn dẹp."}, {"q": "„Woher _____ Sie?“ – „Aus Österreich.“", "o": ["wohnen", "kommen", "heißen", "gehen"], "a": 1, "e": "Woher kommen Sie?"}, {"q": "Der Zug _____ um 10:30 Uhr in Berlin an.", "o": ["kommt", "fährt", "steht", "macht"], "a": 0, "e": "ankommen = đến nơi."}, {"q": "Ich habe Kopfschmerzen. Ich _____ eine Tablette.", "o": ["gebe", "lese", "schlafe", "nehme"], "a": 3, "e": "eine Tablette nehmen = uống thuốc."}, {"q": "Kannst du mir bitte das Buch _____? Ich möchte es lesen.", "o": ["nehmen", "lesen", "geben", "sehen"], "a": 2, "e": "geben = đưa."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Anna und ich _____ in einer WG.", "o": ["wohnt", "wohne", "wohnen", "wohnst"], "a": 2, "e": "Anna + ich = wir."}, {"q": "„Wo ist das Auto?“ – „_____ steht vor dem Haus.“", "o": ["Er", "Es", "Sie", "Ihr"], "a": 1, "e": "das Auto → es."}, {"q": "Ich _____ heute Geburtstag!", "o": ["habe", "bin", "hat", "ist"], "a": 0, "e": "Geburtstag haben."}, {"q": "Er _____ seiner Mutter in der Küche.", "o": ["helft", "hilfst", "helfen", "hilft"], "a": 3, "e": "e → i: er hilft."}, {"q": "Herr Kaya, _____ Sie einen Moment Zeit?", "o": ["habt", "hast", "haben", "hat"], "a": 2, "e": "Sie haben."}, {"q": "_____ ihr Deutsch oder Englisch?", "o": ["Sprichst", "Sprecht", "Spricht", "Sprechst"], "a": 1, "e": "ihr sprecht (không đổi nguyên âm)."}, {"q": "Kinder unter 12 Jahren _____ den Film nicht sehen.", "o": ["dürfen", "müssen", "möchten", "wollen"], "a": 0, "e": "Quy định cấm → nicht dürfen."}, {"q": "Ich _____ morgen um sechs Uhr _____.", "o": ["aufstehe … –", "stehe … an", "steht … auf", "stehe … auf"], "a": 3, "e": "aufstehen → stehe … auf."}, {"q": "_____ mir bitte, Lisa!", "o": ["Helf", "Hilfst", "Hilf", "Helft"], "a": 2, "e": "Imperativ du: Hilf!"}, {"q": "Meine Frau _____ gut Spanisch sprechen.", "o": ["kannst", "kann", "können", "könnt"], "a": 1, "e": "sie kann."}, {"q": "Am Wochenende _____.", "o": ["schlafen wir lange", "wir schlafen lange", "schlafen lange wir", "wir lange schlafen"], "a": 0, "e": "Trạng ngữ đầu câu → động từ vị trí 2."}, {"q": "Du bist krank. Du _____ zu Hause bleiben.", "o": ["sollt", "sollen", "soll", "sollst"], "a": 3, "e": "du sollst."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Ich heiße Ben und ich {1} 22 Jahre alt. Ich studiere Medizin in Heidelberg. Mein Tag ist lang: Ich {2} um sechs Uhr auf und {3} zuerst eine Stunde im Park. Dann frühstücke ich. Meine Freundin Clara {4} auch Medizin. {5} kommt aus Wien. Am Abend kochen wir zusammen, denn Clara {6} sehr gut kochen.", "qs": [{"o": ["habe", "ist", "bist", "bin"], "a": 3, "e": "Tuổi dùng sein: ich bin."}, {"o": ["stehst", "steht", "stehe", "stehen"], "a": 2, "e": "ich stehe … auf."}, {"o": ["läuft", "laufe", "läufst", "laufen"], "a": 1, "e": "Ngôi ich không đổi: laufe."}, {"o": ["studiert", "studiere", "studierst", "studieren"], "a": 0, "e": "sie studiert."}, {"o": ["Er", "Es", "Ihr", "Sie"], "a": 3, "e": "Clara → sie."}, {"o": ["kannst", "können", "kann", "könnt"], "a": 2, "e": "sie kann."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Liebe Frau Weber, leider kann ich morgen nicht zum Deutschkurs kommen. Ich bin krank und muss zum Arzt gehen. Können Sie mir bitte die Hausaufgaben per E-Mail schicken? Am Donnerstag komme ich wieder. Dann möchte ich auch den Test schreiben. Vielen Dank und viele Grüße, Thanh", "qs": [{"q": "Warum schreibt Thanh die E-Mail?", "o": ["Er kann morgen nicht zum Kurs kommen.", "Er möchte einen neuen Kurs.", "Er sucht einen Arzt.", "Er hat keine Hausaufgaben."], "a": 0, "e": "„… leider kann ich morgen nicht zum Deutschkurs kommen“."}, {"q": "Was soll Frau Weber machen?", "o": ["Thanh anrufen.", "Zum Arzt gehen.", "Den Test schreiben.", "Die Hausaufgaben per E-Mail schicken."], "a": 3, "e": "„Können Sie mir bitte die Hausaufgaben per E-Mail schicken?“"}, {"q": "Wann kommt Thanh wieder zum Kurs?", "o": ["Morgen", "Nächste Woche", "Am Donnerstag", "Am Montag"], "a": 2, "e": "„Am Donnerstag komme ich wieder“."}, {"q": "Wer ist Frau Weber wahrscheinlich?", "o": ["Seine Ärztin", "Seine Deutschlehrerin", "Seine Mutter", "Seine Nachbarin"], "a": 1, "e": "Thanh hỏi bà về bài tập của khóa học tiếng Đức."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Wir {A|ist} {B|heute} {C|sehr} {D|müde}.", "a": 0, "fix": "sind", "e": "wir sind."}, {"q": "{A|Morgen} {B|ich fahre} {C|nach} {D|München}.", "a": 1, "fix": "fahre ich", "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ theo sau."}, {"q": "Mein Bruder {A|isst} gern Pizza, {B|aber} ich {C|isst} lieber {D|Reis}.", "a": 2, "fix": "esse", "e": "Ngôi ich không đổi nguyên âm: ich esse."}, {"q": "Er {A|möchtet} {B|einen} Tee {C|mit} {D|Zucker}.", "a": 0, "fix": "möchte", "e": "er möchte, không có -t."}, {"q": "Herr Braun, {A|nimm} {B|bitte} {C|Platz}, {D|der Chef} kommt gleich.", "a": 0, "fix": "nehmen Sie", "e": "Với Herr Braun dùng Imperativ lịch sự: Nehmen Sie bitte Platz!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Unsere Tochter liest schon sehr gut.", "o": ["Unsere Tochter muss lesen.", "Unsere Tochter darf lesen.", "Unsere Tochter kann schon sehr gut lesen.", "Unsere Tochter will nicht lesen."], "a": 2, "e": "Khả năng → können."}, {"q": "Hilf mir bitte!", "o": ["Ich helfe dir.", "Kannst du mir bitte helfen?", "Du hilfst mir nicht.", "Helft mir bitte!"], "a": 1, "e": "Imperativ du ≈ lời nhờ với können; „Helft“ là nói với ihr."}, {"q": "Schwimmen ist hier verboten.", "o": ["Hier darf man nicht schwimmen.", "Hier muss man schwimmen.", "Hier kann man gut schwimmen.", "Hier möchte man schwimmen."], "a": 0, "e": "verboten = nicht dürfen."}, {"q": "Mitbringen ist nicht nötig.", "o": ["Sie dürfen nichts mitbringen.", "Sie können nichts mitbringen.", "Sie wollen nichts mitbringen.", "Sie müssen nichts mitbringen."], "a": 3, "e": "nicht nötig = nicht müssen."}, {"q": "Mein Chef sagt: „Schreiben Sie den Bericht!“", "o": ["Ich will den Bericht schreiben.", "Ich darf den Bericht nicht schreiben.", "Ich soll den Bericht schreiben.", "Ich kann den Bericht nicht schreiben."], "a": 2, "e": "Yêu cầu của người khác → sollen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Wie ___ (heißen) du?", "a": ["heißt", "heisst"], "e": "Gốc -ß → du heißt."}, {"q": "Ihr ___ (haben) ein schönes Auto.", "a": ["habt"], "e": "ihr habt."}, {"q": "Mein Opa ___ (schlafen) nach dem Essen.", "a": ["schläft"], "e": "a → ä."}, {"q": "___ (lesen) bitte laut, Mia!", "a": ["lies"], "e": "Imperativ du: Lies!"}, {"q": "Er ___ (müssen) heute zum Arzt.", "a": ["muss", "muß"], "e": "er muss."}, {"q": "Wir ___ (aussteigen) an der nächsten Haltestelle aus.", "a": ["steigen"], "e": "steigen … aus."}, {"q": "Du ___ (antworten) nicht!", "a": ["antwortest"], "e": "Gốc -t → antwortest."}, {"q": "Was ___ (empfehlen) Sie mir?", "a": ["empfehlen"], "e": "Ngôi Sie không đổi nguyên âm."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Ich kaufe heute ein. (müssen)", "start": "Ich muss", "a": ["Ich muss heute einkaufen"], "e": "einkaufen viết liền cuối câu."}, {"q": "Kannst du bitte das Licht ausmachen?", "start": "Mach", "a": ["Mach bitte das Licht aus", "Mach das Licht bitte aus", "Mach das Licht aus"], "e": "Imperativ du, aus cuối câu."}, {"q": "Wir fahren morgen nach Köln.", "start": "Morgen", "a": ["Morgen fahren wir nach Köln"], "e": "Morgen vị trí 1 → động từ vị trí 2."}, {"q": "Fotografieren ist im Museum verboten.", "start": "Im Museum", "a": ["Im Museum darf man nicht fotografieren"], "e": "verboten = nicht dürfen."}, {"q": "Er ruft seine Freundin an. (möchten)", "start": "Er möchte", "a": ["Er möchte seine Freundin anrufen"], "e": "anrufen cuối câu."}, {"q": "Nimm einen Regenschirm mit! (đổi sang ngôi Sie)", "start": "Nehmen", "a": ["Nehmen Sie einen Regenschirm mit"], "e": "Imperativ Sie, mit cuối câu."}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "wir / heute Abend / fernsehen", "a": ["Wir sehen heute Abend fern", "Heute Abend sehen wir fern"], "e": "sehen … fern."}, {"q": "Maria / sehr gut / Deutsch / sprechen", "a": ["Maria spricht sehr gut Deutsch"], "e": "e → i: spricht."}, {"q": "ich / morgen / früh / aufstehen / müssen", "a": ["Ich muss morgen früh aufstehen", "Morgen muss ich früh aufstehen"], "e": "muss vị trí 2, aufstehen cuối câu."}, {"q": "ihr / mitkommen / wollen / ?", "a": ["Wollt ihr mitkommen"], "e": "Wollt đầu câu, mitkommen cuối câu."}]}]}]},
"kt1":{"title": "ĐỀ KIỂM TRA NĂNG LỰC", "sub": "Verben 1 · Kapitel 1–8", "code": "KT1", "time": 60, "test": true, "pass": 7, "n": 80, "req": [1, 2, 3, 4, 5], "secs": [{"name": "PHẦN A. TRẮC NGHIỆM (câu 1–50)", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1, "type": "mc", "qs": [{"q": "Ich _____ jeden Sonntag meine Eltern an.", "o": ["mache", "rufe", "stehe", "kaufe"], "a": 1, "e": "anrufen = gọi điện."}, {"q": "Bitte _____ Sie hier Ihren Namen!", "o": ["schreiben", "lesen", "hören", "trinken"], "a": 0, "e": "schreiben = viết."}, {"q": "Am Wochenende _____ ich gern lange.", "o": ["stehe", "rufe", "mache", "schlafe"], "a": 3, "e": "lange schlafen = ngủ nướng."}, {"q": "Wir _____ heute Abend einen Film im Kino.", "o": ["hören", "lesen", "sehen", "schreiben"], "a": 2, "e": "einen Film sehen = xem phim."}, {"q": "Der Supermarkt _____ um 20 Uhr zu.", "o": ["kommt", "macht", "steht", "fährt"], "a": 1, "e": "zumachen = đóng cửa."}, {"q": "Ich _____ meinen Kaffee immer mit Milch.", "o": ["trinke", "esse", "lese", "schlafe"], "a": 0, "e": "Kaffee trinken."}, {"q": "Kannst du mich morgen am Flughafen _____?", "o": ["aufstehen", "fernsehen", "anfangen", "abholen"], "a": 3, "e": "abholen = đón."}, {"q": "„Was _____ du in deiner Freizeit?“ – „Ich spiele Gitarre.“", "o": ["bist", "heißt", "machst", "kommst"], "a": 2, "e": "Was machst du …?"}, {"q": "Es regnet. _____ einen Regenschirm mit!", "o": ["Gib", "Nimm", "Iss", "Lies"], "a": 1, "e": "mitnehmen = mang theo → Nimm … mit!"}, {"q": "Er _____ in einer Bank. Er ist Bankkaufmann.", "o": ["arbeitet", "wohnt", "schläft", "spielt"], "a": 0, "e": "arbeiten = làm việc."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.6, "type": "mc", "qs": [{"q": "Meine Freundin und ich _____ zusammen Deutsch.", "o": ["lernt", "lerne", "lernen", "lernst"], "a": 2, "e": "… und ich = wir."}, {"q": "„Wo ist der Kuli?“ – „_____ liegt unter dem Tisch.“", "o": ["Sie", "Er", "Es", "Ihr"], "a": 1, "e": "der Kuli → er."}, {"q": "„Wie ist das Essen?“ – „_____ ist sehr lecker.“", "o": ["Es", "Er", "Sie", "Ihr"], "a": 0, "e": "das Essen → es."}, {"q": "Frau Schneider, woher _____ Sie?", "o": ["kommst", "kommt", "komme", "kommen"], "a": 3, "e": "Sie kommen."}, {"q": "Du _____ heute sehr müde aus.", "o": ["sehst", "sieht", "siehst", "seht"], "a": 2, "e": "aussehen: e → ie ở ngôi du."}, {"q": "Mein Bruder _____ sehr schnell.", "o": ["lauft", "läuft", "läufst", "laufen"], "a": 1, "e": "au → äu ở ngôi er."}, {"q": "_____ ihr Hunger?", "o": ["Habt", "Hast", "Haben", "Hat"], "a": 0, "e": "ihr habt."}, {"q": "Ich _____ 19 Jahre alt.", "o": ["habe", "ist", "hat", "bin"], "a": 3, "e": "Tuổi dùng sein."}, {"q": "Die Gäste _____ einen Kaffee.", "o": ["möchte", "möchtest", "möchten", "möchtet"], "a": 2, "e": "Số nhiều → möchten."}, {"q": "Ich _____ morgen nicht kommen, ich muss arbeiten.", "o": ["kannst", "kann", "können", "könnt"], "a": 1, "e": "ich kann."}, {"q": "In der Bibliothek _____ man leise sein.", "o": ["muss", "darf", "will", "möchte"], "a": 0, "e": "Quy định bắt buộc → müssen."}, {"q": "Wann _____ du heute nach Hause?", "o": ["kommt", "kommen", "komme", "kommst"], "a": 3, "e": "du kommst."}, {"q": "Der Zug _____ pünktlich _____.", "o": ["ankommt … –", "kommt … auf", "kommt … an", "kommen … an"], "a": 2, "e": "ankommen → kommt … an."}, {"q": "Leon, _____ bitte das Fenster auf!", "o": ["macht", "mach", "machen", "machst"], "a": 1, "e": "Imperativ du: Mach … auf!"}, {"q": "Herr Doktor, _____ ich wieder Sport machen?", "o": ["darf", "darfst", "dürft", "dürfen"], "a": 0, "e": "ich darf."}, {"q": "Am Abend _____.", "o": ["wir kochen zusammen", "kochen zusammen wir", "wir zusammen kochen", "kochen wir zusammen"], "a": 3, "e": "Trạng ngữ đầu câu → động từ vị trí 2."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn (trắc nghiệm)", "pts": 0.8, "type": const WCOL=['#f6c9a8','#bfe3c6','#c9d8f5','#f3c6dc','#e9dca6','#d6ccf2','#bfe6e6','#f2d0b4'];
function wendBuild(r,diff){const S={easy:4,medium:5,hard:6}[diff],N=S*S;
 for(let at=0;at<300;at++){const th=WEND[Math.floor(r()*WEND.length)];const list=shf(th.w.filter(x=>x[0].length<=N-3||x[0].length==N),r);
  let res=null,it=0;const dfs=(i,sum,acc)=>{if(res||it++>5000)return;if(sum==N){if(acc.length>=2)res=acc.slice();return}if(i>=list.length||sum>N||acc.length>=7)return;acc.push(list[i]);dfs(i+1,sum+list[i][0].length,acc);acc.pop();dfs(i+1,sum,acc)};dfs(0,0,[]);
  if(!res)continue;const pl=wendPlace(res.map(x=>x[0]),S,r);if(pl)return{th,words:res,S,...pl}}
 return null}
function wendPlace(words,S,r){const N=S*S,g=new Array(N).fill(-1),paths=[];let budget=60000;
 const nb=i=>{const y=Math.floor(i/S),x=i%S,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dy&&!dx)continue;const yy=y+dy,xx=x+dx;if(yy>=0&&yy<S&&xx>=0&&xx<S)o.push(yy*S+xx)}return o};
 const fr=i=>nb(i).filter(j=>g[j]<0).length;
 const comps=minL=>{const seen=new Array(N).fill(false);for(let i=0;i<N;i++){if(g[i]>=0||seen[i])continue;const st=[i];let sz=0;seen[i]=true;while(st.length){const c=st.pop();sz++;for(const j of nb(c))if(g[j]<0&&!seen[j]){seen[j]=true;st.push(j)}}if(sz<minL)return false}return true};
 const put=k=>{if(k==words.length)return true;if(--budget<0)return false;const L=words[k].length,rest=words.slice(k+1).map(w=>w.length),minL=rest.length?Math.min(...rest):0;
  const em=[];for(let i=0;i<N;i++)if(g[i]<0)em.push(i);const mf=Math.min(...em.map(fr));
  for(const s0 of shf(em.filter(i=>fr(i)==mf),r).slice(0,3)){const path=[s0];g[s0]=k;
   const ext=()=>{if(--budget<0)return false;if(path.length==L)return(!rest.length||comps(minL))&&put(k+1);
    const cand=shf(nb(path[path.length-1]).filter(j=>g[j]<0),r).sort((a,b)=>fr(a)-fr(b));
    for(const j of cand){g[j]=k;path.push(j);if(ext())return true;path.pop();g[j]=-1}return false};
   if(ext()){paths[k]=path.slice();return true}g[s0]=-1}return false};
 for(let tries=0;tries<6;tries++){g.fill(-1);budget=60000;const order=shf(words.map((w,i)=>i),r);const ws=order.map(i=>words[i]);words=ws;if(put(0)){const letters=new Array(N);paths.forEach((p,k)=>p.forEach((c,i)=>letters[c]=words[k][i]));return{letters,paths,order:words}}}
 return null}
function wendGame(el,ctx){const B=wendBuild(ctx.r,ctx.diff);if(!B){el.innerHTML='<p>Không tạo được câu đố, hãy tải lại trang.</p>';return}
 const words=B.order.map(w=>B.words.find(x=>x[0]==w)),S=B.S,found=new Map();let sel=[],hintCells=new Set();
 const adj=(a,b)=>Math.abs(Math.floor(a/S)-Math.floor(b/S))<=1&&Math.abs(a%S-b%S)<=1&&a!=b;
 const owner=i=>{for(const [k] of found)if(B.paths[k].includes(i))return k;return -1};
 const line=(p,col,w)=>`<polyline points="${p.map(i=>`${i%S+.5},${Math.floor(i/S)+.5}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
 const draw=(msg)=>{const fc=[...found.keys()];
  el.innerHTML=`<p style="text-align:center"><b>Chủ đề: ${B.th.t}</b> <span class="lv">(${B.th.vi})</span> · đã tìm ${found.size}/${words.length} từ</p>
  <div class="wcur">${sel.map(i=>B.letters[i]).join('')}</div>
  <div class="wg" style="grid-template-columns:repeat(${S},1fr)">${B.letters.map((ch,i)=>{const o=owner(i);return `<button class="wc${sel.includes(i)?' sel':''}${o>=0?' fd':''}${hintCells.has(i)&&o<0?' hint':''}" data-i="${i}" style="${o>=0?'background:'+WCOL[fc.indexOf(o)%WCOL.length]:''}">${ch}</button>`}).join('')}
  <svg viewBox="0 0 ${S} ${S}" preserveAspectRatio="none">${fc.map((k,x)=>line(B.paths[k],'rgba(0,0,0,.18)',.12)).join('')}${sel.length>1?line(sel,'var(--acc)',.16):''}</svg></div>
  <p class="gmsg">${msg||'Chạm lần lượt vào các chữ liền kề. Chạm lại chữ cuối để bỏ chọn.'}</p>
  <ul class="flist">${fc.map((k,x)=>`<li style="background:${WCOL[x%WCOL.length]}">${words[k][1]?words[k][1]+' ':''}${words[k][0][0]+words[k][0].slice(1).toLowerCase()} · ${words[k][2]}</li>`).join('')}</ul>
  ${found.size<words.length?'<div class="acts"><button class="btn ghost" id="clr">Xóa chọn</button><button class="btn ghost" id="hn">Gợi ý</button><button class="btn ghost" id="gv">Xem đáp án</button></div>':''}`;
  el.querySelectorAll('.wc').forEach(b=>b.onclick=()=>tap(+b.dataset.i));
  const q=x=>el.querySelector(x);if(q('#clr')){q('#clr').onclick=()=>{sel=[];draw()};
   q('#hn').onclick=()=>{const k=words.findIndex((w,k)=>!found.has(k)&&!B.paths[k].every(c=>hintCells.has(c)));if(k<0)return;const n=B.paths[k].filter(c=>hintCells.has(c)).length;hintCells.add(B.paths[k][n]);ctx.hint();draw(`Gợi ý: có một từ nghĩa là „${words[k][2]}“ — chữ được đánh dấu là chữ thứ ${n+1} của nó.`)};
   q('#gv').onclick=()=>{words.forEach((w,k)=>{if(!found.has(k))found.set(k,1)});sel=[];draw('Đáp án đã được hiện.');ctx.finish(false,'')}}};
 const tap=i=>{if(owner(i)>=0)return;const at=sel.indexOf(i);
  if(at>=0)sel=sel.slice(0,at==sel.length-1?at:at+1);else if(!sel.length||adj(sel[sel.length-1],i))sel.push(i);else sel=[i];
  const w=sel.map(c=>B.letters[c]).join('');let msg='';
  const k=words.findIndex((x,k)=>!found.has(k)&&x[0]==w);
  if(k>=0){if(B.paths[k].join()==sel.join()){found.set(k,1);sel=[];msg=`Đúng: ${w}!`}else msg=`Đúng từ „${w}“ nhưng đường nối khác — thử nối các chữ khác.`}
  draw(msg);if(found.size==words.length)ctx.finish(true,'')};
 draw()}

function climbGame(el,ctx){const r=ctx.r,want={easy:4,medium:5,hard:6}[ctx.diff];let pool=LADDERS.filter(l=>l.length==want);if(!pool.length)pool=LADDERS;
 let lad=pool[Math.floor(r()*pool.length)].slice();if(r()<.5)lad.reverse();const L=lad[0].length,midSol=lad.slice(1,-1);
 let mid=shf(midSol,r);for(let i=0;i<5&&(mid.join()==midSol.join()||mid.join()==midSol.slice().reverse().join());i++)mid=shf(midSol,r);
 const rows=mid.map(w=>({w,ok:false,rev:0}));let phase=1,ends=null,showVi=ctx.diff!='hard',msg='Giải nghĩa từng từ (mỗi từ '+L+' chữ cái).';
 const clueTxt=w=>`${CLUE[w][0]}${showVi?' <span class="lv">('+CLUE[w][1]+')</span>':''}`;
 const rowHtml=(o,i,kind)=>`<div class="lr${o.ok?' ok':''}">${o.ok?`<span class="wd2">${o.w}</span>`:`<input maxlength="${L}" data-k="${kind}" data-i="${i}" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${o.w.slice(0,o.rev)}">`}${kind=='m'&&phase==2?`<span class="mv"><button data-u="${i}" aria-label="Lên">↑</button><button data-d="${i}" aria-label="Xuống">↓</button></span>`:'<span></span>'}<span class="cl">${clueTxt(o.w)}</span></div>`;
 const lockRow=t=>`<div class="lr lock"><span>🔒 ${t}</span><span></span></div>`;
 const draw=()=>{el.innerHTML=`<p class="gmsg">${msg}</p><div class="lad">${ends?rowHtml(ends[0],0,'t'):lockRow('Từ đầu thang')}${rows.map((o,i)=>rowHtml(o,i,'m')).join('')}${ends?rowHtml(ends[1],1,'b'):lockRow('Từ cuối thang')}</div>
  ${phase<4?'<div class="acts"><button class="btn ghost" id="hn">Gợi ý</button><button class="btn ghost" id="gv">Xem đáp án</button></div>':''}`;
  el.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const o=inp.dataset.k=='m'?rows[+inp.dataset.i]:ends[+inp.dataset.i];const v=inp.value.toUpperCase();if(v.length<L){inp.classList.remove('no');return}
   if(nrm(v)==nrm(o.w)){o.ok=true;check()}else inp.classList.add('no')});
  el.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));
  const q=x=>el.querySelector(x);if(q('#hn')){q('#hn').onclick=()=>{ctx.hint();if(!showVi){showVi=true;msg='Đã hiện nghĩa tiếng Việt.';return draw()}
   if(phase==2){const i=rows.findIndex((o,i)=>o.w!=midSol[i]&&o.w!=midSol[midSol.length-1-i]);msg=`Gợi ý: từ đầu tiên trong thang (sau từ khóa trên cùng) là ${midSol[0]} hoặc ${midSol[midSol.length-1]}.`;return draw()}
   const list=phase==1?rows:ends;const o=list.find(o=>!o.ok);if(o){o.rev=Math.min(L-1,o.rev+1);msg='Đã mở thêm một chữ cái.'}draw()};
   q('#gv').onclick=()=>{rows.forEach((o,i)=>{o.w=midSol[i];o.ok=true});ends=[{w:lad[0],ok:true},{w:lad[lad.length-1],ok:true}];phase=4;msg='Đáp án: '+lad.join(' → ');draw();ctx.finish(false,'')}}
  const first=el.querySelector('input');if(first&&document.activeElement===document.body)first.focus()};
 const ordered=()=>{const m=rows.map(o=>o.w).join();return m==midSol.join()?1:m==midSol.slice().reverse().join()?-1:0};
 const move=(i,d)=>{const j=i+d;if(j<0||j>=rows.length)return;[rows[i],rows[j]]=[rows[j],rows[i]];check()};
 const check=()=>{if(phase==1&&rows.every(o=>o.ok)){phase=2;msg='Giờ sắp xếp lại bằng ↑ ↓ để hai từ liền nhau chỉ khác đúng một chữ cái.'}
  if(phase==2){const o=ordered();if(o){phase=3;const top=o==1?lad[0]:lad[lad.length-1],bot=o==1?lad[lad.length-1]:lad[0];ends=[{w:top,ok:false,rev:0},{w:bot,ok:false,rev:0}];msg='Đúng thứ tự! Từ đầu và từ cuối đã mở khóa.'}}
  if(phase==3&&ends.every(o=>o.ok)){phase=4;msg='Hoàn thành thang chữ: '+[ends[0].w,...rows.map(o=>o.w),ends[1].w].join(' → ');draw();return ctx.finish(true,'')}
  draw()};

function pinGame(el,ctx){const r=ctx.r,C=PIN[Math.floor(r()*PIN.length)],words=C[3];let shown={easy:3,medium:2,hard:1}[ctx.diff],guesses=[],done=false,msg='Đoán chủ đề chung của các từ.';
 const draw=()=>{el.innerHTML=`<p class="gmsg">${msg}</p><div class="pp">${words.map((w,i)=>`<div class="pc2${i<shown||done?'':' hid'}">${i<shown||done?w[0]+(done?' <span class="lv">· '+w[1]+'</span>':''):'Từ '+(i+1)}</div>`).join('')}</div>
  <ul class="ghist">${guesses.map(g=>`<li>✗ ${esc(g)}</li>`).join('')}</ul>
  ${done?`<p style="text-align:center">Chủ đề: <b>${C[0]}</b> · ${C[1]}</p>`:`<form class="acts" style="justify-content:center"><input type="text" id="pg" placeholder="Chủ đề là…" autocomplete="off" style="width:min(100%,280px)"><button class="btn">Đoán (${5-guesses.length} lượt)</button></form><div class="acts" style="justify-content:center"><button class="btn ghost" id="gv">Xem đáp án</button></div>`}`;
  if(done)return;const f=el.querySelector('form'),inp=el.querySelector('#pg');inp.focus();
  f.onsubmit=e=>{e.preventDefault();const g=nrm(inp.value);if(!g)return;
   const ok=C[2].some(a=>{a=nrm(a);return g.includes(a)||(g.length>=4&&a.includes(g))})||g==nrm(C[0])||g==nrm(C[1]);
   if(ok){done=true;shown=5;msg=`Chính xác! Bạn đoán đúng sau ${guesses.length+1} lượt.`;draw();return ctx.finish(true,'')}
   guesses.push(inp.value);if(guesses.length>=5){done=true;msg='Hết lượt đoán.';draw();return ctx.finish(false,'')}
   shown=Math.min(5,shown+1);msg='Chưa đúng — thêm một từ nữa đã lộ.';draw()};
  el.querySelector('#gv').onclick=()=>{done=true;msg='Đáp án đã được hiện.';draw();ctx.finish(false,'')}};
 draw()}

let VOICES=[];const loadVoices=()=>{try{VOICES=speechSynthesis.getVoices().filter(v=>/^de(-|_|$)/i.test(v.lang)).sort((a,b)=>(/natural|online|google/i.test(b.name)?1:0)-(/natural|online|google/i.test(a.name)?1:0))}catch(e){VOICES=[]}document.querySelectorAll('.vn').forEach(el=>el.outerHTML=voiceNote())};
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;[300,1000,2500].forEach(t=>setTimeout(loadVoices,t))}catch(e){}
const canSay=()=>'speechSynthesis' in window;
function say(text,o){o=o||{};if(!canSay())return Promise.resolve();return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';const vs=VOICES;if(vs.length)u.voice=vs[(o.v||0)%vs.length];u.rate=o.rate||1;u.pitch=o.pitch||1;u.onend=res;u.onerror=res;speechSynthesis.speak(u)}catch(e){res()}})}
function stopAudio(){try{speechSynthesis.cancel()}catch(e){}}
const sayBtn=(t,rate)=>`<button class="say" data-say="${esc(t)}"${rate?` data-rate="${rate}"`:''} aria-label="Nghe" title="Nghe">🔊</button>`;
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-say]');if(b){e.preventDefault();stopAudio();say(b.dataset.say,{rate:+b.dataset.rate||1})}});
function addSay(){app.querySelectorAll('.lesson .ex b').forEach(b=>{if(b.dataset.s)return;b.dataset.s=1;const t=b.textContent.replace(/[→·].*$/,'').trim();if(t)b.insertAdjacentHTML('afterend',sayBtn(t))})}
const voiceNote=()=>canSay()?(VOICES.length?`<p class="vn lv">Giọng đọc: ${esc(VOICES[0].name)}</p>`:'<p class="vn warn">Trình duyệt này chưa có giọng đọc tiếng Đức, nên âm thanh có thể đọc sai giọng. Cách sửa: dùng Microsoft Edge (có sẵn giọng Đức chất lượng cao), hoặc cài giọng tiếng Đức trong Windows: Cài đặt → Thời gian và ngôn ngữ → Giọng nói → Thêm giọng nói → Deutsch (Deutschland), rồi tải lại trang.</p>'):'<p class="vn warn">Trình duyệt này không hỗ trợ đọc văn bản thành giọng nói.</p>';

tet Frau Tran?", ["Montags und mittwochs", "Jeden Tag", "Am Wochenende", "Nur freitags"]]]}, {"id": 5, "de": "Im Restaurant", "vi": "Ở nhà hàng", "lv": "A1", "src": "Basic Course · 2. At the Restaurant · Travel German · 6", "sit": "Gọi đồ uống, hỏi món nên thử, gọi món và tính tiền.", "ra": "Phục vụ: hỏi đồ uống, giới thiệu món, báo giá.", "rb": "Khách: gọi nước, hỏi món ngon, gọi món, xin hóa đơn, cho tiền boa.", "ph": [["Ich hätte gern ein Wasser.", "Cho tôi một chai nước."], ["Was empfehlen Sie?", "Anh/chị gợi ý món gì?"], ["Ich nehme die Suppe.", "Tôi lấy món súp."], ["Die Rechnung, bitte.", "Tính tiền giúp tôi."], ["Zusammen oder getrennt?", "Trả chung hay riêng?"], ["Stimmt so.", "Khỏi thối."]], "dl": [["A", "Guten Abend! Was möchten Sie trinken?", "Chào buổi tối! Anh/chị muốn uống gì?"], ["B", "Ich hätte gern ein Wasser, bitte.", "Cho tôi một chai nước."], ["A", "Mit oder ohne Kohlensäure?", "Có ga hay không ga?"], ["B", "Ohne, bitte. Was empfehlen Sie heute?", "Không ga. Hôm nay anh gợi ý món gì?"], ["A", "Die Tomatensuppe ist sehr gut. Und das Schnitzel natürlich.", "Súp cà chua rất ngon. Và tất nhiên là món Schnitzel."], ["B", "Dann nehme ich die Suppe und ein Schnitzel.", "Vậy tôi lấy súp và một phần Schnitzel."], ["B", "Die Rechnung, bitte.", "Tính tiền giúp tôi."], ["A", "Das macht achtzehn Euro fünfzig.", "Tổng cộng 18,50 euro."], ["B", "Zwanzig Euro. Stimmt so.", "Hai mươi euro. Khỏi thối."], ["A", "Vielen Dank und einen schönen Abend!", "Cảm ơn và chúc buổi tối vui vẻ!"]], "qs": [["Was trinkt der Gast?", ["Wasser ohne Kohlensäure", "Wasser mit Kohlensäure", "Bier", "Apfelsaft"]], ["Wie viel bezahlt der Gast?", ["20 Euro", "18,50 Euro", "15 Euro", "25 Euro"]]]}, {"id": 6, "de": "Das Wetter", "vi": "Thời tiết", "lv": "A1", "src": "Basic Course · 7. The Weather · Travel German · 8", "sit": "Bàn chuyện thời tiết và lên kế hoạch ngày mai.", "ra": "Hỏi thời tiết hôm nay và ngày mai, rủ đi chơi.", "rb": "Mô tả thời tiết (mưa, lạnh, bao nhiêu độ), khuyên mang áo khoác.", "ph": [["Wie ist das Wetter heute?", "Hôm nay thời tiết thế nào?"], ["Es regnet.", "Trời mưa."], ["Es ist sonnig.", "Trời nắng."], ["Es ist kalt.", "Trời lạnh."], ["Es sind acht Grad.", "Tám độ."], ["Nimm eine Jacke mit!", "Mang theo áo khoác nhé!"]], "dl": [["A", "Wie ist das Wetter heute?", "Hôm nay thời tiết thế nào?"], ["B", "Nicht so gut. Es regnet und es ist kalt.", "Không tốt lắm. Trời mưa và lạnh."], ["A", "Wie viel Grad sind es?", "Bao nhiêu độ?"], ["B", "Nur acht Grad. Nimm eine Jacke mit!", "Chỉ tám độ. Mang áo khoác nhé!"], ["A", "Und morgen?", "Còn ngày mai?"], ["B", "Morgen soll es sonnig sein, ungefähr fünfzehn Grad.", "Ngày mai nghe nói trời nắng, khoảng mười lăm độ."], ["A", "Super, dann gehen wir morgen in den Park!", "Tuyệt, vậy mai mình đi công viên nhé!"]], "qs": [["Wie ist das Wetter heute?", ["Es regnet und ist kalt.", "Es ist sonnig.", "Es schneit.", "Es ist heiß."]], ["Was machen sie morgen?", ["Sie gehen in den Park.", "Sie bleiben zu Hause.", "Sie gehen ins Kino.", "Sie fahren nach Berlin."]]]}, {"id": 7, "de": "Die Uhrzeit", "vi": "Giờ giấc", "lv": "A1", "src": "Basic Course · 8. The Time", "sit": "Hỏi giờ ngoài đường vì sợ trễ lớp.", "ra": "Hỏi giờ, nói lớp bắt đầu lúc mấy giờ, ở đâu.", "rb": "Nói giờ (Viertel nach, halb …), cho biết đi bao lâu.", "ph": [["Wie spät ist es?", "Mấy giờ rồi?"], ["Es ist Viertel nach zwei.", "Hai giờ mười lăm."], ["Es ist halb drei.", "Hai giờ rưỡi (!)."], ["Es ist Viertel vor acht.", "Tám giờ kém mười lăm."], ["Um wie viel Uhr …?", "Lúc mấy giờ …?"], ["Das ist nicht weit.", "Không xa đâu."]], "dl": [["A", "Entschuldigung, wie spät ist es?", "Xin lỗi, mấy giờ rồi?"], ["B", "Es ist Viertel nach zwei.", "Hai giờ mười lăm."], ["A", "Oh nein! Mein Kurs fängt um halb drei an.", "Ôi không! Lớp của tôi bắt đầu lúc hai giờ rưỡi."], ["B", "Wo ist dein Kurs?", "Lớp của bạn ở đâu?"], ["A", "In der Goethestraße.", "Ở đường Goethe."], ["B", "Das ist nicht weit. Mit dem Bus brauchst du zehn Minuten.", "Không xa đâu. Đi xe buýt mất mười phút."], ["A", "Danke! Dann komme ich pünktlich.", "Cảm ơn! Vậy tôi sẽ đến đúng giờ."]], "qs": [["Wie spät ist es?", ["14:15", "14:30", "13:45", "15:15"]], ["Wann fängt der Kurs an? (halb drei)", ["Um 14:30", "Um 15:30", "Um 14:15", "Um 13:30"]]]}, {"id": 8, "de": "Sich entschuldigen", "vi": "Xin lỗi", "lv": "A2", "src": "Basic Course · 9. Apologizing", "sit": "Bạn đến trễ buổi hẹn xem phim.", "ra": "Xin lỗi vì đến trễ, giải thích lý do, đề nghị mua bắp rang.", "rb": "Trấn an, hỏi chuyện gì xảy ra, nói phim chưa bắt đầu.", "ph": [["Entschuldigung, ich bin zu spät!", "Xin lỗi, mình đến trễ!"], ["Es tut mir wirklich leid.", "Mình thật sự xin lỗi."], ["Das macht nichts.", "Không sao đâu."], ["Kein Problem.", "Không vấn đề gì."], ["Der Bus hatte Verspätung.", "Xe buýt bị trễ."], ["Zum Glück!", "May quá!"]], "dl": [["A", "Entschuldigung, ich bin zu spät!", "Xin lỗi, mình đến trễ!"], ["B", "Kein Problem. Was ist passiert?", "Không sao. Có chuyện gì vậy?"], ["A", "Der Bus hatte Verspätung. Es tut mir wirklich leid.", "Xe buýt bị trễ. Mình thật sự xin lỗi."], ["B", "Das macht nichts. Der Film fängt erst in zehn Minuten an.", "Không sao đâu. Mười phút nữa phim mới bắt đầu."], ["A", "Zum Glück! Ich kaufe uns Popcorn.", "May quá! Mình mua bắp rang cho hai đứa nhé."], ["B", "Super, danke!", "Tuyệt, cảm ơn!"]], "qs": [["Warum ist A zu spät?", ["Der Bus hatte Verspätung.", "Er hatte keine Zeit.", "Er war krank.", "Er hat den Weg nicht gefunden."]], ["Wo sind die beiden?", ["Im Kino", "Im Restaurant", "Im Büro", "Am Bahnhof"]]]}, {"id": 9, "de": "Kleidung kaufen", "vi": "Mua quần áo", "lv": "A2", "src": "Basic Course · 10. Shopping for Clothes", "sit": "Mua áo khoác mùa đông trong cửa hàng.", "ra": "Nhân viên bán hàng: chào, hỏi cỡ, chỉ phòng thử, báo giá.", "rb": "Khách: tìm áo khoác, xin thử, nói áo nhỏ quá, hỏi giá.", "ph": [["Kann ich Ihnen helfen?", "Tôi giúp gì được cho anh/chị?"], ["Ich suche eine Jacke.", "Tôi đang tìm một chiếc áo khoác."], ["Welche Größe haben Sie?", "Anh/chị mặc cỡ nào?"], ["Kann ich das anprobieren?", "Tôi thử được không?"], ["Das ist zu klein.", "Cái này nhỏ quá."], ["Was kostet die Jacke?", "Áo khoác này giá bao nhiêu?"]], "dl": [["A", "Guten Tag! Kann ich Ihnen helfen?", "Xin chào! Tôi giúp gì được cho anh?"], ["B", "Ja, ich suche eine Winterjacke.", "Vâng, tôi đang tìm một chiếc áo khoác mùa đông."], ["A", "Welche Größe haben Sie?", "Anh mặc cỡ nào?"], ["B", "Größe M. Kann ich die blaue Jacke anprobieren?", "Cỡ M. Tôi thử chiếc áo xanh được không?"], ["A", "Natürlich. Die Umkleidekabine ist dort hinten.", "Tất nhiên. Phòng thử ở phía sau kia."], ["B", "Hmm, sie ist ein bisschen zu klein. Haben Sie sie in L?", "Hừm, hơi nhỏ một chút. Có cỡ L không?"], ["A", "Ja, hier, bitte.", "Có, đây ạ."], ["B", "Perfekt. Was kostet sie?", "Vừa quá. Bao nhiêu tiền?"], ["A", "Neunundachtzig Euro.", "Tám mươi chín euro."]], "qs": [["Was sucht der Kunde?", ["Eine Winterjacke", "Eine Hose", "Schuhe", "Ein T-Shirt"]], ["Welche Größe nimmt er am Ende?", ["L", "M", "S", "XL"]]]}, {"id": 10, "de": "Hobbys", "vi": "Sở thích", "lv": "A1", "src": "Basic Course · 11. Hobbies", "sit": "Nói chuyện về thời gian rảnh.", "ra": "Hỏi bạn làm gì lúc rảnh; kể bạn thích nấu ăn và chụp ảnh.", "rb": "Kể bạn chơi cầu lông, bao lâu một lần, rủ bạn đi cùng.", "ph": [["Was machst du in deiner Freizeit?", "Lúc rảnh bạn làm gì?"], ["Ich spiele gern Badminton.", "Mình thích chơi cầu lông."], ["Ich koche gern.", "Mình thích nấu ăn."], ["Wie oft …?", "Bao lâu một lần …?"], ["zweimal pro Woche", "hai lần một tuần"], ["Kommst du mal mit?", "Hôm nào đi cùng không?"]], "dl": [["A", "Was machst du in deiner Freizeit?", "Lúc rảnh bạn làm gì?"], ["B", "Ich spiele gern Badminton. Und du?", "Mình thích chơi cầu lông. Còn bạn?"], ["A", "Ich koche gern und ich fotografiere.", "Mình thích nấu ăn và chụp ảnh."], ["B", "Kochst du oft?", "Bạn có hay nấu không?"], ["A", "Ja, fast jeden Abend. Am Wochenende fotografiere ich in der Stadt.", "Có, gần như tối nào cũng nấu. Cuối tuần mình đi chụp ảnh trong thành phố."], ["B", "Ich spiele zweimal pro Woche Badminton. Kommst du mal mit?", "Mình chơi cầu lông hai lần một tuần. Hôm nào đi cùng không?"], ["A", "Gerne! Wann spielst du?", "Được chứ! Bạn chơi khi nào?"], ["B", "Am Dienstag und am Freitag.", "Thứ Ba và thứ Sáu."]], "qs": [["Was macht B gern?", ["Badminton spielen", "Kochen", "Fotografieren", "Lesen"]], ["Wann spielt B Badminton?", ["Am Dienstag und Freitag", "Jeden Abend", "Am Wochenende", "Am Montag"]]]}, {"id": 11, "de": "Nach dem Weg fragen", "vi": "Hỏi đường", "lv": "A2", "src": "Basic Course · 14. Giving Directions", "sit": "Hỏi đường đến bưu điện.", "ra": "Hỏi đường, nhắc lại chỉ dẫn, hỏi có xa không.", "rb": "Chỉ đường: đi thẳng đến đèn giao thông, rẽ phải, bưu điện cạnh hiệu thuốc.", "ph": [["Wie komme ich zur Post?", "Đi đến bưu điện thế nào?"], ["Gehen Sie geradeaus.", "Đi thẳng."], ["Biegen Sie rechts ab.", "Rẽ phải."], ["bis zur Ampel", "đến đèn giao thông"], ["Ist das weit?", "Có xa không?"], ["fünf Minuten zu Fuß", "năm phút đi bộ"]], "dl": [["A", "Entschuldigung, wie komme ich zur Post?", "Xin lỗi, đi đến bưu điện thế nào ạ?"], ["B", "Gehen Sie hier geradeaus bis zur Ampel.", "Anh đi thẳng đến đèn giao thông."], ["A", "Bis zur Ampel, okay. Und dann?", "Đến đèn giao thông, được. Rồi sao nữa?"], ["B", "Dann biegen Sie rechts ab. Die Post ist neben der Apotheke.", "Rồi rẽ phải. Bưu điện nằm cạnh hiệu thuốc."], ["A", "Ist das weit?", "Có xa không?"], ["B", "Nein, ungefähr fünf Minuten zu Fuß.", "Không, khoảng năm phút đi bộ."], ["A", "Vielen Dank!", "Cảm ơn nhiều!"], ["B", "Gern geschehen.", "Không có gì."]], "qs": [["Wohin möchte A?", ["Zur Post", "Zum Bahnhof", "Zur Apotheke", "Zum Supermarkt"]], ["Wo ist die Post?", ["Neben der Apotheke", "Neben dem Bahnhof", "An der Ampel", "Im Park"]]]}, {"id": 12, "de": "Geburtstag feiern", "vi": "Mừng sinh nhật", "lv": "A2", "src": "Basic Course · 16. Celebrating a Birthday", "sit": "Chúc mừng sinh nh let lastAct=Date.now();['pointerdown','keydown','scroll','touchstart','input'].forEach(t=>document.addEventListener(t,()=>lastAct=Date.now(),{passive:true,capture:true}));
const studySec=d=>(ls.get('gaq_time_'+PID,{})[d]||0);
const fmtMin=sec=>{const m=Math.round(sec/60);return m<60?m+' phút':Math.floor(m/60)+' giờ '+(m%60)+' phút'};
function weekTime(){const T=ls.get('gaq_time_'+PID,{}),days=[];for(let i=6;i>=0;i--){const dt=new Date(Date.now()-i*864e5);days.push({k:dkey(dt),l:['CN','T2','T3','T4','T5','T6','T7'][dt.getDay()],v:T[dkey(dt)]||0})}
 const mx=Math.max(2400,...days.map(d=>d.v)),tot=days.reduce((a,d)=>a+d.v,0);
 return `<div style="margin-top:16px"><b>Thời gian học 7 ngày qua</b> <span class="lv">· tổng ${fmtMin(tot)} · trung bình ${fmtMin(tot/7)}/ngày</span><div class="wk">${days.map((d,i)=>`<div class="${i==6?'td':''}" title="${d.k}: ${fmtMin(d.v)}"><span>${Math.round(d.v/60)||''}</span><i style="height:${Math.round(d.v/mx*70)}px"></i>${d.l}</div>`).join('')}</div><p class="lv">Chỉ tính lúc trang đang mở trên màn hình và bạn có thao tác trong vòng 1 phút gần nhất, hoặc đang chạy Pomodoro tập trung. Vạch mốc: 40 phút/ngày.</p></div>`}
const POMO_CFG={'25/5':[25,5,15],'50/10':[50,10,20]};
const pomoGet=()=>{const P=ls.get('gaq_pomo_'+PID,null)||{mode:'focus',end:null,left:null,done:0,day:'',cfg:'25/5'};if(P.day!=dkey(new Date())){P.day=dkey(new Date());P.done=0}return P};
const pomoSet=P=>ls.set('gaq_pomo_'+PID,P);
const pomoLen=(P,m)=>{const c=POMO_CFG[P.cfg]||POMO_CFG['25/5'];return (m=='focus'?c[0]:m=='short'?c[1]:c[2])*60};
const pomoLeft=P=>P.end?Math.max(0,Math.round((P.end-Date.now())/1000)):(P.left!=null?P.left:pomoLen(P,P.mode));
const MODEVI={focus:'Tập trung',short:'Nghỉ ngắn',long:'Nghỉ dài'};
function pomoHtml(){if(!PID)return'';const P=pomoGet(),L=pomoLeft(P);
 return `<div class="card pomo${P.mode!='focus'?' brk':''}" id="pomo"><div class="pm">${['focus','short','long'].map(m=>`<button data-pm="${m}" class="${P.mode==m?'on':''}">${MODEVI[m]}</button>`).join('')}</div>
 <div class="pt" id="pomoT">${mmss(L*1000)}</div><div class="lv">🍅 Hôm nay: ${P.done} pomodoro · <select id="pcfg" aria-label="Độ dài">${Object.keys(POMO_CFG).map(k=>`<option${P.cfg==k?' selected':''}>${k}</option>`).join('')}</select> phút</div>
 <div class="acts"><button class="btn sm" id="pgo">${P.end?'⏸ Tạm dừng':'▶ Bắt đầu'}</button><button class="btn ghost sm" id="prs">↺</button><button class="btn ghost sm" id="psk" title="Bỏ qua">⏭</button></div></div>`}
function bindPomo(S){const q=x=>S.querySelector(x);if(!q('#pomo'))return;
 S.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{const P=pomoGet();P.mode=b.dataset.pm;P.end=null;P.left=null;pomoSet(P);side()});
 q('#pgo').onclick=()=>{const P=pomoGet();if(P.end){P.left=pomoLeft(P);P.end=null}else{P.end=Date.now()+pomoLeft(P)*1000;P.left=null;beep(1)}pomoSet(P);side()};
 q('#prs').onclick=()=>{const P=pomoGet();P.end=null;P.left=null;pomoSet(P);side()};
 q('#psk').onclick=()=>{pomoNext(pomoGet(),false)};
 q('#pcfg').onchange=e=>{const P=pomoGet();P.cfg=e.target.value;P.end=null;P.left=null;pomoSet(P);side()}}
function beep(n){try{const A=beep.a||(beep.a=new (window.AudioContext||window.webkitAudioContext)());for(let i=0;i<n;i++){const o=A.createOscillator(),g=A.createGain();o.frequency.value=i%2?660:880;o.connect(g);g.connect(A.destination);const t=A.currentTime+i*.35;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)}}catch(e){}}
function pomoNext(P,completed){if(completed&&P.mode=='focus'){P.done++;logAct({type:'pomo',min:pomoLen(P,'focus')/60})}
 const next=P.mode=='focus'?(completed&&P.done%4==0?'long':'short'):'focus';P.mode=next;P.end=null;P.left=null;pomoSet(P);
 if(completed){beep(4);try{if(window.Notification&&Notification.permission=='granted')new Notification(next=='focus'?'Hết giờ nghỉ – học tiếp nhé!':'Xong một pomodoro – nghỉ chút nào!')}catch(e){}}
 side()}
const BASE_TITLE=document.title;
setInterval(()=>{if(!PID)return;
 const P=pomoGet(),running=!!P.end,focusRun=running&&P.mode=='focus';
 if(document.visibilityState=='visible'&&(Date.now()-lastAct<60000||focusRun)||focusRun){const T=ls.get('gaq_time_'+PID,{}),d=dkey(new Date());T[d]=(T[d]||0)+1;ls.set('gaq_time_'+PID,T)}
 if(running){const L=pomoLeft(P),el=document.getElementById('pomoT');if(el)el.textContent=mmss(L*1000);document.title=(P.mode=='focus'?'🍅 ':'☕ ')+mmss(L*1000)+' · '+BASE_TITLE;if(L<=0)pomoNext(P,true)}
 else if(document.title!=BASE_TITLE)document.title=BASE_TITLE},1000);

const lvOf=k=>k>100?'A2':(k==39||k>=49)?'B1':A2K.includes(+k)?'A2':'A1';

function lvData(L){const gram=[];for(const [g,cs] of GROUPS){if(cs[0][0]>100)continue;const c=cs.filter(x=>lvOf(x[0])==L);if(c.length)gram.push([g,c])}
 const voc=[];for(const [g,cs] of GROUPS)if(cs[0][0]>100)cs.forEach(x=>{if(lvOf(x[0])==L)voc.push(x)});
 const ex=Object.keys(EXAMS).filter(id=>exLv(id)==L),st=STORIES.filter(x=>x.lv==L);
 const items=[...gram.flatMap(g=>g[1]).filter(x=>QUIZ[x[0]]).map(x=>'k'+x[0]),...voc.filter(x=>QUIZ[x[0]]).map(x=>'k'+x[0]),...ex.filter(id=>!EXAMS[id].test).map(id=>'de'+id),...st.map(x=>'st'+x.id)];
 return {gram,voc,ex,st,items,done:items.filter(i=>cnt(i)>0).length,nGram:gram.reduce((a,g)=>a+g[1].length,0),onGram:gram.reduce((a,g)=>a+g[1].filter(x=>QUIZ[x[0]]).length,0)}}

const exRow=id=>{const E=EXAMS[id],b=best['de'+id],w=best['w'+id];
 if(!E.test)return `<button class="row" data-de="${id}"><span class="num">Đ${id}</span><span class="t">${E.title}<br><span class="lv">${E.sub} · ${E.time} phút</span>${progBar('de'+id,exCount(E))}</span>${b!=null?`<span class="badge">${b}/10${w!=null?' · sai '+w:''}</span>`:''}</button>`;

function avPick(id){const P=PROFILES[id];let cur=null;try{cur=localStorage.getItem('gaq_av_'+id)}catch(e){}if(!cur)cur=AVDEF[id];
 document.documentElement.removeAttribute('data-p');
 const own=cur&&cur.startsWith('data:');
 app.innerHTML=`<div class="pick" style="text-align:left;max-width:760px;margin:0 auto"><a class="back">← Ai đang học?</a><h1>Chọn avatar cho ${esc(P.name)}</h1><p class="sub">Bấm vào hình để chọn. Ảnh tự tải lên được cắt thành hình vuông ở giữa, giữ nguyên tỉ lệ.</p>
 <div class="avg ${P.g}">${Object.keys(AVATARS).map(k=>`<button class="avo${k==cur?' on':''}" data-av="${k}"><span class="sq"><img src="${AVATARS[k][1]}" alt=""></span>${AVATARS[k][0]}</button>`).join('')}
 ${own?`<button class="avo on" data-av="own"><span class="sq"><img src="${cur}" alt=""></span>Ảnh của bạn</button>`:''}
 <label class="avo"><span class="sq"><span class="up">＋</span></span>Tải ảnh lên<input type="file" accept="image/*" hidden id="avf"></label></div><p class="lv" id="avm"></p></div>`;
 app.querySelector('.back').onclick=()=>pick();
 app.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{if(b.dataset.av!='own')avSet(id,b.dataset.av);pick(true)});
 app.querySelector('#avf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const S=256,c=document.createElement('canvas');c.width=c.height=S;const s=Math.min(im.width,im.height);
  c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,S,S);if(avSet(id,c.toDataURL('image/jpeg',.85)))pick(true);else app.querySelector('#avm').textContent='Không lưu được ảnh trên trình duyệt này.'};im.src=r.result};r.readAsDataURL(f)}}
function pick(mng){document.documentElement.removeAttribute('data-p');side();
 const card=id=>{const P=PROFILES[id],L=ls.get('gaq_log_'+id,[]),last=L[L.length-1];
  return `<button class="pav ${P.g}" data-p="${id}" title="${last?L.length+' hoạt động · gần nhất '+new Date(last.t).toLocaleDateString('de-DE'):'Chưa có hoạt động'}"><span class="sq"><img src="${avSrc(id)}" alt=""><span class="gd">${P.g=='m'?'♂\uFE0E':'♀\uFE0E'}</span><span class="ed"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span></span><b>${P.name}</b><span class="meta">${last?L.length+' hoạt động':'Chưa có hoạt động'}</span></button>`};
 app.innerHTML=`<div class="pick"><h1>Ai đang học?</h1><p class="sub">Nội dung giống nhau; điểm số, nhật ký và ghi chú của mỗi người được lưu riêng.</p><div class="pgrid">${Object.keys(PROFILES).map(card).join('')}</div><button class="mngb" id="mng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>${mng?'Xong':'Quản lý hồ sơ'}</button></div>`;
 const W=app.querySelector('.pick');if(mng){W.classList.add('mng');W.querySelector('h1').textContent='Quản lý hồ sơ';W.querySelector('.sub').textContent='Bấm vào một hồ sơ để đổi avatar.'}
 app.querySelector('#mng').onclick=()=>pick(!mng);
 app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>mng?avPick(b.dataset.p):setProfile(b.dataset.p))}
function setProfile(id){PID=id;try{sessionStorage.setItem('gaq_pid',id)}catch(e){}
 document.documentElement.dataset.p=PROFILES[id].g;best=store.get();LOG=ls.get('gaq_log_'+id,[]);NOTES=ls.get('gaq_notes_'+id,{});selD=dkey(new Date());route()}
{const q=new URL(location.href).searchParams.get('p');let s0=null;try{s0=sessionStorage.getItem('gaq_pid')}catch(e){}
 const init=PROFILES[q]?q:PROFILES[s0]?s0:null;init?setProfile(init):pick()}
</script>
