const QUIZ = {
1:{rule:`<p>Đại từ nhân xưng thay cho người hoặc vật.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>1.</td><td>ich</td><td>wir</td></tr><tr><td>2.</td><td>du / Sie</td><td>ihr / Sie</td></tr><tr><td>3.</td><td>er, sie, es</td><td>sie</td></tr></table>
<p>Với đồ vật, đại từ đi theo giống của danh từ: <b>der → er</b>, <b>die → sie</b>, <b>das → es</b>, số nhiều → <b>sie</b>. <b>Sie</b> (viết hoa) là ngôi lịch sự, dùng cho cả một và nhiều người.</p>`,

{q:"Der Tisch ist neu. ___ kostet 80 Euro.",o:["Es","Er","Sie","Du"],a:1,e:"der Tisch → er. Đồ vật giống đực vẫn dùng er, không phải es."},

2:{rule:`<p>Thì hiện tại: gốc động từ + đuôi.</p>

4:{rule:`<p>Một số động từ đổi nguyên âm gốc, <b>chỉ ở ngôi du và er/sie/es</b>.</p>

5:{rule:`<p>Động từ khuyết thiếu: ngôi <b>ich</b> và <b>er/sie/es</b> giống nhau và <b>không có đuôi</b>; số ít thường đổi nguyên âm.</p>

{q:"Wann fängt der Kurs ___? (anfangen)",a:["an"],e:"Trong câu hỏi, tiền tố vẫn ở cuối."},
{q:"Er ___ seine Mutter an. (anrufen)",a:["ruft"],e:"er ruft … an."},
{q:"Wir kaufen heute ___. (einkaufen)",a:["ein"],e:"einkaufen → kaufen … ein."},
{q:"Sie sieht am Abend ___. (fernsehen)",a:["fern"],e:"fernsehen → sieht … fern."},
{q:"Kommst du heute Abend ___? (mitkommen)",a:["mit"],e:"mitkommen → kommst … mit."},
{q:"Câu nào đúng?",o:["Ich anrufe dich morgen.","Ich rufe an dich morgen.","Ich rufe dich morgen an.","Ich an rufe dich morgen."],a:2,e:"Động từ ở vị trí 2, tiền tố cuối câu."},
{q:"Câu nào đúng?",o:["Ich muss morgen früh stehen auf.","Ich muss morgen früh aufstehen.","Ich muss auf morgen früh stehen.","Ich stehe muss morgen früh auf."],a:1,e:"Có Modalverb → nguyên mẫu viết liền, cuối câu."},
{q:"Động từ nào KHÔNG tách?",o:["ankommen","mitkommen","zurückkommen","bekommen"],a:3,e:"Tiền tố be- không tách."}
]},
8:{rule:`<table><tr><td><b>Sie</b></td><td>nguyên mẫu + Sie</td><td>Kommen Sie!</td></tr><tr><td><b>ihr</b></td><td>dạng ihr, bỏ chủ ngữ</td><td>Kommt!</td></tr><tr><td><b>du</b></td><td>dạng du, bỏ -st và bỏ du</td><td>Komm!</td></tr></table>
<p>Ngôi du: động từ đổi <b>e → i/ie</b> giữ nguyên thay đổi (sprich, lies, hilf, nimm), nhưng <b>a → ä</b> thì bỏ umlaut (fahr, schlaf). <b>sein</b>: Sei! / Seid! / Seien Sie! Động từ tách: Steh auf!</p>`,
qs:[
{q:"___ Sie bitte herein! (kommen, Sie)",a:["kommen"],e:"Ngôi Sie: nguyên mẫu + Sie."},
{q:"___ bitte langsam! (sprechen, du)",a:["sprich"],e:"du sprichst → bỏ -st → sprich."},
{q:"___ mir bitte! (helfen, du)",a:["hilf"],e:"du hilfst → hilf."},
{q:"___ bitte leise! (sein, ihr)",a:["seid"],e:"sein, ngôi ihr → Seid!"},
{q:"___ das Buch! (lesen, du)",a:["lies"],e:"du liest → lies."},
{q:"___ die Tür zu! (zumachen, ihr)",a:["macht"],e:"Dạng ihr, tiền tố zu ở cuối."},
{q:"___ Sie bitte Platz! (nehmen, Sie)",a:["nehmen"],e:"Ngôi Sie không đổi nguyên âm."},
{q:"___ nicht so schnell! (fahren, du)",a:["fahr","fahre"],e:"a → ä không áp dụng trong Imperativ: fahr, không phải fähr."},
{q:"___ bitte ruhig! (sein, du)",o:["Bist","Seid","Sei","Sein"],a:2,e:"sein, ngôi du → Sei!"},
{q:"Imperativ (du) của „aufstehen“ là gì?",o:["Aufsteh!","Steh auf!","Stehst auf!","Auf steh!"],a:1,e:"Động từ tách: tiền tố ra cuối."}
]}
};

/* ============================ ỨNG DỤNG ============================ */
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(){try{return JSON.parse(localStorage.getItem('gaq')||'{}')}catch(e){return{}}},set(v){try{localStorage.setItem('gaq',JSON.stringify(v))}catch(e){}}};
let best=store.get();
const title=k=>{for(const g of GROUPS)for(const c of g[1])if(c[0]==k)return c[1];return''};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.trim().toLowerCase().replace(/[.!?,]+$/,'').replace(/ß/g,'ss');
function go(k){const u=new URL(location.href);k?u.searchParams.set('k',k):u.searchParams.delete('k');try{history.pushState(null,'',u)}catch(e){}route(k)}
function route(k){if(k===undefined)k=new URL(location.href).searchParams.get('k');k&&QUIZ[k]?chapter(+k):home();scrollTo(0,0)}
onpopstate=()=>route();

function home(){
 let h='<h1>Deutsch Grammatik Quiz</h1><p class="sub">Luyện theo thứ tự chương của Grammatik aktiv A1–B1. Câu hỏi soạn mới, không trùng với sách.</p>';
 for(const [g,cs] of GROUPS){h+=`<h2>${esc(g)}</h2>`;
  for(const [k,t] of cs){const on=!!QUIZ[k],b=best[k];
   h+=`<button class="row" ${on?`data-k="${k}"`:'disabled'}><span class="num">${k}</span><span class="t">${esc(t)}${on?'':'<br><span class="lv">chưa soạn</span>'}</span>${b!=null?`<span class="badge">${b}/${QUIZ[k].qs.length}</span>`:''}</button>`}}
 app.innerHTML=h;
 app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>go(b.dataset.k));
}
function chapter(k){
 const c=QUIZ[k];
 app.innerHTML=`<a class="back">← Tất cả các chương</a><h1>${k}. ${esc(title(k))}</h1>
 <div class="card rule">${c.rule}</div>
 <div class="acts"><button class="btn" id="s">Bắt đầu ${c.qs.length} câu</button></div>`;
 app.querySelector('.back').onclick=()=>go(null);
 app.querySelector('#s').onclick=()=>run(k,c.qs,true);
}
function run(k,list,full){
 const qs=shuffle(list);let i=0,score=0;const wrong=[];
 function show(){
  const q=qs[i];
  let h=`<div class="top"><a class="back">← ${k}. ${esc(title(k))}</a><span>${i+1} / ${qs.length}</span></div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="card"><p class="q">${esc(q.q)}</p>`;
  if(q.o){const order=shuffle(q.o.map((_,n)=>n));h+=order.map(n=>`<button class="opt" data-n="${n}">${esc(q.o[n])}</button>`).join('')}
  else h+=`<form><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Điền từ còn thiếu"> <button class="btn">Kiểm tra</button>
   <div class="keys">${['ä','ö','ü','ß'].map(c=>`<button type="button">${c}</button>`).join('')}</div></form>`;
  h+='<div id="fb"></div></div>';app.innerHTML=h;
  app.querySelector('.back').onclick=()=>go(k);
  if(q.o)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
   const ok=+b.dataset.n===q.a;
   app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.n===q.a)x.classList.add('ok')});
   if(!ok)b.classList.add('no');done(ok,q.o[q.a])});
  else{const f=app.querySelector('form'),inp=f.querySelector('input');inp.focus();
   f.querySelectorAll('.keys button').forEach(b=>b.onclick=()=>{inp.value+=b.textContent;inp.focus()});
   f.onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;
    const ok=q.a.map(norm).includes(norm(inp.value));inp.disabled=true;f.querySelector('.btn').disabled=true;done(ok,q.a[0])}}
 }
 function done(ok,ans){
  const q=qs[i];if(ok)score++;else wrong.push(q);
  const fb=app.querySelector('#fb');
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Đúng.':'Chưa đúng.'}</b> ${ok?'':'Đáp án: <b>'+esc(ans)+'</b>. '}${esc(q.e)}</div>
  <div class="acts"><button class="btn" id="n">${i+1<qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`;
  const n=fb.querySelector('#n');n.focus();n.onclick=()=>{i++;i<qs.length?show():end()};
 }
 function end(){
  if(full&&(best[k]==null||score>best[k])){best[k]=score;store.set(best)}
  app.innerHTML=`<a class="back">← Tất cả các chương</a><h1>${k}. ${esc(title(k))}</h1>
  <div class="card"><p class="q">Kết quả: ${score} / ${qs.length}</p>
  ${wrong.length?'<p>Câu sai:</p><ul>'+wrong.map(w=>`<li>${esc(w.q)} → <b>${esc(w.o?w.o[w.a]:w.a[0])}</b></li>`).join('')+'</ul>':'<p>Không sai câu nào.</p>'}
  <div class="acts">${wrong.length?'<button class="btn" id="w">Làm lại câu sai</button>':''}<button class="btn ghost" id="r">Làm lại cả bài</button>${QUIZ[k+1]?'<button class="btn ghost" id="x">Chương tiếp</button>':''}</div></div>`;
  app.querySelector('.back').onclick=()=>go(null);
  const $=s=>app.querySelector(s);
  if($('#w'))$('#w').onclick=()=>run(k,wrong,false);
  $('#r').onclick=()=>run(k,QUIZ[k].qs,true);
  if($('#x'))$('#x').onclick=()=>go(k+1);
 }
 show();
}
route();
</script>
</body>
</html>
