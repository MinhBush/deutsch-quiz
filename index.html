const QUIZ = {
1:{lesson:`<h3>Đại từ nhân xưng là gì?</h3>
<p>Là từ đứng thay cho tên người hoặc vật để không phải lặp lại danh từ. Trong tiếng Đức, đại từ quyết định đuôi của động từ, nên đây là nền của mọi câu.</p>
<table><tr><th></th><th>Số ít</th><th>Số nhiều</th></tr><tr><td>Ngôi 1</td><td><b>ich</b> (tôi)</td><td><b>wir</b> (chúng tôi)</td></tr><tr><td>Ngôi 2, thân mật</td><td><b>du</b> (bạn)</td><td><b>ihr</b> (các bạn)</td></tr><tr><td>Ngôi 2, lịch sự</td><td><b>Sie</b> (ông/bà)</td><td><b>Sie</b> (các ông/bà)</td></tr><tr><td>Ngôi 3</td><td><b>er</b> (anh ấy), <b>sie</b> (cô ấy), <b>es</b> (nó)</td><td><b>sie</b> (họ)</td></tr></table>
<h3>du hay Sie?</h3>
<p><b>du / ihr</b>: bạn bè, gia đình, trẻ em, sinh viên với nhau. <b>Sie</b>: người lớn chưa quen, trong công việc, ở cơ quan, cửa hàng. Sie luôn viết hoa và dùng cho cả một lẫn nhiều người.</p>
<p class="ex"><b>Anna, woher kommst du?</b><br>Anna, bạn đến từ đâu?</p>
<p class="ex"><b>Herr Braun, woher kommen Sie?</b><br>Ông Braun, ông đến từ đâu?</p>
<h3>Ba chữ „sie“</h3>
<p>Phân biệt bằng đuôi động từ và chữ hoa:</p>
<table><tr><td>sie komm<b>t</b></td><td>cô ấy</td></tr><tr><td>sie komm<b>en</b></td><td>họ</td></tr><tr><td><b>S</b>ie komm<b>en</b></td><td>ông/bà (lịch sự)</td></tr></table>
<h3>Đại từ cho đồ vật</h3>
<p>Đồ vật không tự động là „es“. Đại từ đi theo giống ngữ pháp của danh từ: <b>der → er</b>, <b>die → sie</b>, <b>das → es</b>, số nhiều → <b>sie</b>.</p>
<p class="ex"><b>Der Tisch ist neu. Er kostet 80 Euro.</b><br>Cái bàn mới. Nó giá 80 euro.</p>
<p class="ex"><b>Die Lampe ist schön. Sie ist aus Italien.</b><br>Cái đèn đẹp. Nó là hàng Ý.</p>
<p class="ex"><b>Das Sofa ist bequem. Es ist teuer.</b><br>Ghế sofa êm. Nó đắt.</p>
<p class="warn"><b>Lỗi hay gặp:</b> dùng „es“ cho mọi đồ vật (do quen với „it“ trong tiếng Anh); nhầm <b>ihr</b> (các bạn) với <b>sie</b> (họ); quên viết hoa Sie lịch sự.</p>`,
rule:`<p>Đại từ nhân xưng thay cho người hoặc vật.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr><tr><td>1.</td><td>ich</td><td>wir</td></tr><tr><td>2.</td><td>du / Sie</td><td>ihr / Sie</td></tr><tr><td>3.</td><td>er, sie, es</td><td>sie</td></tr></table>
<p>Với đồ vật, đại từ đi theo giống của danh từ: <b>der → er</b>, <b>die → sie</b>, <b>das → es</b>, số nhiều → <b>sie</b>. <b>Sie</b> (viết hoa) là ngôi lịch sự, dùng cho cả một và nhiều người.</p>`,

{q:"Das ist mein Bruder Tim. ___ wohnt in Köln.",o:["Sie","Es","Er","Ihr"],a:2,e:"Một người nam → er."},
{q:"Der Tisch ist neu. ___ kostet 80 Euro.",o:["Es","Er","Sie","Du"],a:1,e:"der Tisch → er. Đồ vật giống đực vẫn dùng er, không phải es."},
{q:"Die Lampe ist schön. ___ ist aus Italien.",o:["Er","Es","Ihr","Sie"],a:3,e:"die Lampe → sie."},
{q:"Das Sofa ist bequem, aber ___ ist teuer.",o:["es","er","sie","wir"],a:0,e:"das Sofa → es."},

{q:"Herr Braun, woher kommen ___?",o:["du","ihr","er","Sie"],a:3,e:"Xưng hô lịch sự với Herr Braun → Sie."},
{q:"Paul und Mia, wo wohnt ___?",o:["ihr","sie","du","Sie"],a:0,e:"Nói với hai người quen thân → ihr (động từ: wohnt)."},
{q:"Die Kinder spielen im Garten. ___ sind laut.",o:["Es","Sie","Ihr","Er"],a:1,e:"Số nhiều → sie."},
{q:"Hallo Anna, was machst ___ heute?",a:["du"],e:"Nói với một người quen thân → du (đuôi động từ -st)."},
{q:"Ich heiße Mai und das ist Tuan. ___ kommen aus Vietnam.",o:["Wir","Sie","Ihr","Er"],a:0,e:"Mai (ich) + Tuan = wir."},
{q:"„Wo ist das Handy?“ – „___ liegt im Auto.“",o:["Er","Sie","Es","Ihr"],a:2,e:"das Handy → es."},
{q:"Die Kinder sind müde. ___ schlafen schon.",o:["Sie","Er","Es","Ihr"],a:0,e:"Số nhiều → sie."},

{q:"„Sie kommen.“ ở đầu câu có thể nghĩa là gì?",o:["chỉ „họ“","chỉ „ông/bà“","cả „họ“ lẫn „ông/bà“","cô ấy"],a:2,e:"Đầu câu luôn viết hoa nên không phân biệt được sie (họ) và Sie (lịch sự); phải dựa vào ngữ cảnh."},
{q:"Paul und ich spielen Tennis. ___ spielen jeden Samstag.",a:["wir"],e:"Paul + ich = wir."},

2:{lesson:`<h3>Dùng khi nào?</h3>
<p>Thì hiện tại (Präsens) dùng cho việc đang xảy ra, thói quen, sự thật chung, và cả tương lai khi có từ chỉ thời gian.</p>
<p class="ex"><b>Ich lerne Deutsch.</b><br>Tôi (đang) học tiếng Đức.</p>
<p class="ex"><b>Morgen fahre ich nach Berlin.</b><br>Ngày mai tôi đi Berlin.</p>
<h3>Cách chia</h3>
<p>Tiếng Việt không chia động từ, tiếng Đức thì mỗi ngôi một đuôi. Bỏ <b>-en</b> của nguyên mẫu để lấy gốc, rồi thêm đuôi:</p>
<table><tr><th colspan="2">kommen → gốc komm-</th></tr><tr><td>ich</td><td>komm<b>e</b></td></tr><tr><td>du</td><td>komm<b>st</b></td></tr><tr><td>er / sie / es</td><td>komm<b>t</b></td></tr><tr><td>wir</td><td>komm<b>en</b></td></tr><tr><td>ihr</td><td>komm<b>t</b></td></tr><tr><td>sie / Sie</td><td>komm<b>en</b></td></tr></table>
<p>Mẹo nhớ: wir và sie/Sie luôn giống nguyên mẫu; er/sie/es và ihr cùng đuôi -t.</p>
<h3>Hai trường hợp đặc biệt</h3>
<p><b>Gốc kết thúc bằng -t hoặc -d</b> (arbeiten, antworten, reden, finden): chèn thêm <b>e</b> trước -st và -t cho dễ đọc.</p>
<p class="ex"><b>du arbeitest, er arbeitet, ihr arbeitet</b></p>
<p><b>Gốc kết thúc bằng -s, -ß, -z</b> (heißen, tanzen, reisen): ngôi du chỉ thêm <b>-t</b>, vì đã có âm s.</p>
<p class="ex"><b>du heißt, du tanzt, du reist</b></p>
<h3>Vị trí trong câu</h3>
<p>Trong câu trần thuật, động từ đã chia luôn ở vị trí thứ hai.</p>
<p class="ex"><b>Ich wohne in Frankfurt.</b> · <b>Heute arbeite ich nicht.</b></p>
<p class="warn"><b>Lỗi hay gặp:</b> để nguyên mẫu không chia („Er kommen aus Japan“); viết „du arbeitst“; viết „du heißst“.</p>`,
rule:`<p>Thì hiện tại: gốc động từ + đuôi.</p>
<table><tr><td>ich</td><td>komm<b>e</b></td><td>wir</td><td>komm<b>en</b></td></tr><tr><td>du</td><td>komm<b>st</b></td><td>ihr</td><td>komm<b>t</b></td></tr><tr><td>er/sie/es</td><td>komm<b>t</b></td><td>sie/Sie</td><td>komm<b>en</b></td></tr></table>
<p>Gốc kết thúc bằng <b>-t / -d</b> (arbeiten, reden, antworten): thêm <b>e</b> trước -st và -t → du arbeit<b>e</b>st, er arbeit<b>e</b>t. Gốc kết thúc bằng <b>-s / -ß / -z</b> (heißen, tanzen): ngôi du chỉ thêm <b>-t</b> → du heißt.</p>`,
qs:[
{q:"Woher ___ du? (kommen)",a:["kommst"],e:"du → -st."},
{q:"Ich ___ in Frankfurt. (wohnen)",a:["wohne"],e:"ich → -e."},
{q:"Er ___ bei einer Bank. (arbeiten)",a:["arbeitet"],e:"Gốc arbeit- kết thúc bằng -t → thêm e: arbeitet."},
{q:"Wir ___ Deutsch. (lernen)",a:["lernen"],e:"wir → -en, giống nguyên mẫu."},
{q:"___ ihr aus Vietnam? (kommen)",a:["kommt"],e:"ihr → -t."},
{q:"Du ___ sehr gut. (tanzen)",a:["tanzt"],e:"Gốc tanz- kết thúc bằng -z → du chỉ thêm -t."},
{q:"Wie ___ du? (heißen)",a:["heißt","heisst"],e:"Gốc heiß- kết thúc bằng -ß → du heißt."},
{q:"Ihr ___ viel. (arbeiten)",a:["arbeitet"],e:"ihr + gốc kết thúc -t → arbeitet."},
{q:"Frau Sato, wo ___ Sie?",o:["wohnst","wohnen","wohnt","wohne"],a:1,e:"Sie (lịch sự) → -en."},
{q:"Maria ___ nicht.",o:["antwortt","antwortest","antwortet","antworten"],a:2,e:"sie (Maria) + gốc kết thúc -t → antwortet."},
{q:"Ich ___ jeden Tag Deutsch. (lernen)",a:["lerne"],e:"ich → -e."},
{q:"Was ___ du am Wochenende? (machen)",a:["machst"],e:"du → -st."},
{q:"Er ___ gern Musik. (hören)",a:["hört"],e:"er → -t."},
{q:"Wir ___ in einer WG. (wohnen)",a:["wohnen"],e:"wir → -en."},
{q:"Ihr ___ sehr gut. (kochen)",a:["kocht"],e:"ihr → -t."},
{q:"Anna ___ auf den Bus. (warten)",a:["wartet"],e:"Gốc wart- kết thúc -t → thêm e."},
{q:"Du ___ zu schnell. (reden)",a:["redest"],e:"Gốc red- kết thúc -d → du redest."},
{q:"___ du Fußball? (spielen)",a:["spielst"],e:"du spielst."},
{q:"Das Kind ___ viel. (fragen)",a:["fragt"],e:"es → -t."},

{q:"Wie ___ ihr?",o:["heißt","heißen","heiße","heißet"],a:0,e:"ihr → -t: ihr heißt."},

{q:"Đuôi của ngôi „ihr“ ở thì hiện tại là gì?",o:["-e","-st","-t","-en"],a:2,e:"ihr kommt, ihr lernt."},
{q:"Câu nào đúng?",o:["Du arbeitst viel.","Du arbeitest viel.","Du arbeiten viel.","Du arbeitet viel."],a:1,e:"Gốc kết thúc -t → du arbeitest."}
]},
3:{lesson:`<h3>sein (là, thì, ở)</h3>
<p>Dùng để nói tên, nghề nghiệp, quốc tịch, tính chất, tuổi và nơi đang ở.</p>
<table><tr><td>ich <b>bin</b></td><td>wir <b>sind</b></td></tr><tr><td>du <b>bist</b></td><td>ihr <b>seid</b></td></tr><tr><td>er/sie/es <b>ist</b></td><td>sie/Sie <b>sind</b></td></tr></table>
<p class="ex"><b>Ich bin Student.</b><br>Tôi là sinh viên. (nghề nghiệp không có mạo từ)</p>
<p class="ex"><b>Sie ist 25 Jahre alt.</b><br>Cô ấy 25 tuổi. (tuổi dùng sein)</p>
<p class="ex"><b>Wir sind in Frankfurt.</b><br>Chúng tôi đang ở Frankfurt.</p>
<h3>haben (có)</h3>
<p>Dùng để nói sở hữu, và trong nhiều cụm cố định: Zeit haben (có thời gian), Hunger / Durst haben (đói / khát), Angst haben (sợ).</p>
<table><tr><td>ich <b>habe</b></td><td>wir <b>haben</b></td></tr><tr><td>du <b>hast</b></td><td>ihr <b>habt</b></td></tr><tr><td>er/sie/es <b>hat</b></td><td>sie/Sie <b>haben</b></td></tr></table>
<p class="ex"><b>Hast du Zeit?</b><br>Bạn có thời gian không?</p>
<p class="ex"><b>Er hat zwei Kinder.</b><br>Anh ấy có hai con.</p>
<h3>möchten (muốn, lịch sự)</h3>
<p>Dùng khi gọi món, đề nghị, nói mong muốn. Đi với danh từ, hoặc với một động từ nguyên mẫu ở cuối câu.</p>
<table><tr><td>ich <b>möchte</b></td><td>wir <b>möchten</b></td></tr><tr><td>du <b>möchtest</b></td><td>ihr <b>möchtet</b></td></tr><tr><td>er/sie/es <b>möchte</b></td><td>sie/Sie <b>möchten</b></td></tr></table>
<p class="ex"><b>Ich möchte einen Kaffee.</b><br>Tôi muốn một ly cà phê.</p>
<p class="ex"><b>Sie möchte Deutsch lernen.</b><br>Cô ấy muốn học tiếng Đức.</p>
<p class="warn"><b>Lỗi hay gặp:</b> „Ich habe 25 Jahre“ (đúng: Ich bin 25 Jahre alt); „Ich bin ein Student“ (đúng: Ich bin Student); „er möchtet“ (đúng: er möchte); nhầm <b>seid</b> (ihr seid) với <b>seit</b> (từ khi).</p>`,
rule:`<p><b>sein</b> và <b>haben</b> chia bất quy tắc, phải thuộc.</p>
<table><tr><th></th><th>sein</th><th>haben</th><th>möchten</th></tr><tr><td>ich</td><td>bin</td><td>habe</td><td>möchte</td></tr><tr><td>du</td><td>bist</td><td>hast</td><td>möchtest</td></tr><tr><td>er/sie/es</td><td>ist</td><td>hat</td><td>möchte</td></tr><tr><td>wir</td><td>sind</td><td>haben</td><td>möchten</td></tr><tr><td>ihr</td><td>seid</td><td>habt</td><td>möchtet</td></tr><tr><td>sie/Sie</td><td>sind</td><td>haben</td><td>möchten</td></tr></table>
<p>Lưu ý: <b>möchten</b> ở ngôi er/sie/es không có đuôi -t (er möchte).</p>`,

{q:"Das ___ meine Eltern.",o:["ist","seid","sind","bin"],a:2,e:"Eltern là số nhiều → Das sind …"},

4:{lesson:`<h3>Hiện tượng gì?</h3>
<p>Một nhóm động từ thông dụng đổi nguyên âm trong gốc khi chia ở thì hiện tại. Việc đổi này <b>chỉ xảy ra ở hai ngôi: du và er/sie/es</b>. Đuôi động từ vẫn như bình thường.</p>
<table><tr><th></th><th>sprechen (e → i)</th><th>lesen (e → ie)</th><th>fahren (a → ä)</th></tr><tr><td>ich</td><td>spreche</td><td>lese</td><td>fahre</td></tr><tr><td>du</td><td>spr<b>i</b>chst</td><td>l<b>ie</b>st</td><td>f<b>ä</b>hrst</td></tr><tr><td>er/sie/es</td><td>spr<b>i</b>cht</td><td>l<b>ie</b>st</td><td>f<b>ä</b>hrt</td></tr><tr><td>wir</td><td>sprechen</td><td>lesen</td><td>fahren</td></tr><tr><td>ihr</td><td>sprecht</td><td>lest</td><td>fahrt</td></tr><tr><td>sie/Sie</td><td>sprechen</td><td>lesen</td><td>fahren</td></tr></table>
<h3>Các động từ cần thuộc</h3>
<table><tr><td><b>e → i</b></td><td>sprechen, essen, helfen, geben, treffen, vergessen, nehmen</td></tr><tr><td><b>e → ie</b></td><td>lesen, sehen, empfehlen</td></tr><tr><td><b>a → ä</b></td><td>fahren, schlafen, tragen, waschen, gefallen</td></tr><tr><td><b>au → äu</b></td><td>laufen</td></tr></table>
<p>Không có quy tắc để đoán động từ nào đổi; phải học từng từ. Khi học từ mới, nên ghi kèm ngôi thứ ba: <b>fahren, er fährt</b>.</p>
<h3>Mấy dạng dễ sai</h3>
<p class="ex"><b>nehmen → du nimmst, er nimmt</b><br>đổi cả phụ âm: h biến mất, m gấp đôi</p>
<p class="ex"><b>essen → du isst, er isst</b> · <b>lesen → du liest, er liest</b><br>gốc kết thúc bằng -s nên ngôi du và er giống nhau</p>
<p class="ex"><b>Er spricht Deutsch, aber ihr sprecht Englisch.</b><br>Anh ấy nói tiếng Đức, còn các bạn nói tiếng Anh. (ihr không đổi)</p>
<p class="warn"><b>Lỗi hay gặp:</b> đổi nguyên âm ở cả ngôi ich hoặc ihr („ich spriche“, „ihr fährt“); quên đổi ở ngôi er („er fahrt“, „er lest“).</p>`,
rule:`<p>Một số động từ đổi nguyên âm gốc, <b>chỉ ở ngôi du và er/sie/es</b>.</p>
<table><tr><td>e → i</td><td>sprechen: du spr<b>i</b>chst, er spr<b>i</b>cht · essen, helfen, geben, nehmen (du n<b>imm</b>st)</td></tr><tr><td>e → ie</td><td>lesen: du l<b>ie</b>st, er l<b>ie</b>st · sehen</td></tr><tr><td>a → ä</td><td>fahren: du f<b>ä</b>hrst, er f<b>ä</b>hrt · schlafen, laufen (l<b>äu</b>ft)</td></tr></table>
<p>Các ngôi ich, wir, ihr, sie/Sie không đổi: ich spreche, ihr sprecht.</p>`,
qs:[
{q:"Du ___ sehr schnell. (sprechen)",a:["sprichst"],e:"e → i ở ngôi du."},
{q:"Er ___ gern Pizza. (essen)",a:["isst","ißt"],e:"e → i: er isst."},
{q:"___ du gern Krimis? (lesen)",a:["liest"],e:"e → ie; gốc kết thúc -s nên du chỉ thêm -t: liest."},

5:{lesson:`<h3>Modalverb là gì?</h3>
<p>Là động từ khuyết thiếu: können, müssen, wollen, dürfen, sollen (và möchten). Chúng không nói hành động, mà nói thái độ với hành động: có thể, phải, muốn, được phép, nên. Vì vậy chúng gần như luôn đi kèm một động từ thứ hai.</p>
<h3>Cách chia</h3>
<p>Hai điểm khác động từ thường: ngôi <b>ich</b> và <b>er/sie/es</b> giống nhau và <b>không có đuôi</b>; ở số ít, nguyên âm thường đổi.</p>
<table><tr><th></th><th>können</th><th>müssen</th><th>wollen</th><th>dürfen</th><th>sollen</th></tr><tr><td>ich</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td></tr><tr><td>du</td><td>kannst</td><td>musst</td><td>willst</td><td>darfst</td><td>sollst</td></tr><tr><td>er/sie/es</td><td>kann</td><td>muss</td><td>will</td><td>darf</td><td>soll</td></tr><tr><td>wir</td><td>können</td><td>müssen</td><td>wollen</td><td>dürfen</td><td>sollen</td></tr><tr><td>ihr</td><td>könnt</td><td>müsst</td><td>wollt</td><td>dürft</td><td>sollt</td></tr><tr><td>sie/Sie</td><td>können</td><td>müssen</td><td>wollen</td><td>dürfen</td><td>sollen</td></tr></table>
<h3>Vị trí trong câu: khung câu</h3>
<p>Modalverb đã chia đứng ở <b>vị trí 2</b>, động từ chính ở dạng <b>nguyên mẫu, cuối câu</b>. Mọi thông tin khác nằm giữa hai động từ.</p>
<p class="ex"><b>Ich <u>kann</u> heute nicht <u>kommen</u>.</b><br>Hôm nay tôi không đến được.</p>
<p class="ex"><b>Morgen <u>muss</u> ich früh <u>aufstehen</u>.</b><br>Ngày mai tôi phải dậy sớm.</p>
<p>Trong câu hỏi, Modalverb chuyển lên đầu (câu hỏi có/không) hoặc đứng sau từ hỏi; nguyên mẫu vẫn ở cuối.</p>
<p class="ex"><b><u>Kannst</u> du <u>schwimmen</u>?</b><br>Bạn biết bơi không?</p>
<p class="ex"><b>Wann <u>musst</u> du <u>arbeiten</u>?</b><br>Khi nào bạn phải làm việc?</p>
<p class="warn"><b>Lỗi hay gặp:</b> đặt nguyên mẫu ngay sau Modalverb như tiếng Việt và tiếng Anh („Ich kann kommen heute“); thêm đuôi ở ngôi thứ ba („er kannt“, „sie musst“); thêm „zu“ („Ich muss zu arbeiten“).</p>`,
rule:`<p>Động từ khuyết thiếu: ngôi <b>ich</b> và <b>er/sie/es</b> giống nhau và <b>không có đuôi</b>; số ít thường đổi nguyên âm.</p>

<p>Vị trí: động từ khuyết thiếu ở <b>vị trí 2</b>, động từ chính ở dạng nguyên mẫu <b>cuối câu</b>: Ich <b>kann</b> heute nicht <b>kommen</b>.</p>`,

{q:"Er ___ nicht schwimmen.",o:["kannt","kann","kannst","können"],a:1,e:"er kann."},

6:{lesson:`<h3>Mỗi Modalverb một nghĩa</h3>
<p><b>können</b>: khả năng, kỹ năng, hoặc điều kiện cho phép.</p>
<p class="ex"><b>Sie kann sehr gut kochen.</b><br>Cô ấy nấu ăn rất giỏi.</p>
<p><b>müssen</b>: bắt buộc, cần thiết, không có lựa chọn khác.</p>
<p class="ex"><b>Ich muss morgen arbeiten.</b><br>Ngày mai tôi phải đi làm.</p>
<p><b>dürfen</b>: được phép.</p>
<p class="ex"><b>Darf ich hier fotografieren?</b><br>Tôi được chụp ảnh ở đây không?</p>
<p><b>wollen</b>: ý muốn mạnh, kế hoạch đã quyết.</p>
<p class="ex"><b>Ich will Architekt werden.</b><br>Tôi muốn trở thành kiến trúc sư.</p>
<p><b>möchten</b>: mong muốn, nói lịch sự.</p>
<p class="ex"><b>Ich möchte bitte einen Tee.</b><br>Cho tôi một tách trà.</p>
<p><b>sollen</b>: người khác yêu cầu hoặc khuyên; mình chỉ truyền lại.</p>
<p class="ex"><b>Der Arzt sagt, ich soll mehr schlafen.</b><br>Bác sĩ bảo tôi nên ngủ nhiều hơn.</p>
<h3>Các cặp dễ nhầm</h3>
<table><tr><td><b>müssen</b> / <b>sollen</b></td><td>müssen: tự mình thấy cần, hoặc hoàn cảnh bắt buộc. sollen: có người khác bảo.</td></tr><tr><td><b>wollen</b> / <b>möchten</b></td><td>Cùng là muốn, nhưng với người lạ, trong quán, ở cơ quan thì dùng möchten.</td></tr><tr><td><b>nicht müssen</b> / <b>nicht dürfen</b></td><td>nicht müssen = không cần (vẫn được làm). nicht dürfen = bị cấm.</td></tr></table>
<p class="ex"><b>Du musst nicht kommen.</b><br>Bạn không cần đến.</p>
<p class="ex"><b>Du darfst nicht kommen.</b><br>Bạn không được đến.</p>
<p class="warn"><b>Lỗi hay gặp:</b> dịch „không được“ thành „nicht müssen“ theo kiểu „must not“ của tiếng Anh. Trong tiếng Đức, cấm là <b>nicht dürfen</b>.</p>`,
rule:`<table><tr><td><b>können</b></td><td>khả năng, có thể làm được</td></tr><tr><td><b>müssen</b></td><td>bắt buộc, cần thiết · <b>nicht müssen</b> = không cần</td></tr><tr><td><b>dürfen</b></td><td>được phép · <b>nicht dürfen</b> = bị cấm</td></tr><tr><td><b>wollen</b></td><td>ý muốn, kế hoạch (mạnh)</td></tr><tr><td><b>möchten</b></td><td>mong muốn, lịch sự</td></tr><tr><td><b>sollen</b></td><td>người khác yêu cầu, lời khuyên được truyền lại</td></tr></table>`,

7:{lesson:`<h3>Động từ tách là gì?</h3>
<p>Nhiều động từ tiếng Đức gồm một tiền tố ghép với động từ gốc, và tiền tố làm đổi nghĩa: kommen (đến) → <b>an</b>kommen (đến nơi), <b>mit</b>kommen (đi cùng), <b>zurück</b>kommen (quay lại). Khi chia trong câu, tiền tố tách ra và chạy xuống <b>cuối câu</b>.</p>
<h3>Vị trí trong câu</h3>
<p>Phần động từ chia theo chủ ngữ ở vị trí 2, tiền tố ở cuối. Giống khung câu của Modalverb.</p>
<p class="ex"><b>einkaufen → Ich <u>kaufe</u> im Supermarkt <u>ein</u>.</b><br>Tôi mua đồ ở siêu thị.</p>
<p class="ex"><b>aufstehen → Wann <u>stehst</u> du <u>auf</u>?</b><br>Khi nào bạn thức dậy?</p>
<p class="ex"><b>anrufen → <u>Rufst</u> du mich morgen <u>an</u>?</b><br>Mai bạn gọi cho tôi nhé?</p>
<p>Khi có Modalverb, động từ tách trở về dạng nguyên mẫu viết liền ở cuối câu:</p>
<p class="ex"><b>Ich muss heute <u>einkaufen</u>.</b><br>Hôm nay tôi phải đi mua đồ.</p>
<h3>Tiền tố tách được thường gặp</h3>
<table><tr><td><b>an-</b></td><td>anrufen, ankommen, anfangen</td></tr><tr><td><b>auf-</b></td><td>aufstehen, aufmachen, aufräumen</td></tr><tr><td><b>aus-</b></td><td>ausgehen, aussteigen</td></tr><tr><td><b>ein-</b></td><td>einkaufen, einsteigen, einladen</td></tr><tr><td><b>ab-, mit-, zu-, zurück-, fern-, vor-</b></td><td>abfahren, mitkommen, zumachen, zurückkommen, fernsehen, vorbereiten</td></tr></table>
<h3>Tiền tố không bao giờ tách</h3>
<p><b>be-, ge-, er-, ver-, zer-, ent-, emp-, miss-</b>: bekommen, verstehen, erzählen, gefallen.</p>
<p class="ex"><b>Ich bekomme einen Brief.</b> · <b>Ich verstehe das nicht.</b></p>
<p>Mẹo nghe: tiền tố tách được mang trọng âm (<b>EIN</b>kaufen), tiền tố không tách thì trọng âm rơi vào gốc (be<b>KOM</b>men).</p>
<p class="warn"><b>Lỗi hay gặp:</b> không tách („Ich einkaufe heute“); để tiền tố ngay sau động từ („Ich rufe an dich“); quên đổi nguyên âm ở phần gốc („Der Zug fahrt ab“, đúng: fährt ab).</p>`,
rule:`<p>Động từ tách: tiền tố (an-, auf-, ab-, ein-, mit-, zu-, fern-, zurück- …) tách ra và đứng <b>cuối câu</b>; phần động từ chia ở vị trí 2.</p>
<p>einkaufen → Ich <b>kaufe</b> im Supermarkt <b>ein</b>.</p>
<p>Với Modalverb, động từ không tách và đứng cuối câu ở dạng nguyên mẫu: Ich muss früh <b>aufstehen</b>.</p>
<p>Tiền tố <b>be-, ge-, er-, ver-, zer-, ent-, emp-, miss-</b> không bao giờ tách: bekommen → Ich bekomme …</p>`,
qs:[

{q:"Wann fängt der Kurs ___? (anfangen)",a:["an"],e:"Trong câu hỏi, tiền tố vẫn ở cuối."},
{q:"Er ___ seine Mutter an. (anrufen)",a:["ruft"],e:"er ruft … an."},

{q:"Sie sieht am Abend ___. (fernsehen)",a:["fern"],e:"fernsehen → sieht … fern."},

{q:"Câu nào đúng?",o:["Ich anrufe dich morgen.","Ich rufe an dich morgen.","Ich rufe dich morgen an.","Ich an rufe dich morgen."],a:2,e:"Động từ ở vị trí 2, tiền tố cuối câu."},
{q:"Câu nào đúng?",o:["Ich muss morgen früh stehen auf.","Ich muss morgen früh aufstehen.","Ich muss auf morgen früh stehen.","Ich stehe muss morgen früh auf."],a:1,e:"Có Modalverb → nguyên mẫu viết liền, cuối câu."},
{q:"Động từ nào KHÔNG tách?",o:["ankommen","mitkommen","zurückkommen","bekommen"],a:3,e:"Tiền tố be- không tách."},
{q:"Wann ___ der Film an? (anfangen)",a:["fängt"],e:"anfangen → fängt … an (a → ä)."},
{q:"Ich ___ morgen meine Oma an. (anrufen)",a:["rufe"],e:"ich rufe … an."},
{q:"Der Zug kommt um 9 Uhr ___. (ankommen)",a:["an"],e:"Tiền tố an ở cuối câu."},

{q:"Câu nào đúng?",o:["Wir fahren morgen um 8 Uhr ab.","Wir abfahren morgen um 8 Uhr.","Wir ab fahren morgen um 8 Uhr.","Ab wir fahren morgen um 8 Uhr."],a:0,e:"Động từ vị trí 2, tiền tố ab cuối câu."},
{q:"Câu nào đúng?",o:["Ich will heute fernsehen.","Ich will heute sehen fern.","Ich will fern heute sehen.","Ich fernsehen will heute."],a:0,e:"Có Modalverb → nguyên mẫu viết liền ở cuối câu."},
{q:"Động từ nào là động từ tách?",o:["verstehen","bezahlen","einkaufen","erzählen"],a:2,e:"ein- tách được; ver-, be-, er- không tách."},
{q:"Động từ nào KHÔNG tách?",o:["aufstehen","ankommen","verkaufen","mitnehmen"],a:2,e:"ver- không tách."},

]},
8:{lesson:`<h3>Dùng khi nào?</h3>
<p>Imperativ là thể mệnh lệnh: yêu cầu, hướng dẫn, khuyên, mời. Thêm <b>bitte</b> để lịch sự hơn. Động từ luôn đứng đầu câu.</p>
<h3>Ba dạng, theo người nghe</h3>
<table><tr><th>Nói với</th><th>Cách tạo</th><th>kommen</th><th>warten</th></tr><tr><td><b>Sie</b></td><td>nguyên mẫu + Sie</td><td>Kommen Sie!</td><td>Warten Sie!</td></tr><tr><td><b>ihr</b></td><td>dạng ihr, bỏ chữ ihr</td><td>Kommt!</td><td>Wartet!</td></tr><tr><td><b>du</b></td><td>dạng du, bỏ đuôi -st và bỏ chữ du</td><td>Komm!</td><td>Warte!</td></tr></table>
<p>Ngôi du: gốc kết thúc bằng -t, -d, -ig thì thêm <b>-e</b>: Warte! Arbeite! Entschuldige!</p>
<h3>Động từ đổi nguyên âm</h3>
<p><b>e → i / ie</b>: giữ nguyên thay đổi.</p>
<p class="ex"><b>du sprichst → Sprich!</b> · <b>du liest → Lies!</b> · <b>du hilfst → Hilf!</b> · <b>du nimmst → Nimm!</b></p>
<p><b>a → ä</b>: bỏ umlaut, quay về a.</p>
<p class="ex"><b>du fährst → Fahr!</b> · <b>du schläfst → Schlaf!</b></p>
<h3>sein và haben</h3>
<table><tr><th></th><th>du</th><th>ihr</th><th>Sie</th></tr><tr><td>sein</td><td>Sei!</td><td>Seid!</td><td>Seien Sie!</td></tr><tr><td>haben</td><td>Hab!</td><td>Habt!</td><td>Haben Sie!</td></tr></table>
<p class="ex"><b>Sei bitte leise!</b><br>Làm ơn giữ yên lặng!</p>
<h3>Động từ tách</h3>
<p>Tiền tố vẫn ra cuối câu.</p>
<p class="ex"><b>Steh auf!</b> · <b>Macht bitte die Tür zu!</b> · <b>Rufen Sie mich an!</b></p>
<p class="warn"><b>Lỗi hay gặp:</b> giữ đuôi -st ở ngôi du („Sprichst langsam!“); giữ umlaut („Fähr!“); quên chữ Sie ở dạng lịch sự („Kommen bitte!“).</p>`,
rule:`<table><tr><td><b>Sie</b></td><td>nguyên mẫu + Sie</td><td>Kommen Sie!</td></tr><tr><td><b>ihr</b></td><td>dạng ihr, bỏ chủ ngữ</td><td>Kommt!</td></tr><tr><td><b>du</b></td><td>dạng du, bỏ -st và bỏ du</td><td>Komm!</td></tr></table>
<p>Ngôi du: động từ đổi <b>e → i/ie</b> giữ nguyên thay đổi (sprich, lies, hilf, nimm), nhưng <b>a → ä</b> thì bỏ umlaut (fahr, schlaf). <b>sein</b>: Sei! / Seid! / Seien Sie! Động từ tách: Steh auf!</p>`,
qs:[
{q:"___ Sie bitte herein! (kommen, Sie)",a:["kommen"],e:"Ngôi Sie: nguyên mẫu + Sie."},
{q:"___ bitte langsam! (sprechen, du)",a:["sprich"],e:"du sprichst → bỏ -st → sprich."},
{q:"___ mir bitte! (helfen, du)",a:["hilf"],e:"du hilfst → hilf."},
{q:"___ bitte leise! (sein, ihr)",a:["seid"],e:"sein, ngôi ihr → Seid!"},
{q:"___ das Buch! (lesen, du)",a:["lies"],e:"du liest → lies."},
{q:"___ die Tür zu! (zumachen, ihr)",a:["macht"],e:"Dạng ihr, tiền tố zu ở cuối."},
{q:"___ Sie bitte Platz! (nehmen, Sie)",a:["nehmen"],e:"Ngôi Sie không đổi nguyên âm."},
{q:"___ nicht so schnell! (fahren, du)",a:["fahr","fahre"],e:"a → ä không áp dụng trong Imperativ: fahr, không phải fähr."},
{q:"___ bitte ruhig! (sein, du)",o:["Bist","Seid","Sei","Sein"],a:2,e:"sein, ngôi du → Sei!"},
{q:"Imperativ (du) của „aufstehen“ là gì?",o:["Aufsteh!","Steh auf!","Stehst auf!","Auf steh!"],a:1,e:"Động từ tách: tiền tố ra cuối."},
{q:"___ bitte! (warten, du)",a:["warte","wart"],e:"Gốc kết thúc -t → thêm e: Warte!"},
{q:"___ mir bitte das Salz! (geben, du)",a:["gib"],e:"du gibst → Gib!"},
{q:"___ Sie bitte hier! (unterschreiben, Sie)",a:["unterschreiben"],e:"Ngôi Sie: nguyên mẫu + Sie."},
{q:"___ keine Angst! (haben, du)",a:["hab","habe"],e:"haben, ngôi du → Hab!"},
{q:"___ pünktlich! (sein, Sie)",a:["seien"],e:"sein, ngôi Sie → Seien Sie!"},
{q:"___ bitte auf! (aufstehen, ihr)",a:["steht"],e:"ihr steht → Steht auf!"},
{q:"___ das Buch mit! (mitnehmen, du)",a:["nimm"],e:"du nimmst → Nimm … mit!"},
{q:"___ gut! (schlafen, du)",a:["schlaf","schlafe"],e:"a → ä không áp dụng: Schlaf gut!"},
{q:"Imperativ (du) của „essen“ là gì?",o:["Isst!","Iss!","Ess!","Essen!"],a:1,e:"du isst → Iss!"},
{q:"Imperativ (ihr) của „kommen“ là gì?",o:["Kommt!","Kommen!","Komm!","Kommst!"],a:0,e:"ihr kommt → Kommt!"},
{q:"Dạng lịch sự (Sie) của „Ruf mich an!“ là gì?",o:["Rufen Sie mich an!","Rufen mich an Sie!","Ruf Sie mich an!","Sie rufen mich an!"],a:0,e:"Nguyên mẫu + Sie, tiền tố cuối câu."},
{q:"___ doch nicht so laut, Kinder!",o:["Sei","Seid","Seien","Bist"],a:1,e:"Nói với nhiều trẻ (ihr) → Seid!"},
{q:"Imperativ (du) của „arbeiten“ là gì?",o:["Arbeit!","Arbeite!","Arbeitest!","Arbeitet!"],a:1,e:"Gốc kết thúc -t → Arbeite!"},
{q:"Câu nào đúng?",o:["Fähr vorsichtig!","Fahr vorsichtig!","Fährst vorsichtig!","Fahrt du vorsichtig!"],a:1,e:"Bỏ umlaut: Fahr!"},
{q:"Câu nào đúng?",o:["Mach bitte das Licht aus!","Ausmach bitte das Licht!","Mach aus bitte das Licht!","Machst bitte das Licht aus!"],a:0,e:"Động từ đầu câu, tiền tố aus cuối câu."}
]}
,101:{lesson:`<p class="sub">Chủ đề A của sách Großes Übungsbuch Wortschatz (Hueber). Từ vựng chọn ở mức A2; bài tập soạn mới.</p>
<h3>Chào hỏi và tạm biệt</h3>
<table><tr><td><b>Guten Morgen / Guten Tag / Guten Abend</b></td><td>chào buổi sáng / ban ngày / buổi tối</td></tr><tr><td><b>Hallo!</b></td><td>chào (thân mật)</td></tr><tr><td><b>Grüß Gott!</b></td><td>xin chào (miền Nam Đức, Áo)</td></tr><tr><td><b>Auf Wiedersehen!</b></td><td>tạm biệt (trang trọng)</td></tr><tr><td><b>Tschüss!</b></td><td>tạm biệt (thân mật)</td></tr><tr><td><b>Bis bald / Bis morgen!</b></td><td>hẹn sớm gặp lại / hẹn mai gặp</td></tr><tr><td><b>Gute Nacht!</b></td><td>chúc ngủ ngon (chỉ khi đi ngủ, không dùng để chào)</td></tr></table>
<p class="ex"><b>Wie geht es Ihnen?</b> (lịch sự) · <b>Wie geht's?</b> (thân mật)<br>— Danke, gut. Und Ihnen / und dir? · Es geht. (tàm tạm)</p>
<h3>Giới thiệu</h3>
<p class="ex"><b>Ich heiße … / Mein Name ist …</b> · <b>Ich komme aus …</b> · <b>Ich wohne in …</b> · <b>Ich bin … von Beruf.</b></p>
<p class="ex"><b>Darf ich vorstellen? Das ist Frau Becker.</b> — <b>Freut mich!</b></p>
<h3>Thông tin cá nhân trong mẫu đơn</h3>
<table><tr><td>der Vorname</td><td>tên</td><td>der Nachname / Familienname</td><td>họ</td></tr><tr><td>das Geburtsdatum</td><td>ngày sinh</td><td>der Geburtsort</td><td>nơi sinh</td></tr><tr><td>die Straße, die Hausnummer</td><td>đường, số nhà</td><td>die Postleitzahl (PLZ)</td><td>mã bưu chính</td></tr><tr><td>der Wohnort</td><td>nơi ở</td><td>die Staatsangehörigkeit</td><td>quốc tịch</td></tr><tr><td>der Familienstand</td><td>tình trạng hôn nhân</td><td>ledig / verheiratet / geschieden</td><td>độc thân / đã kết hôn / ly hôn</td></tr><tr><td>der Beruf</td><td>nghề nghiệp</td><td>die Unterschrift</td><td>chữ ký</td></tr></table>
<h3>Nước, người, ngôn ngữ</h3>
<table><tr><th>Nước</th><th>Người (nam / nữ)</th><th>Ngôn ngữ</th></tr><tr><td>Vietnam</td><td>der Vietnamese / die Vietnamesin</td><td>Vietnamesisch</td></tr><tr><td>Deutschland</td><td>der Deutsche / die Deutsche</td><td>Deutsch</td></tr><tr><td>Frankreich</td><td>der Franzose / die Französin</td><td>Französisch</td></tr><tr><td>China</td><td>der Chinese / die Chinesin</td><td>Chinesisch</td></tr><tr><td>Japan</td><td>der Japaner / die Japanerin</td><td>Japanisch</td></tr><tr><td>Österreich</td><td>der Österreicher / die Österreicherin</td><td>Deutsch</td></tr><tr><td>die Schweiz</td><td>der Schweizer / die Schweizerin</td><td>Deutsch, Französisch, Italienisch …</td></tr><tr><td>die USA</td><td>der Amerikaner / die Amerikanerin</td><td>Englisch</td></tr></table>
<p class="warn"><b>Lưu ý:</b> phần lớn tên nước không có mạo từ (aus Vietnam), nhưng một số nước có: <b>aus der Schweiz, aus der Türkei, aus den USA</b>. Ngôn ngữ viết hoa và không có đuôi giống: Ich spreche Deutsch.</p>`,
rule:`<p>Chào: Guten Tag (trang trọng), Hallo (thân mật). Tạm biệt: Auf Wiedersehen (trang trọng), Tschüss (thân mật). Mẫu đơn: Vorname = tên, Nachname = họ, PLZ = mã bưu chính, Staatsangehörigkeit = quốc tịch, ledig = độc thân. Nước có mạo từ: aus der Schweiz, der Türkei, den USA.</p>`,
qs:[
{q:"Bây giờ là 8 giờ sáng. Bạn chào:",o:["Guten Morgen!","Guten Abend!","Gute Nacht!","Auf Wiedersehen!"],a:0,e:"Buổi sáng → Guten Morgen."},
{q:"Bạn rời văn phòng và chào sếp:",o:["Tschüss!","Auf Wiedersehen!","Hallo!","Gute Nacht!"],a:1,e:"Với sếp nên dùng dạng trang trọng; Tschüss là thân mật."},
{q:"„Wie geht es Ihnen?“ – „___“",o:["Danke, gut. Und Ihnen?","Ich heiße Müller.","Ich komme aus Hanoi.","Bis morgen!"],a:0,e:"Câu hỏi thăm sức khỏe."},
{q:"„Das ist Frau Becker.“ – „___“",o:["Freut mich!","Tschüss!","Gute Nacht!","Danke, gut."],a:0,e:"Khi được giới thiệu: Freut mich = rất vui được gặp."},
{q:"Trong mẫu đơn, „Nachname“ là gì?",o:["tên","họ","ngày sinh","chữ ký"],a:1,e:"Nachname = Familienname = họ."},
{q:"„Familienstand: ledig“ nghĩa là gì?",o:["đã kết hôn","độc thân","ly hôn","góa"],a:1,e:"ledig = độc thân."},
{q:"„Staatsangehörigkeit“ là gì?",o:["nơi sinh","quốc tịch","nghề nghiệp","địa chỉ"],a:1,e:"Staatsangehörigkeit = quốc tịch."},
{q:"Ich komme aus ___ Schweiz.",o:["—","die","der","dem"],a:2,e:"die Schweiz có mạo từ; sau aus dùng Dativ → aus der Schweiz."},
{q:"Er kommt aus Frankreich. Er ist ___.",o:["Französisch","Franzose","Französin","Frankreicher"],a:1,e:"Người nam: der Franzose; Französisch là ngôn ngữ."},
{q:"Sie kommt aus Vietnam. Sie ist ___.",o:["Vietnamese","Vietnamesin","Vietnamesisch","Vietnamin"],a:1,e:"Người nữ: die Vietnamesin."},
{q:"In Österreich spricht man ___.",o:["Österreichisch","Deutsch","Österreicher","Österreich"],a:1,e:"Ngôn ngữ chính ở Áo là tiếng Đức."},
{q:"Từ nào KHÔNG dùng để chào khi gặp?",o:["Guten Tag","Hallo","Grüß Gott","Tschüss"],a:3,e:"Tschüss là tạm biệt."},
{q:"Mẫu đơn hỏi „PLZ“. Bạn điền:",o:["60311","Frankfurt","Goethestraße","0151 2345678"],a:0,e:"PLZ = Postleitzahl, mã bưu chính 5 chữ số."},
{q:"„Unterschrift“ là gì?",o:["chữ ký","ngày ký","con dấu","họ tên"],a:0,e:"die Unterschrift = chữ ký."},
{q:"Ich komme aus ___ USA.",o:["der","die","den","dem"],a:2,e:"die USA là số nhiều; aus + Dativ số nhiều → aus den USA."},
{q:"Guten Tag! Mein ___ ist Anna Weber.",a:["Name"],e:"Mein Name ist … = Tên tôi là …"},
{q:"Ich ___ aus Vietnam. (kommen)",a:["komme"],e:"Ich komme aus …"},
{q:"Wie ___ es dir?",a:["geht"],e:"Wie geht es dir? = Bạn khỏe không?"},
{q:"Auf ___! (tạm biệt, trang trọng)",a:["Wiedersehen"],e:"Auf Wiedersehen."},
{q:"Ich bin Architekt von ___.",a:["Beruf"],e:"… von Beruf = làm nghề …"},
{q:"Ich spreche Vietnamesisch und ein bisschen ___. (tiếng Đức)",a:["Deutsch"],e:"Ngôn ngữ viết hoa: Deutsch."},
{q:"Bis ___! (hẹn mai gặp)",a:["morgen"],e:"Bis morgen!"},
{q:"„Das ist Herr Wang.“ – „Freut ___!“",a:["mich"],e:"Freut mich!"},
{q:"Er kommt aus Japan, er spricht ___.",a:["Japanisch"],e:"Japan → Japanisch."},
{q:"Ich bin nicht verheiratet, ich bin ___.",a:["ledig"],e:"ledig = độc thân."}
]}
,107:{lesson:`<p class="sub">Chủ đề G của sách Großes Übungsbuch Wortschatz (Hueber). Từ vựng chọn ở mức A2; bài tập soạn mới.</p>
<h3>Nhà và các phòng</h3>
<table><tr><td>die Wohnung</td><td>căn hộ</td><td>das Haus</td><td>ngôi nhà</td></tr><tr><td>das Zimmer</td><td>phòng</td><td>das Wohnzimmer</td><td>phòng khách</td></tr><tr><td>das Schlafzimmer</td><td>phòng ngủ</td><td>die Küche</td><td>bếp</td></tr><tr><td>das Bad</td><td>phòng tắm</td><td>der Flur</td><td>hành lang</td></tr><tr><td>der Balkon</td><td>ban công</td><td>der Keller</td><td>tầng hầm</td></tr><tr><td>das Erdgeschoss (EG)</td><td>tầng trệt</td><td>der erste Stock</td><td>tầng một (trên tầng trệt)</td></tr><tr><td>die Treppe</td><td>cầu thang</td><td>der Aufzug</td><td>thang máy</td></tr></table>
<h3>Thuê nhà</h3>
<table><tr><td>die Miete / mieten</td><td>tiền thuê / thuê</td></tr><tr><td>die Nebenkosten (NK)</td><td>phí phụ (sưởi, nước, rác…)</td></tr><tr><td>die Kaution</td><td>tiền đặt cọc</td></tr><tr><td>der Vermieter / der Mieter</td><td>chủ nhà / người thuê</td></tr><tr><td>die WG (Wohngemeinschaft)</td><td>nhà ở chung</td></tr><tr><td>möbliert</td><td>có sẵn nội thất</td></tr><tr><td>umziehen</td><td>chuyển nhà</td></tr></table>
<p class="ex"><b>3 Zi., 75 m², EG, 850 € + NK</b><br>3 phòng, 75 mét vuông, tầng trệt, 850 euro chưa gồm phí phụ</p>
<h3>Đồ đạc</h3>
<table><tr><td><b>Phòng khách, phòng ngủ</b></td><td>der Tisch, der Stuhl, das Sofa, der Sessel, das Bett, der Schrank, das Regal, der Teppich, die Lampe, der Spiegel</td></tr><tr><td><b>Bếp</b></td><td>der Herd (bếp nấu), der Backofen (lò nướng), der Kühlschrank (tủ lạnh), die Spülmaschine (máy rửa bát), die Mikrowelle</td></tr><tr><td><b>Phòng tắm</b></td><td>die Dusche (vòi sen), die Badewanne (bồn tắm), das Waschbecken (bồn rửa mặt), die Toilette, das Handtuch (khăn tắm)</td></tr></table>

 }

 "lese", "lesen", "liest"], "a": 3, "e": "e → ie ở ngôi sie."}, {"q": "Wir _____ heute nicht kommen, wir sind krank.", "o": ["kann", "könnt", "können", "kannst"], "a": 2, "e": "wir können."}, {"q": "„_____ ich hier sitzen?“ – „Ja, natürlich.“", "o": ["Muss", "Darf", "Will", "Soll"], "a": 1, "e": "Xin phép → dürfen."}, {"q": "Morgen _____ ich meine Eltern _____.", "o": ["rufe … an", "anrufe … –", "rufe … auf", "ruft … an"], "a": 0, "e": "anrufen tách: rufe … an."}, {"q": "Kinder, _____ bitte leise!", "o": ["sei", "seien", "sind", "seid"], "a": 3, "e": "Imperativ ngôi ihr của sein: Seid!"}, {"q": "Der Arzt sagt, du _____ nicht so viel arbeiten.", "o": ["willst", "möchtest", "sollst", "kannst"], "a": 2, "e": "Lời khuyên của người khác → sollen."}, {"q": "Heute Abend _____.", "o": ["ich sehe fern", "sehe ich fern", "ich fernsehe", "sehe fern ich"], "a": 1, "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ sau, tiền tố cuối."}, {"q": "_____ du mir bitte helfen?", "o": ["Kannst", "Darfst", "Musst", "Sollst"], "a": 0, "e": "Nhờ vả → Kannst du …?"}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Liebe Oma, wie {1} es dir? Mir geht es gut. Ich wohne jetzt in Berlin. Meine Wohnung ist klein, aber {2} ist sehr schön. Jeden Morgen {3} ich mit dem Bus zur Uni. Am Nachmittag {4} ich in einem Café arbeiten. Am Wochenende {5} ich oft meine Freunde. Wann {6} du mich besuchen? Viele Grüße, Mai", "qs": [{"o": ["geht", "gehst", "gehen", "gehe"], "a": 0, "e": "Wie geht es dir?"}, {"o": ["er", "es", "ihr", "sie"], "a": 3, "e": "die Wohnung → sie."}, {"o": ["fährt", "fährst", "fahre", "fahren"], "a": 2, "e": "Ngôi ich không đổi nguyên âm."}, {"o": ["musst", "muss", "müssen", "müsst"], "a": 1, "e": "ich muss."}, {"o": ["treffe", "trifft", "triffst", "treffen"], "a": 0, "e": "ich treffe."}, {"o": ["kommt", "komme", "kommen", "kommst"], "a": 3, "e": "du kommst."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Lena ist 30 Jahre alt und wohnt mit ihrem Mann Jonas in Hamburg. Sie ist Lehrerin, er ist Ingenieur. Lena steht jeden Tag um halb sechs auf, denn die Schule fängt schon um acht Uhr an und sie fährt eine Stunde mit dem Zug. Jonas arbeitet zu Hause. Er kann lange schlafen und kocht am Abend für beide. Am Wochenende wollen sie oft ans Meer fahren, aber Lena muss am Samstag oft Tests korrigieren.", "qs": [{"q": "Was ist Lena von Beruf?", "o": ["Ingenieurin", "Lehrerin", "Köchin", "Studentin"], "a": 1, "e": "„Sie ist Lehrerin“."}, {"q": "Wie fährt Lena zur Arbeit?", "o": ["Mit dem Zug", "Mit dem Auto", "Mit dem Fahrrad", "Zu Fuß"], "a": 0, "e": "„… fährt eine Stunde mit dem Zug“."}, {"q": "Wer kocht am Abend?", "o": ["Lena", "Lenas Mutter", "Niemand", "Jonas"], "a": 3, "e": "„Er … kocht am Abend für beide“."}, {"q": "Warum fahren sie am Wochenende oft nicht ans Meer?", "o": ["Jonas muss arbeiten.", "Sie haben kein Auto.", "Lena muss Tests korrigieren.", "Das Wetter ist schlecht."], "a": 2, "e": "„… aber Lena muss am Samstag oft Tests korrigieren“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Mein Freund {A|kommt} aus Spanien und {B|sprecht} {C|sehr} gut {D|Deutsch}.", "a": 1, "fix": "spricht", "e": "Ngôi er: e → i."}, {"q": "Wir {A|möchtet} heute Abend {B|ins Kino} {C|gehen}, {D|oder}?", "a": 0, "fix": "möchten", "e": "wir möchten."}, {"q": "{A|Die} Lampe ist {B|neu}, {C|er} {D|kostet} 30 Euro.", "a": 2, "fix": "sie", "e": "die Lampe → sie."}, {"q": "{A|Am Montag} {B|ich muss} {C|früh} {D|aufstehen}.", "a": 1, "fix": "muss ich", "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ theo sau."}, {"q": "Anna, {A|lest} bitte {B|den Text} {C|laut} {D|vor}!", "a": 0, "fix": "lies", "e": "Nói với một người (du): vorlesen → Lies … vor!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Ich kann nicht schwimmen.", "o": ["Ich darf nicht schwimmen.", "Ich will nicht schwimmen.", "Ich muss nicht schwimmen.", "Schwimmen ist für mich nicht möglich."], "a": 3, "e": "können = khả năng."}, {"q": "Komm bitte mit!", "o": ["Du kommst nicht mit.", "Ich komme mit.", "Kommst du bitte mit?", "Kommt bitte mit!"], "a": 2, "e": "Imperativ ngôi du = lời đề nghị với du; „Kommt“ là nói với ihr."}, {"q": "Arbeiten ist am Sonntag nicht nötig.", "o": ["Am Sonntag darf ich nicht arbeiten.", "Am Sonntag muss ich nicht arbeiten.", "Am Sonntag kann ich nicht arbeiten.", "Am Sonntag will ich arbeiten."], "a": 1, "e": "nicht nötig = nicht müssen."}, {"q": "Meine Mutter sagt: „Räum dein Zimmer auf!“", "o": ["Ich soll mein Zimmer aufräumen.", "Ich will mein Zimmer aufräumen.", "Ich darf mein Zimmer aufräumen.", "Ich kann mein Zimmer aufräumen."], "a": 0, "e": "Yêu cầu của người khác → sollen."}, {"q": "Fotografieren ist hier erlaubt.", "o": ["Man muss hier fotografieren.", "Man darf hier nicht fotografieren.", "Man will hier fotografieren.", "Man darf hier fotografieren."], "a": 3, "e": "erlaubt = được phép = dürfen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Was ___ (essen) du gern?", "a": ["isst", "ißt"], "e": "e → i: du isst."}, {"q": "Ihr ___ (sein) sehr nett.", "a": ["seid"], "e": "ihr seid."}, {"q": "Er ___ (warten) schon zehn Minuten.", "a": ["wartet"], "e": "Gốc -t → thêm e."}, {"q": "Du ___ (schlafen) zu lange.", "a": ["schläfst"], "e": "a → ä."}, {"q": "Mein Sohn ___ (können) schon Rad fahren.", "a": ["kann"], "e": "er kann."}, {"q": "___ (helfen) mir bitte, Paul!", "a": ["hilf"], "e": "Imperativ du: Hilf!"}, {"q": "Meine Eltern ___ (möchten) nach Berlin fahren.", "a": ["möchten"], "e": "Số nhiều → möchten."}, {"q": "Der Kurs ___ (anfangen) um 9 Uhr an.", "a": ["fängt"], "e": "fängt … an."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Ich rufe dich morgen an. (wollen)", "start": "Ich will", "a": ["Ich will dich morgen anrufen"], "e": "Modalverb vị trí 2, anrufen cuối câu."}, {"q": "Kannst du bitte die Tür zumachen?", "start": "Mach", "a": ["Mach bitte die Tür zu", "Mach die Tür bitte zu", "Mach die Tür zu"], "e": "Imperativ du, zu cuối câu."}, {"q": "Er fährt heute nach Köln.", "start": "Heute", "a": ["Heute fährt er nach Köln"], "e": "Heute vị trí 1 → động từ vị trí 2."}, {"q": "Essen ist hier verboten.", "start": "Man", "a": ["Man darf hier nicht essen"], "e": "verboten = nicht dürfen."}, {"q": "Wir sehen am Abend fern. (möchten)", "start": "Wir möchten", "a": ["Wir möchten am Abend fernsehen"], "e": "fernsehen viết liền cuối câu."}, {"q": "Warten Sie bitte hier!", "start": "Können Sie", "a": ["Können Sie bitte hier warten", "Können Sie hier bitte warten"], "e": "Lời đề nghị lịch sự với können."}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "du / heute Abend / mitkommen / ?", "a": ["Kommst du heute Abend mit"], "e": "Câu hỏi có/không: động từ đầu câu, mit cuối câu."}, {"q": "ich / am Wochenende / mein Zimmer / aufräumen / müssen", "a": ["Ich muss am Wochenende mein Zimmer aufräumen", "Am Wochenende muss ich mein Zimmer aufräumen"], "e": "muss vị trí 2, aufräumen cuối câu."}, {"q": "Lisa / jeden Morgen / im Park / laufen", "a": ["Lisa läuft jeden Morgen im Park", "Jeden Morgen läuft Lisa im Park"], "e": "au → äu: läuft."}, {"q": "ihr / Deutsch / sprechen / können / ?", "a": ["Könnt ihr Deutsch sprechen"], "e": "Könnt đầu câu, sprechen cuối câu."}]}]}]},
3:{"title": "ĐỀ ÔN TẬP SỐ 3", "sub": "Verben 1 · Kapitel 1–8", "code": "103", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ eine E-Mail an meinen Chef.", "o": ["lese", "höre", "spreche", "schreibe"], "a": 3, "e": "schreiben = viết."}, {"q": "Im Sommer _____ wir ans Meer.", "o": ["kochen", "schlafen", "fahren", "trinken"], "a": 2, "e": "fahren = đi (bằng xe)."}, {"q": "Der Laden _____ um 9 Uhr auf.", "o": ["steht", "macht", "ruft", "kauft"], "a": 1, "e": "aufmachen = mở cửa."}, {"q": "Ich bin müde. Ich _____ jetzt ins Bett.", "o": ["gehe", "esse", "lese", "arbeite"], "a": 0, "e": "ins Bett gehen = đi ngủ."}, {"q": "„_____ du Geschwister?“ – „Ja, eine Schwester.“", "o": ["Bist", "Heißt", "Kommst", "Hast"], "a": 3, "e": "Geschwister haben = có anh chị em."}, {"q": "Meine Nummer ist 0151 2345678. Du kannst mich morgen _____.", "o": ["aufstehen", "fernsehen", "anrufen", "einkaufen"], "a": 2, "e": "anrufen = gọi điện."}, {"q": "Wir _____ Freunde zum Abendessen ein.", "o": ["kaufen", "laden", "rufen", "machen"], "a": 1, "e": "einladen = mời."}, {"q": "Nach dem Essen _____ ich das Geschirr.", "o": ["spüle", "koche", "esse", "trinke"], "a": 0, "e": "spülen = rửa bát."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Woher _____ ihr?", "o": ["kommt", "kommen", "kommst", "komme"], "a": 0, "e": "ihr kommt."}, {"q": "„Wo ist die Brille?“ – „_____ liegt auf dem Sofa.“", "o": ["Er", "Es", "Ihr", "Sie"], "a": 3, "e": "die Brille → sie."}, {"q": "Tom und Lisa, _____ ihr heute Abend Zeit?", "o": ["haben", "hast", "habt", "hat"], "a": 2, "e": "ihr habt."}, {"q": "Mein Opa _____ gern im Garten.", "o": ["arbeitt", "arbeitet", "arbeiten", "arbeitest"], "a": 1, "e": "Gốc -t → arbeitet."}, {"q": "Er _____ immer den Zug um 8 Uhr.", "o": ["nimmt", "nehmt", "nimmst", "nehmen"], "a": 0, "e": "nehmen → er nimmt."}, {"q": "Ich _____ heute leider nicht kommen.", "o": ["kannst", "können", "könnt", "kann"], "a": 3, "e": "ich kann."}, {"q": "Im Krankenhaus _____ man das Handy ausmachen.", "o": ["darf", "will", "muss", "möchte"], "a": 2, "e": "Bắt buộc → müssen."}, {"q": "Wann _____?", "o": ["der Film fängt an", "fängt der Film an", "fängt an der Film", "anfängt der Film"], "a": 1, "e": "Từ hỏi – động từ – chủ ngữ – … – tiền tố."}, {"q": "Peter, _____ nicht so viel Schokolade!", "o": ["iss", "isst", "esse", "esst"], "a": 0, "e": "Imperativ du của essen: Iss!"}, {"q": "Ich habe morgen eine Prüfung. Ich _____ heute lange lernen.", "o": ["darf", "möchtet", "könnt", "muss"], "a": 3, "e": "Cần thiết → müssen."}, {"q": "_____ Sie bitte langsam!", "o": ["Sprich", "Sprecht", "Sprechen", "Sprichst"], "a": 2, "e": "Imperativ Sie: nguyên mẫu + Sie."}, {"q": "Meine Nachbarn _____ aus Polen.", "o": ["kommt", "kommen", "kommst", "komme"], "a": 1, "e": "Số nhiều → kommen."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Mein Name {1} Hoa. Ich komme aus Da Nang und lebe seit einem Jahr in Leipzig. Ich studiere Informatik. Mein Studium ist interessant, aber {2} ist auch schwer. Jeden Tag {3} ich viel lernen. Am Abend {4} ich oft mit meiner Mitbewohnerin. {5} kommt aus Spanien und kocht sehr gut. Am Sonntag schlafen wir lange und {6} dann zusammen im Park spazieren.", "qs": [{"o": ["bin", "ist", "sind", "bist"], "a": 1, "e": "Mein Name ist …"}, {"o": ["es", "er", "sie", "ihr"], "a": 0, "e": "das Studium → es."}, {"o": ["müssen", "musst", "müsst", "muss"], "a": 3, "e": "ich muss."}, {"o": ["kocht", "kochst", "koche", "kochen"], "a": 2, "e": "ich koche."}, {"o": ["Er", "Sie", "Es", "Ihr"], "a": 1, "e": "die Mitbewohnerin → sie."}, {"o": ["gehen", "geht", "gehe", "gehst"], "a": 0, "e": "wir gehen."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Herr Schulz ist 68 Jahre alt und arbeitet nicht mehr. Er wohnt allein in einem kleinen Haus in Freiburg. Jeden Morgen läuft er eine halbe Stunde im Wald. Dann frühstückt er und liest die Zeitung. Am Dienstag und am Donnerstag hilft er Kindern bei den Hausaufgaben. Er spricht gut Englisch und Französisch und möchte jetzt Italienisch lernen, denn er will im Mai mit seiner Tochter nach Rom fahren.", "qs": [{"q": "Was macht Herr Schulz jeden Morgen zuerst?", "o": ["Er frühstückt.", "Er liest die Zeitung.", "Er läuft im Wald.", "Er hilft Kindern."], "a": 2, "e": "„Jeden Morgen läuft er … Dann frühstückt er …“"}, {"q": "Wann hilft er Kindern?", "o": ["Jeden Morgen", "Am Dienstag und Donnerstag", "Am Wochenende", "Im Mai"], "a": 1, "e": "„Am Dienstag und am Donnerstag hilft er Kindern …“"}, {"q": "Welche Sprache spricht er noch NICHT?", "o": ["Italienisch", "Englisch", "Französisch", "Deutsch"], "a": 0, "e": "Ông ấy mới muốn học tiếng Ý."}, {"q": "Warum möchte er Italienisch lernen?", "o": ["Seine Tochter wohnt in Italien.", "Er arbeitet in Italien.", "Die Kinder lernen Italienisch.", "Er fährt im Mai nach Rom."], "a": 3, "e": "„… denn er will im Mai … nach Rom fahren“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Meine Eltern {A|wohnt} {B|seit} zehn Jahren {C|in} {D|Berlin}.", "a": 0, "fix": "wohnen", "e": "Số nhiều → wohnen."}, {"q": "{A|Kannst} du {B|kochen} {C|heute} {D|Abend}?", "a": 1, "fix": "kochen phải đứng cuối câu", "e": "Nguyên mẫu ở cuối câu: Kannst du heute Abend kochen?"}, {"q": "Das Auto {A|ist} alt, {B|aber} {C|sie} {D|fährt} noch gut.", "a": 2, "fix": "es", "e": "das Auto → es."}, {"q": "Er {A|fahrt} {B|jeden Tag} {C|mit dem Rad} {D|zur Arbeit}.", "a": 0, "fix": "fährt", "e": "a → ä ở ngôi er."}, {"q": "Frau Lange, {A|komm} {B|bitte} {C|herein}, {D|der Arzt} wartet.", "a": 0, "fix": "kommen Sie", "e": "Với Frau Lange dùng Imperativ lịch sự: Kommen Sie bitte herein!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Lukas spielt sehr gut Gitarre.", "o": ["Lukas kann sehr gut Gitarre spielen.", "Lukas will Gitarre spielen.", "Lukas muss Gitarre spielen.", "Lukas darf Gitarre spielen."], "a": 0, "e": "Kỹ năng → können."}, {"q": "Der Arzt sagt: „Trinken Sie mehr Wasser!“", "o": ["Ich darf kein Wasser trinken.", "Ich will mehr Wasser trinken.", "Ich kann kein Wasser trinken.", "Ich soll mehr Wasser trinken."], "a": 3, "e": "Lời khuyên của người khác → sollen."}, {"q": "Telefonieren ist im Kino verboten.", "o": ["Im Kino muss man telefonieren.", "Im Kino kann man gut telefonieren.", "Im Kino darf man nicht telefonieren.", "Im Kino möchte man telefonieren."], "a": 2, "e": "verboten = nicht dürfen."}, {"q": "Einen Kaffee, bitte!", "o": ["Ich muss einen Kaffee kochen.", "Ich möchte bitte einen Kaffee.", "Ich darf keinen Kaffee trinken.", "Ich soll einen Kaffee kaufen."], "a": 1, "e": "Gọi đồ lịch sự → möchten."}, {"q": "Ihr müsst heute nicht kommen.", "o": ["Ihr könnt kommen, aber es ist nicht nötig.", "Ihr dürft heute nicht kommen.", "Ihr wollt heute nicht kommen.", "Ihr könnt heute nicht kommen."], "a": 0, "e": "nicht müssen = không cần."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "___ (lesen) du gern Zeitung?", "a": ["liest"], "e": "du liest."}, {"q": "Wir ___ (haben) einen Hund.", "a": ["haben"], "e": "wir haben."}, {"q": "Der Film ___ (gefallen) mir sehr.", "a": ["gefällt"], "e": "a → ä: gefällt."}, {"q": "___ (sein) bitte pünktlich, Max!", "a": ["sei"], "e": "Imperativ du của sein: Sei!"}, {"q": "Ihr ___ (müssen) mehr lernen.", "a": ["müsst", "müßt"], "e": "ihr müsst."}, {"q": "Mia ___ (tragen) eine rote Jacke.", "a": ["trägt"], "e": "a → ä."}, {"q": "Ich ___ (einkaufen) heute im Supermarkt ein.", "a": ["kaufe"], "e": "kaufe … ein."}, {"q": "Du ___ (reden) zu viel.", "a": ["redest"], "e": "Gốc -d → du redest."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Wir laden unsere Nachbarn ein. (möchten)", "start": "Wir möchten", "a": ["Wir möchten unsere Nachbarn einladen"], "e": "einladen viết liền cuối câu."}, {"q": "Kannst du bitte langsam fahren?", "start": "Fahr", "a": ["Fahr bitte langsam", "Fahr langsam bitte", "Fahr langsam"], "e": "Imperativ du, bỏ umlaut: Fahr!"}, {"q": "Ich lerne am Abend Deutsch.", "start": "Am Abend", "a": ["Am Abend lerne ich Deutsch"], "e": "Trạng ngữ vị trí 1 → động từ vị trí 2."}, {"q": "Parken ist hier erlaubt.", "start": "Man", "a": ["Man darf hier parken"], "e": "erlaubt = dürfen."}, {"q": "Er steht um fünf Uhr auf. (müssen)", "start": "Er muss", "a": ["Er muss um fünf Uhr aufstehen"], "e": "aufstehen cuối câu."}, {"q": "Lies den Text! (đổi sang ngôi Sie)", "start": "Lesen", "a": ["Lesen Sie den Text"], "e": "Imperativ Sie: nguyên mẫu + Sie."}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "wir / morgen / nach Hamburg / fahren / wollen", "a": ["Wir wollen morgen nach Hamburg fahren", "Morgen wollen wir nach Hamburg fahren"], "e": "wollen vị trí 2, fahren cuối câu."}, {"q": "der Unterricht / um neun Uhr / anfangen", "a": ["Der Unterricht fängt um neun Uhr an", "Um neun Uhr fängt der Unterricht an"], "e": "fängt … an."}, {"q": "du / Fleisch / essen / ?", "a": ["Isst du Fleisch"], "e": "Động từ đầu câu; du isst."}, {"q": "ich / heute / nicht / kommen / können", "a": ["Ich kann heute nicht kommen", "Heute kann ich nicht kommen"], "e": "kann vị trí 2, kommen cuối câu."}]}]}]},
4:{"title": "ĐỀ ÔN TẬP SỐ 4", "sub": "Verben 1 · Kapitel 1–8", "code": "104", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ jeden Tag mit dem Fahrrad zur Uni.", "o": ["fahre", "gehe", "fliege", "schwimme"], "a": 0, "e": "Mit dem Fahrrad fahren."}, {"q": "Es ist kalt. Mach bitte das Fenster _____!", "o": ["auf", "an", "ein", "zu"], "a": 3, "e": "zumachen = đóng."}, {"q": "Am Abend _____ wir oft zusammen Karten.", "o": ["schreiben", "lesen", "spielen", "kochen"], "a": 2, "e": "Karten spielen = chơi bài."}, {"q": "Im Restaurant _____ ich eine Pizza.", "o": ["verkaufe", "bestelle", "wasche", "schreibe"], "a": 1, "e": "bestellen = gọi món."}, {"q": "Ich _____ meine Freundin am Bahnhof ab.", "o": ["hole", "mache", "gehe", "rufe"], "a": 0, "e": "abholen = đón."}, {"q": "„Was _____ du von Beruf?“ – „Ich bin Krankenschwester.“", "o": ["gehst", "heißt", "kommst", "machst"], "a": 3, "e": "Was machst du von Beruf?"}, {"q": "Wir _____ im Juli nach Spanien.", "o": ["schwimmen", "schlafen", "fliegen", "essen"], "a": 2, "e": "fliegen = bay."}, {"q": "Die Kinder _____ im Garten.", "o": ["kochen", "spielen", "arbeiten", "studieren"], "a": 1, "e": "spielen = chơi."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Das ist Herr Kim. _____ kommt aus Korea.", "o": ["Sie", "Er", "Es", "Ihr"], "a": 1, "e": "Một người nam → er."}, {"q": "„Wie findest du den Rock?“ – „_____ ist sehr schön.“", "o": ["Er", "Sie", "Es", "Ihr"], "a": 0, "e": "der Rock → er."}, {"q": "Wir _____ heute keine Zeit.", "o": ["habt", "hat", "hast", "haben"], "a": 3, "e": "wir haben."}, {"q": "Du _____ immer so schnell!", "o": ["fahrst", "fährt", "fährst", "fahrt"], "a": 2, "e": "a → ä ở ngôi du."}, {"q": "Was _____ ihr am Wochenende?", "o": ["machen", "macht", "machst", "mache"], "a": 1, "e": "ihr macht."}, {"q": "Hier _____ man nicht schwimmen. Das ist gefährlich.", "o": ["darf", "muss", "will", "möchte"], "a": 0, "e": "Bị cấm → nicht dürfen."}, {"q": "Mia _____ Ärztin werden. Das ist ihr Traum.", "o": ["muss", "soll", "darf", "will"], "a": 3, "e": "Ước mơ, ý muốn → wollen."}, {"q": "Wir _____ am Hauptbahnhof _____.", "o": ["aussteigen … –", "steigt … aus", "steigen … aus", "steigen … auf"], "a": 2, "e": "aussteigen = xuống xe → steigen … aus."}, {"q": "_____ Sie mir bitte Ihren Namen!", "o": ["Sag", "Sagen", "Sagt", "Sagst"], "a": 1, "e": "Imperativ Sie."}, {"q": "Mein Bruder _____ sehr gut tanzen.", "o": ["kann", "kannst", "könnt", "können"], "a": 0, "e": "er kann."}, {"q": "Jeden Tag _____.", "o": ["ich lerne Deutsch", "lerne Deutsch ich", "ich Deutsch lerne", "lerne ich Deutsch"], "a": 3, "e": "Trạng ngữ đầu câu → động từ vị trí 2."}, {"q": "Mama, _____ ich heute bei Lisa übernachten?", "o": ["muss", "soll", "darf", "will"], "a": 2, "e": "Xin phép → dürfen."}]}, {"h": "Đọc đoạn văn và chọn từ đúng (A, B, C hoặc D) cho mỗi chỗ trống.", "s": "Điền từ vào đoạn văn", "pts": 0.9, "type": "mc", "text": "Hallo Jan! Wir machen am Samstag eine Party. {1} du auch kommen? Die Party {2} um 19 Uhr an. Bring bitte etwas zu trinken {3}! Meine Schwester Nina kommt auch, {4} ist gerade aus London zurück. Wir {5} Musik und tanzen. Du {6} mich gern anrufen, meine Nummer ist 0170 1234567. Viele Grüße, Lea", "qs": [{"o": ["Möchte", "Möchtet", "Möchtest", "Möchten"], "a": 2, "e": "du möchtest."}, {"o": ["fangt", "fängt", "fängst", "fangen"], "a": 1, "e": "anfangen → fängt … an."}, {"o": ["mit", "an", "auf", "ein"], "a": 0, "e": "mitbringen = mang theo."}, {"o": ["er", "es", "ihr", "sie"], "a": 3, "e": "Nina → sie."}, {"o": ["hört", "hörst", "hören", "höre"], "a": 2, "e": "wir hören."}, {"o": ["kann", "kannst", "könnt", "können"], "a": 1, "e": "du kannst."}]}, {"h": "Đọc đoạn văn và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Familie Nguyen wohnt seit drei Jahren in Stuttgart. Herr Nguyen arbeitet bei einer Autofirma, Frau Nguyen hat ein kleines Restaurant. Sie haben zwei Kinder: Minh ist zwölf und spielt in einem Fußballverein, die kleine Lan ist fünf und geht in den Kindergarten. Am Montag ist das Restaurant geschlossen. Dann kocht Frau Nguyen nicht, und die Familie isst bei Freunden oder fährt in die Stadt. Die Kinder sprechen schon sehr gut Deutsch, aber die Eltern müssen noch viel lernen.", "qs": [{"q": "Wo arbeitet Frau Nguyen?", "o": ["Bei einer Autofirma", "Im Kindergarten", "In einem Fußballverein", "In ihrem Restaurant"], "a": 3, "e": "„Frau Nguyen hat ein kleines Restaurant“."}, {"q": "Wie alt ist Lan?", "o": ["Zwölf", "Drei", "Fünf", "Zwei"], "a": 2, "e": "„die kleine Lan ist fünf“."}, {"q": "Was ist am Montag?", "o": ["Minh spielt Fußball.", "Das Restaurant ist geschlossen.", "Herr Nguyen arbeitet nicht.", "Die Familie kocht zu Hause."], "a": 1, "e": "„Am Montag ist das Restaurant geschlossen“."}, {"q": "Wer spricht schon sehr gut Deutsch?", "o": ["Die Kinder", "Die Eltern", "Herr Nguyen", "Frau Nguyen"], "a": 0, "e": "„Die Kinder sprechen schon sehr gut Deutsch“."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Ihr {A|hast} {B|heute} {C|keine} Zeit, {D|oder}?", "a": 0, "fix": "habt", "e": "ihr habt."}, {"q": "Er {A|will} {B|morgen} {C|kaufen} ein neues {D|Handy}.", "a": 2, "fix": "kaufen phải đứng cuối câu", "e": "Er will morgen ein neues Handy kaufen."}, {"q": "Mein Vater {A|liest} gern Zeitung, {B|aber} {C|meine Mutter} {D|lest} lieber Bücher.", "a": 3, "fix": "liest", "e": "Ngôi sie: e → ie."}, {"q": "Das Handy {A|ist} neu, {B|aber} {C|er} {D|funktioniert} nicht.", "a": 2, "fix": "es", "e": "das Handy → es."}, {"q": "Anna und Tom, {A|komm} {B|bitte} {C|schnell} {D|her}!", "a": 0, "fix": "kommt", "e": "Nói với hai người → ngôi ihr: Kommt!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Kommen Sie bitte morgen um 9 Uhr!", "o": ["Sie kommen morgen nicht.", "Können Sie bitte morgen um 9 Uhr kommen?", "Sie dürfen morgen nicht kommen.", "Kommen Sie morgen um 9 Uhr nicht?"], "a": 1, "e": "Imperativ lịch sự ≈ lời đề nghị với können."}, {"q": "Mein Plan: nächstes Jahr in Deutschland studieren.", "o": ["Ich will nächstes Jahr in Deutschland studieren.", "Ich muss nächstes Jahr in Deutschland studieren.", "Ich darf nächstes Jahr nicht in Deutschland studieren.", "Ich soll nächstes Jahr in Deutschland studieren."], "a": 0, "e": "Kế hoạch của bản thân → wollen."}, {"q": "Im Park ist Fußballspielen erlaubt.", "o": ["Im Park muss man Fußball spielen.", "Im Park darf man nicht Fußball spielen.", "Im Park will man Fußball spielen.", "Im Park darf man Fußball spielen."], "a": 3, "e": "erlaubt = dürfen."}, {"q": "Unsere Lehrerin sagt: „Lernt die Wörter!“", "o": ["Wir dürfen die Wörter nicht lernen.", "Wir wollen die Wörter lernen.", "Wir sollen die Wörter lernen.", "Wir können die Wörter lernen."], "a": 2, "e": "Yêu cầu của người khác → sollen."}, {"q": "Mein Bruder hat keinen Führerschein.", "o": ["Mein Bruder kann sehr gut Auto fahren.", "Mein Bruder darf nicht Auto fahren.", "Mein Bruder muss Auto fahren.", "Mein Bruder will Auto fahren."], "a": 1, "e": "Không có bằng lái → không được phép lái: nicht dürfen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Wann ___ (fahren) der Zug ab?", "a": ["fährt"], "e": "fährt … ab."}, {"q": "Du ___ (sein) mein bester Freund.", "a": ["bist"], "e": "du bist."}, {"q": "Er ___ (essen) kein Fleisch.", "a": ["isst", "ißt"], "e": "er isst."}, {"q": "___ (nehmen) Sie bitte Platz!", "a": ["nehmen"], "e": "Imperativ Sie không đổi nguyên âm."}, {"q": "Wir ___ (dürfen) heute länger bleiben.", "a": ["dürfen"], "e": "wir dürfen."}, {"q": "Mein Kollege ___ (arbeiten) auch am Samstag.", "a": ["arbeitet"], "e": "Gốc -t → arbeitet."}, {"q": "___ (geben) ihr mir bitte den Schlüssel?", "a": ["gebt"], "e": "ihr gebt (không đổi nguyên âm)."}, {"q": "Ich ___ (anfangen) morgen einen Deutschkurs an.", "a": ["fange"], "e": "ich fange … an."}]}, {"h": "Viết lại câu, bắt đầu bằng từ cho sẵn, sao cho nghĩa không đổi hoặc theo gợi ý trong ngoặc.", "s": "Viết lại câu", "pts": 1.5, "type": "write", "qs": [{"q": "Ich hole dich um acht Uhr ab. (können)", "start": "Ich kann", "a": ["Ich kann dich um acht Uhr abholen"], "e": "abholen cuối câu."}, {"q": "Kannst du mir bitte helfen?", "start": "Hilf", "a": ["Hilf mir bitte", "Hilf mir"], "e": "Imperativ du: Hilf!"}, {"q": "Wir essen um 12 Uhr zu Mittag.", "start": "Um 12 Uhr", "a": ["Um 12 Uhr essen wir zu Mittag"], "e": "Trạng ngữ vị trí 1 → động từ vị trí 2."}, {"q": "Rauchen ist im Zug verboten.", "start": "Im Zug", "a": ["Im Zug darf man nicht rauchen"], "e": "verboten = nicht dürfen."}, {"q": "Sie sieht jeden Abend fern. (wollen)", "start": "Sie will", "a": ["Sie will jeden Abend fernsehen"], "e": "fernsehen viết liền cuối câu."}, {"q": "Seid bitte ruhig! (đổi sang ngôi du)", "start": "Sei", "a": ["Sei bitte ruhig", "Sei ruhig bitte", "Sei ruhig"], "e": "sein, ngôi du: Sei!"}]}, {"h": "Dùng các từ gợi ý để viết thành câu hoàn chỉnh (chia động từ, sắp xếp đúng trật tự).", "s": "Viết câu từ gợi ý", "pts": 1.5, "type": "write", "qs": [{"q": "Paul / jeden Tag / seine Mutter / anrufen", "a": ["Paul ruft jeden Tag seine Mutter an", "Jeden Tag ruft Paul seine Mutter an", "Paul ruft seine Mutter jeden Tag an"], "e": "ruft … an."}, {"q": "ihr / am Wochenende / Zeit / haben / ?", "a": ["Habt ihr am Wochenende Zeit"], "e": "Câu hỏi có/không: động từ đầu câu."}, {"q": "man / hier / nicht / parken / dürfen", "a": ["Man darf hier nicht parken", "Hier darf man nicht parken"], "e": "darf vị trí 2, parken cuối câu."}, {"q": "du / gut / kochen / können / ?", "a": ["Kannst du gut kochen"], "e": "Kannst đầu câu, kochen cuối câu."}]}]}]},
5:{"title": "ĐỀ ÔN TẬP SỐ 5", "sub": "Verben 1 · Kapitel 1–8", "code": "105", "time": 60, "secs": [{"name": "PHẦN A. TRẮC NGHIỆM", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1.2, "type": "mc", "qs": [{"q": "Ich _____ jeden Abend einen Podcast auf Deutsch.", "o": ["sehe", "höre", "schreibe", "rufe"], "a": 1, "e": "hören = nghe."}, {"q": "Es ist zu laut. Mach bitte die Musik _____!", "o": ["aus", "an", "auf", "ein"], "a": 0, "e": "ausmachen = tắt."}, {"q": "Nach dem Essen _____ wir die Rechnung.", "o": ["bestellen", "kochen", "trinken", "bezahlen"], "a": 3, "e": "bezahlen = trả tiền."}, {"q": "Am Samstag _____ ich mein Zimmer auf.", "o": ["mache", "stehe", "räume", "rufe"], "a": 2, "e": "aufräumen = dọn dẹp."}, {"q": "„Woher _____ Sie?“ – „Aus Österreich.“", "o": ["wohnen", "kommen", "heißen", "gehen"], "a": 1, "e": "Woher kommen Sie?"}, {"q": "Der Zug _____ um 10:30 Uhr in Berlin an.", "o": ["kommt", "fährt", "steht", "macht"], "a": 0, "e": "ankommen = đến nơi."}, {"q": "Ich habe Kopfschmerzen. Ich _____ eine Tablette.", "o": ["gebe", "lese", "schlafe", "nehme"], "a": 3, "e": "eine Tablette nehmen = uống thuốc."}, {"q": "Kannst du mir bitte das Buch _____? Ich möchte es lesen.", "o": ["nehmen", "lesen", "geben", "sehen"], "a": 2, "e": "geben = đưa."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.8, "type": "mc", "qs": [{"q": "Anna und ich _____ in einer WG.", "o": ["wohnt", "wohne", "wohnen", "wohnst"], "a": 2, "e": "Anna + ich = wir."}, {"q": "„Wo ist das Auto?“ – „_____ steht vor dem Haus.“", "o": ["Er", "Es", "Sie", "Ihr"], "a": 1, "e": "das Auto → es."}, {"q": "Ich _____ heute Geburtstag!", "o": ["habe", "bin", "hat", "ist"], "a": 0, "e": "Geburtstag haben."}, {"q": "Er _____ seiner Mutter in der Küche.", "o": ["helft", "hilfst", "helfen", "hilft"], "a": 3, "e": "e → i: er hilft."}, {"q": "Herr Kaya, _____ Sie einen Moment Zeit?",  và chọn đáp án đúng (A, B, C hoặc D) cho mỗi câu hỏi.", "s": "Đọc hiểu", "pts": 0.6, "type": "mc", "text": "Liebe Frau Weber, leider kann ich morgen nicht zum Deutschkurs kommen. Ich bin krank und muss zum Arzt gehen. Können Sie mir bitte die Hausaufgaben per E-Mail schicken? Am Donnerstag komme ich wieder. Dann möchte ich auch den Test schreiben. Vielen Dank und viele Grüße, Thanh", "qs": [{"q": "Warum schreibt Thanh die E-Mail?", "o": ["Er kann morgen nicht zum Kurs kommen.", "Er möchte einen neuen Kurs.", "Er sucht einen Arzt.", "Er hat keine Hausaufgaben."], "a": 0, "e": "„… leider kann ich morgen nicht zum Deutschkurs kommen“."}, {"q": "Was soll Frau Weber machen?", "o": ["Thanh anrufen.", "Zum Arzt gehen.", "Den Test schreiben.", "Die Hausaufgaben per E-Mail schicken."], "a": 3, "e": "„Können Sie mir bitte die Hausaufgaben per E-Mail schicken?“"}, {"q": "Wann kommt Thanh wieder zum Kurs?", "o": ["Morgen", "Nächste Woche", "Am Donnerstag", "Am Montag"], "a": 2, "e": "„Am Donnerstag komme ich wieder“."}, {"q": "Wer ist Frau Weber wahrscheinlich?", "o": ["Seine Ärztin", "Seine Deutschlehrerin", "Seine Mutter", "Seine Nachbarin"], "a": 1, "e": "Thanh hỏi bà về bài tập của khóa học tiếng Đức."}]}, {"h": "Chọn phần gạch chân (A, B, C hoặc D) cần sửa trong mỗi câu sau.", "s": "Tìm lỗi sai", "pts": 0.75, "type": "err", "qs": [{"q": "Wir {A|ist} {B|heute} {C|sehr} {D|müde}.", "a": 0, "fix": "sind", "e": "wir sind."}, {"q": "{A|Morgen} {B|ich fahre} {C|nach} {D|München}.", "a": 1, "fix": "fahre ich", "e": "Trạng ngữ đầu câu → động từ vị trí 2, chủ ngữ theo sau."}, {"q": "Mein Bruder {A|isst} gern Pizza, {B|aber} ich {C|isst} lieber {D|Reis}.", "a": 2, "fix": "esse", "e": "Ngôi ich không đổi nguyên âm: ich esse."}, {"q": "Er {A|möchtet} {B|einen} Tee {C|mit} {D|Zucker}.", "a": 0, "fix": "möchte", "e": "er möchte, không có -t."}, {"q": "Herr Braun, {A|nimm} {B|bitte} {C|Platz}, {D|der Chef} kommt gleich.", "a": 0, "fix": "nehmen Sie", "e": "Với Herr Braun dùng Imperativ lịch sự: Nehmen Sie bitte Platz!"}]}, {"h": "Chọn câu (A, B, C hoặc D) gần nghĩa nhất với câu đã cho.", "s": "Câu gần nghĩa", "pts": 0.75, "type": "mc", "qs": [{"q": "Unsere Tochter liest schon sehr gut.", "o": ["Unsere Tochter muss lesen.", "Unsere Tochter darf lesen.", "Unsere Tochter kann schon sehr gut lesen.", "Unsere Tochter will nicht lesen."], "a": 2, "e": "Khả năng → können."}, {"q": "Hilf mir bitte!", "o": ["Ich helfe dir.", "Kannst du mir bitte helfen?", "Du hilfst mir nicht.", "Helft mir bitte!"], "a": 1, "e": "Imperativ du ≈ lời nhờ với können; „Helft“ là nói với ihr."}, {"q": "Schwimmen ist hier verboten.", "o": ["Hier darf man nicht schwimmen.", "Hier muss man schwimmen.", "Hier kann man gut schwimmen.", "Hier möchte man schwimmen."], "a": 0, "e": "verboten = nicht dürfen."}, {"q": "Mitbringen ist nicht nötig.", "o": ["Sie dürfen nichts mitbringen.", "Sie können nichts mitbringen.", "Sie wollen nichts mitbringen.", "Sie müssen nichts mitbringen."], "a": 3, "e": "nicht nötig = nicht müssen."}, {"q": "Mein Chef sagt: „Schreiben Sie den Bericht!“", "o": ["Ich will den Bericht schreiben.", "Ich darf den Bericht nicht schreiben.", "Ich soll den Bericht schreiben.", "Ich kann den Bericht nicht schreiben."], "a": 2, "e": "Yêu cầu của người khác → sollen."}]}]}, {"name": "PHẦN B. TỰ LUẬN", "items": [{"h": "Chia động từ trong ngoặc ở dạng đúng.", "s": "Chia động từ", "pts": 1, "type": "fill", "qs": [{"q": "Wie ___ (heißen) du?", "a": ["heißt", "heisst"], "e": "Gốc -ß → du heißt."}, {"q": "Ihr ___ (haben) ein schönes Auto.", "a": ["habt"], "e": "ihr habt."}, {"q": "Mein Opa ___ (schlafen) nach dem Essen.", "a": ["schläft"], "e": "a → ä."}, {"q": "___ (lesen) bitte laut, Mia!", "a": ["lies"], "e": "Imperativ du: Lies!"}, {"q": "Er ___ (müssen) heute zum Arzt.", "a": ["muss", "muß"], "e": "er muss."}, {"q": "Wir ___ (aussteigen) an der nächsten Haltestelle aus.", "a": ["steigen"], "e": "steigen … aus."}, {"q": "Du ___ (antworten) nicht!", "a": ["antwortest"], "e" "kt1":{"title": "ĐỀ KIỂM TRA NĂNG LỰC", "sub": "Verben 1 · Kapitel 1–8", "code": "KT1", "time": 60, "test": true, "pass": 7, "n": 80, "req": [1, 2, 3, 4, 5], "secs": [{"name": "PHẦN A. TRẮC NGHIỆM (câu 1–50)", "items": [{"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — từ vựng.", "s": "Từ vựng", "pts": 1, "type": "mc", "qs": [{"q": "Ich _____ jeden Sonntag meine Eltern an.", "o": ["mache", "rufe", "stehe", "kaufe"], "a": 1, "e": "anrufen = gọi điện."}, {"q": "Bitte _____ Sie hier Ihren Namen!", "o": ["schreiben", "lesen", "hören", "trinken"], "a": 0, "e": "schreiben = viết."}, {"q": "Am Wochenende _____ ich gern lange.", "o": ["stehe", "rufe", "mache", "schlafe"], "a": 3, "e": "lange schlafen = ngủ nướng."}, {"q": "Wir _____ heute Abend einen Film im Kino.", "o": ["hören", "lesen", "sehen", "schreiben"], "a": 2, "e": "einen Film sehen = xem phim."}, {"q": "Der Supermarkt _____ um 20 Uhr zu.", "o": ["kommt", "macht", "steht", "fährt"], "a": 1, "e": "zumachen = đóng cửa."}, {"q": "Ich _____ meinen Kaffee immer mit Milch.", "o": ["trinke", "esse", "lese", "schlafe"], "a": 0, "e": "Kaffee trinken."}, {"q": "Kannst du mich morgen am Flughafen _____?", "o": ["aufstehen", "fernsehen", "anfangen", "abholen"], "a": 3, "e": "abholen = đón."}, {"q": "„Was _____ du in deiner Freizeit?“ – „Ich spiele Gitarre.“", "o": ["bist", "heißt", "machst", "kommst"], "a": 2, "e": "Was machst du …?"}, {"q": "Es regnet. _____ einen Regenschirm mit!", "o": ["Gib", "Nimm", "Iss", "Lies"], "a": 1, "e": "mitnehmen = mang theo → Nimm … mit!"}, {"q": "Er _____ in einer Bank. Er ist Bankkaufmann.", "o": ["arbeitet", "wohnt", "schläft", "spielt"], "a": 0, "e": "arbeiten = làm việc."}]}, {"h": "Chọn đáp án đúng (A, B, C hoặc D) để hoàn thành mỗi câu sau — ngữ pháp.", "s": "Ngữ pháp", "pts": 1.6, "type": "mc", "qs": [{"q": "Meine Freundin und ich _____ zusammen Deutsch.", "o": ["lernt", "lerne", "lernen", "lernst"], "a": 2, "e": "… und ich = wir."}, {"q": "„Wo ist der Kuli?“ – „_____  // skills
 const agg={};LOG.filter(e=>e.type=='exam'&&e.secs).forEach(e=>e.secs.forEach(x=>{const a=agg[x.s]||(agg[x.s]={ok:0,n:0});a.ok+=x.ok;a.n+=x.n}));
 const sk=Object.entries(agg).map(([s,a])=>({s,ok:a.ok,n:a.n,p:Math.round(a.ok/a.n*100)})).sort((a,b)=>a.p-b.p);

 // to-do

 qk.filter(k=>ratio(k)!=null&&ratio(k)<.8).sort((a,b)=>ratio(a)-ratio(b)).forEach(k=>imp.push(ti(`<b>${lab(k)}. ${esc(title(k))}</b> — mới đạt ${Math.round(ratio(k)*100)}%. Đọc lại bài giảng rồi làm lại bài tập.`,`data-k="${k}"`)));
 sk.filter(x=>x.p<70&&x.n>=4).forEach(x=>{const m=SKILL.find(z=>x.s.startsWith(z[0]));if(!m)return;

 exIds.filter(id=>best['w'+id]!=null&&best['w'+id]>2).sort((a,b)=>best['w'+a]-best['w'+b]).forEach(id=>imp.push(ti(`<b>${EXAMS[id].title}</b> — sai ít nhất ${best['w'+id]} câu, cần ≤ 2 để tính vào điều kiện mở khóa.`,`data-de="${id}"`)));
 const gNew=qk.find(k=>k<100&&best[k]==null),vNew=qk.find(k=>k>100&&best[k]==null),eNew=exIds.find(id=>best['de'+id]==null);
 if(gNew!=null)nxt.push(ti(`Học chương mới: <b>${gNew}. ${esc(title(gNew))}</b>`,`data-k="${gNew}"`));
 qk.filter(k=>ratio(k)!=null&&ratio(k)>=.8&&lastT(k)&&Date.now()-lastT(k)>7*864e5).forEach(k=>nxt.push(ti(`Đã ${Math.floor((Date.now()-lastT(k))/864e5)} ngày chưa ôn <b>${lab(k)}. ${esc(title(k))}</b>. Làm lại để nhớ lâu.`,`data-k="${k}"`)));
 if(eNew&&qk.filter(k=>k<100).every(k=>best[k]!=null))nxt.push(ti(`Bạn đã làm hết bài tập các chương — thử <b>${EXAMS[eNew].title}</b>.`,`data-de="${eNew}"`));
 else if(eNew)nxt.push(ti(`Chưa làm <b>${EXAMS[eNew].title}</b>.`,`data-de="${eNew}"`));

 return `<div class="card la"><h2 class="lah">Phân tích học tập</h2>

function recentBox(){const R=ls.get('gaq_recent_'+PID,[]).filter(x=>x.key[0]=='k'?QUIZ[x.key.slice(1)]:EXAMS[x.key.slice(2)]);
 const cards=R.map(x=>{if(x.key[0]=='k'){const k=+x.key.slice(1);return `<button class="rc ${k>100?'t-vocab':'t-gram'}" data-k="${k}"><span class="rimg"></span><span class="rt">${lab(k)}. ${esc(title(k))}</span><span class="lv">${esc(grp(k))}${best[k]!=null?' · '+best[k]+'/'+QUIZ[k].qs.length:''}<br>${fmtT(x.t)}</span></button>`}

const GAMES={wend:{name:'Wend',vi:'Nối chữ tìm từ',ic:'W',desc:'Nối các chữ cái liền kề (cả đường chéo) để tìm các từ ẩn theo chủ đề. Mỗi chữ cái dùng đúng một lần.'},
 climb:{name:'Crossclimb',vi:'Thang chữ',ic:'C',desc:'Giải nghĩa các từ, sắp chúng thành chiếc thang mà hai từ liền nhau chỉ khác đúng một chữ cái, rồi mở khóa từ đầu và từ cuối.'},
 pin:{name:'Pinpoint',vi:'Đoán chủ đề',ic:'P',desc:'Các từ lộ dần từng cái. Đoán xem chúng thuộc chủ đề gì (gõ tiếng Đức hoặc tiếng Việt). Có 5 lượt đoán.'}};
const DIFF={easy:'Dễ',medium:'Trung bình',hard:'Khó'};
const mmss=t=>{t=Math.round((t||0)/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function rngFrom(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shf=(a,r)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickDiff=r=>{const x=r();return x<1/3?'easy':x<2/3?'medium':'hard'};
const nrm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const gAll=()=>ls.get('gaq_games_'+PID,{});
const gToday=g=>{const S=gAll(),d=dkey(new Date());return(S[d]&&S[d][g])||[]};
function gSave(g,plays){const S=gAll(),d=dkey(new Date());(S[d]=S[d]||{})[g]=plays;const cut=dkey(new Date(Date.now()-90*864e5));for(const k in S)if(k<cut)delete S[k];ls.set('gaq_games_'+PID,S)}
function gamesBox(){let h='<h2>Trò chơi</h2><p class="lv">Mỗi trò 3 lượt mỗi ngày, nội dung đổi theo từng lượt và từng ngày, độ khó ngẫu nhiên. Lượt chơi mở lại lúc 0:00.</p>';
 for(const g in GAMES){const G=GAMES[g],P=gToday(g),left=3-P.filter(x=>x.done).length,run=P.find(x=>!x.done);
  h+=`<button class="row${left<=0?' lock':''}" data-g="${g}"><span class="num">${G.ic}</span><span class="t">${G.name} · ${G.vi}<br><span class="lv">${run?'Đang chơi dở lượt '+(run.n+1)+' · ':''}Còn ${left}/3 lượt hôm nay</span></span>${P.filter(x=>x.done).map(x=>`<span class="badge">${x.won?'✓':'✗'} ${DIFF[x.diff]}</span>`).join(' ')}</button>`}
 return h}
function game(g){const G=GAMES[g],plays=gToday(g);let cur=plays.find(x=>!x.done);
 if(!cur){if(plays.length>=3)return gameLocked(g);cur={n:plays.length,done:false};plays.push(cur);gSave(g,plays)}
 const day=dkey(new Date()),r=rngFrom(day+'|'+g+'|'+cur.n),diff=pickDiff(r);cur.diff=diff;gSave(g,plays);
 app.innerHTML=`<a class="back">← Trang chính</a><h1>${G.name} <span class="badge">${DIFF[diff]}</span></h1><p class="sub">${G.vi} · lượt ${cur.n+1}/3 hôm nay. ${G.desc}</p><div class="gbar"><span id="gt">0:00</span><span id="gh">Gợi ý: 0</span></div><div id="gm"></div>`;
 app.querySelector('.back').onclick=()=>go(null);
 const t0=Date.now(),T=app.querySelector('#gt');let hints=0,over=false;tm=setInterval(()=>T.textContent=mmss(Date.now()-t0),1000);
 const ctx={r,diff,hint(){hints++;app.querySelector('#gh').textContent='Gợi ý: '+hints},
  finish(won,summary){if(over)return;over=true;clearInterval(tm);const time=Date.now()-t0;const P=gToday(g),c=P.find(x=>x.n==cur.n)||cur;Object.assign(c,{done:true,won,time,hints,diff});gSave(g,P);
   logAct({type:'game',g,diff,won,time,hints,n:cur.n+1});const left=3-P.filter(x=>x.done).length;
   const box=document.createElement('div');box.className='card rule';box.innerHTML=`<p class="score">${won?'Hoàn thành!':'Chưa giải được'}</p><p>Thời gian ${mmss(time)} · ${hints} gợi ý</p>${summary||''}<div class="acts">${left>0?`<button class="btn" id="nx">Chơi lượt ${4-left}/3</button>`:'<span class="lv">Đã hết 3 lượt hôm nay. Quay lại vào ngày mai nhé.</span>'}<button class="btn ghost" id="hm">Trang chính</button></div>`;
   app.querySelector('#gm').appendChild(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});
   const nx=box.querySelector('#nx');if(nx)nx.onclick=()=>show(null,null,g);box.querySelector('#hm').onclick=()=>go(null)}};
 ({wend:wendGame,climb:climbGame,pin:pinGame})[g](app.querySelector('#gm'),ctx)}
function gameLocked(g){const G=GAMES[g],P=gToday(g);
 app.innerHTML=`<a class="back">← Trang chính</a><h1>${G.name}</h1><div class="card rule"><p>Bạn đã chơi hết <b>3 lượt</b> hôm nay. Lượt mới mở lúc 0:00 ngày mai.</p><table><tr><th>Lượt</th><th>Độ khó</th><th>Kết quả</th><th>Thời gian</th><th>Gợi ý</th></tr>${P.map(x=>`<tr><td>${x.n+1}</td><td>${DIFF[x.diff]||''}</td><td>${x.won?'✓ hoàn thành':'✗ chưa giải'}</td><td>${mmss(x.time)}</td><td>${x.hints||0}</td></tr>`).join('')}</table></div>`;
 app.querySelector('.back').onclick=()=>go(null)}

function wendBuild(r,diff){const S={easy:4,medium:5,hard:6}[diff],N=S*S;
 for(let at=0;at<300;at++){const th=WEND[Math.floor(r()*WEND.length)];const list=shf(th.w.filter(x=>x[0].length<=N-3||x[0].length==N),r);
  let res=null,it=0;const dfs=(i,sum,acc)=>{if(res||it++>5000)return;if(sum==N){if(acc.length>=2)res=acc.slice();return}if(i>=list.length||sum>N||acc.length>=7)return;acc.push(list[i]);dfs(i+1,sum+list[i][0].length,acc);acc.pop();dfs(i+1,sum,acc)};dfs(0,0,[]);
  if(!res)continue;const pl=wendPlace(res.map(x=>x[0]),S,r);if(pl)return{th,words:res,S,...pl}}
 return null}
function wendPlace(words,S,r){const N=S*S,g=new Array(N).fill(-1),paths=[];let budget=60000;
 const nb=i=>{const y=Math.floor(i/S),x=i%S,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dy&&!dx)continue;const yy=y+dy,xx=x+dx;if(yy>=0&&yy<S&&xx>=0&&xx<S)o.push(yy*S+xx)}return o};
 const fr=i=>nb(i).filter(j=>g[j]<0).length;
 const comps=minL=>{const seen=new Array(N).fill(false);for(let i=0;i<N;i++){if(g[i]>=0||seen[i])continue;const st=[i];let sz=0;seen[i]=true;while(st.length){const c=st.pop();sz++;for(const j of nb(c))if(g[j]<0&&!seen[j]){seen[j]=true;st.push(j)}}if(sz<minL)return false}return true};
 const put=k=>{if(k==words.length)return true;if(--budget<0)return false;const L=words[k].length,rest=words.slice(k+1).map(w=>w.length),minL=rest.length?Math.min(...rest):0;
  const em=[];for(let i=0;i<N;i++)if(g[i]<0)em.push(i);const mf=Math.min(...em.map(fr));
  for(const s0 of shf(em.filter(i=>fr(i)==mf),r).slice(0,3)){const path=[s0];g[s0]=k;
   const ext=()=>{if(--budget<0)return false;if(path.length==L)return(!rest.length||comps(minL))&&put(k+1);
    const cand=shf(nb(path[path.length-1]).filter(j=>g[j]<0),r).sort((a,b)=>fr(a)-fr(b));
    for(const j of cand){g[j]=k;path.push(j);if(ext())return true;path.pop();g[j]=-1}return false};
   if(ext()){paths[k]=path.slice();return true}g[s0]=-1}return false};
 for(let tries=0;tries<6;tries++){g.fill(-1);budget=60000;const order=shf(words.map((w,i)=>i),r);const ws=order.map(i=>words[i]);words=ws;if(put(0)){const letters=new Array(N);paths.forEach((p,k)=>p.forEach((c,i)=>letters[c]=words[k][i]));return{letters,paths,order:words}}}
 return null}
function wendGame(el,ctx){const B=wendBuild(ctx.r,ctx.diff);if(!B){el.innerHTML='<p>Không tạo được câu đố, hãy tải lại trang.</p>';return}

 const line=(p,col,w)=>`<polyline points="${p.map(i=>`${i%S+.5},${Math.floor(i/S)+.5}`).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
 const draw=(msg)=>{const fc=[...found.keys()];
  el.innerHTML=`<p style="text-align:center"><b>Chủ đề: ${B.th.t}</b> <span class="lv">(${B.th.vi})</span> · đã tìm ${found.size}/${words.length} từ</p>
  <div class="wcur">${sel.map(i=>B.letters[i]).join('')}</div>
  <div class="wg" style="grid-template-columns:repeat(${S},1fr)">${B.letters.map((ch,i)=>{const o=owner(i);return `<button class="wc${sel.includes(i)?' sel':''}${o>=0?' fd':''}${hintCells.has(i)&&o<0?' hint':''}" data-i="${i}" style="${o>=0?'background:'+WCOL[fc.indexOf(o)%WCOL.length]:''}">${ch}</button>`}).join('')}
  <svg viewBox="0 0 ${S} ${S}" preserveAspectRatio="none">${fc.map((k,x)=>line(B.paths[k],'rgba(0,0,0,.18)',.12)).join('')}${sel.length>1?line(sel,'var(--acc)',.16):''}</svg></div>
